<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HIS-M23 · Mercado · Dos sesiones</title><style>*{box-sizing:border-box} :root{--purple:#643a91;--dark:#271c3b;--teal:#087f89;--line:#ddd7e7}body{margin:0;background:#f6f4f9;color:var(--dark);font-family:Inter,Arial,sans-serif}button,select,textarea{font:inherit}button,select,summary{cursor:pointer}button{border:1px solid var(--line);background:white;color:var(--dark);padding:12px 17px;border-radius:8px}button:hover,button[aria-current=true]{background:var(--purple);color:white}button:focus-visible,summary:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #11a9b5;outline-offset:3px}header{padding:15px 4vw;background:white;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px}header small{display:block;color:var(--teal);margin-top:4px}nav{display:flex;gap:8px;flex-wrap:wrap}.progress{height:4px;background:#e4dfee}.progress div{height:100%;background:linear-gradient(90deg,var(--purple),#13a9b3)}main{max-width:1240px;margin:auto;padding:40px 5vw 100px}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:13px;color:var(--teal);font-weight:bold}h1{font-size:clamp(32px,4vw,55px);line-height:1.1;letter-spacing:-.035em;margin:15px 0}h2{font-size:23px;color:var(--purple);font-weight:500;margin:0 0 30px}p,td,summary{font-size:clamp(18px,1.7vw,23px);line-height:1.55}.lead{font-size:clamp(24px,2.6vw,34px);line-height:1.4}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}article{background:white;padding:22px;border:1px solid var(--line);border-top:4px solid var(--teal);border-radius:12px}article h3{color:var(--purple);font-size:23px;margin:0}article p{margin-bottom:0}details{background:white;border:1px solid var(--line);border-radius:9px;margin:12px 0}summary{padding:17px 20px;color:var(--purple);font-weight:600}.answer{border-top:1px solid var(--line);padding:18px 22px;font-size:21px;line-height:1.55}table{width:100%;border-collapse:collapse;background:white}td,th{text-align:left;padding:15px;border-bottom:1px solid var(--line)}th{background:var(--purple);color:white;font-size:17px}td{font-size:20px}.scroll{overflow-x:auto}.note{font-size:16px;color:#625b6c;border-left:3px solid var(--teal);padding:10px 16px;background:#eeebf4}footer{position:fixed;bottom:0;width:100%;background:#ffffffee;border-top:1px solid var(--line);padding:10px 4vw;display:flex;justify-content:space-between;align-items:center;gap:12px;backdrop-filter:blur(8px)}#counter{font-size:14px}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center}select{padding:12px;border:1px solid var(--line);border-radius:8px}textarea{display:block;width:100%;min-height:110px;padding:14px;margin-top:10px;border:1px solid var(--line);border-radius:8px}label{display:block;margin-top:15px;color:var(--purple)}#chart{width:100%;max-height:370px;background:white;border-radius:10px;margin-top:14px}#result{min-height:60px;color:var(--teal)}dialog{border:1px solid var(--line);border-radius:14px;max-width:800px;width:90%;max-height:85vh}dialog::backdrop{background:#271c3b99}.indexlist{display:grid;gap:8px}.indexlist button{text-align:left}.ref{font-size:14px;color:#6e6477;margin-top:25px}@media(max-width:650px){header{align-items:flex-start;flex-direction:column}main{padding:25px 20px 110px}.grid{grid-template-columns:1fr}td{font-size:17px;padding:10px}footer button{padding:10px}footer #counter{max-width:100px}h2{font-size:20px}}@media print{header,footer,.progress{display:none}main{padding:0}details{break-inside:avoid} }.stack{display:grid;gap:12px;margin:22px 0}.block{background:#fff;border:1px solid #e1d9ec;border-left:5px solid #0c929b;border-radius:12px;padding:17px 22px}.block b{font-size:22px;color:#604086}.block p{margin:6px 0 0}.highlight{background:#eee8f6;border-left:5px solid #7546a0;border-radius:12px;padding:18px 22px;margin:22px 0}.highlight strong{color:#653a8c;text-transform:uppercase;font-size:14px;letter-spacing:.08em}.highlight p{margin:8px 0 0}.question{margin:25px 0;padding:18px 22px;border-radius:12px;background:#eaf7f6;border:1px solid #c5e9e7}.question>b{color:#087f89}.question>p{margin:7px 0}main{max-width:1250px}h1{max-width:1050px}main>p{max-width:1100px}</style><header><div><b>ECONOMÍA / HIS-M23</b><small>Acceso a la justicia y derechos en Chile · Dos sesiones de 80 minutos</small></div><nav aria-label="Sesiones"><button data-session="1">Sesión 1</button><button data-session="2">Sesión 2</button><button id="index">Índice</button><button id="full" aria-label="Alternar pantalla completa">Pantalla completa</button></nav></header><div class="progress"><div id="bar"></div></div><main></main><footer><button id="prev">← Anterior</button><span id="counter" aria-live="polite"></span><button id="next">Siguiente →</button></footer><dialog aria-label="Índice de sesiones"><button id="close">Cerrar índice</button><h2>Elegir un tema</h2><div id="list" class="indexlist"></div></dialog><script>const slides=[{"session": 1, "title": "Clase 1 · Acceso a la justicia y derechos en Chile", "sub": "Sesión 1 · Formación Ciudadana", "body": "<p class=\"lead\">En esta clase exploraremos una pregunta para entender mejor la vida en democracia.</p><div class=\"highlight\"><strong>Pregunta guía</strong><p>¿Qué garantiza una justicia accesible e imparcial?</p></div>", "mins": 3, "ref": "pp. 3–18"}, {"session": 1, "title": "¿Qué aprenderemos hoy?", "sub": "Comprender, relacionar y aplicar", "body": "<p>Explicar los conceptos y situaciones de la guía, relacionándolos con ejemplos cercanos y preguntas de la PAES.</p><div class=\"highlight\"><strong>Pregunta guía</strong><p>¿Qué garantiza una justicia accesible e imparcial?</p></div><p>Al finalizar, trabajaremos con los ejercicios de la guía y conversaremos sobre las alternativas.</p>", "mins": 3, "ref": "pp. 3–18"}, {"session": 1, "title": "Activemos ideas previas", "sub": "Pensemos en lo que ya sabemos", "body": "<div class=\"question\"><b>Para conversar</b><p>¿Qué entiendes por democracia y participación?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">La clase recupera distintas ideas y las relaciona con ejemplos y conceptos de la guía.</div></details></div><div class=\"question\"><b>Para conversar</b><p>¿Cómo podemos justificar una respuesta?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Identificando información relevante y explicando cómo se relaciona con el concepto.</div></details></div>", "mins": 4, "ref": ""}, {"session": 1, "title": "¿Qué es acceder a la justicia?", "sub": "Poder defender derechos y resolver conflictos", "body": "<p>El acceso a la justicia reúne condiciones que permiten acudir a mecanismos adecuados, ser escuchado y obtener una respuesta.</p><p>El dinero, el idioma, la distancia o la falta de información pueden convertirse en barreras que requieren apoyos.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una persona necesita comprender cómo reclamar un derecho.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Basta con que un derecho exista en el papel?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. También se necesitan caminos reales para hacerlo valer.</div></details></div>", "mins": 5, "ref": "pp. 3–6"}, {"session": 1, "title": "¿Qué es el Poder Judicial?", "sub": "Tribunales que conocen y resuelven causas", "body": "<p>El Poder Judicial está integrado por tribunales que ejercen funciones jurisdiccionales conforme a la Constitución y la ley.</p><p>Sus decisiones deben adoptarse con independencia y sometidas al derecho. No reemplaza al Congreso ni al Gobierno.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Un tribunal resuelve un conflicto entre dos personas.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Un juez escribe leyes generales para todos?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Resuelve casos conforme a sus atribuciones; legislar corresponde a otros órganos.</div></details></div>", "mins": 5, "ref": "pp. 7–8"}, {"session": 1, "title": "¿Qué significa independencia?", "sub": "Resolver sin presiones indebidas", "body": "<p>La independencia protege a los tribunales frente a presiones externas y también dentro de la organización judicial.</p><p>No implica ausencia de responsabilidad: las actuaciones pueden revisarse y los jueces deben respetar el derecho.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una autoridad intenta presionar a un juez para obtener un resultado.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Por qué afecta al Estado de derecho?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Porque puede interferir en una decisión que debe adoptarse sin presiones.</div></details></div>", "mins": 5, "ref": "pp. 8–10"}, {"session": 1, "title": "¿Qué es la imparcialidad?", "sub": "Decidir sin favorecer a una parte", "body": "<p>La imparcialidad exige que quien juzga no tenga intereses o vínculos que comprometan su neutralidad en un caso.</p><p>Los procedimientos contemplan formas de plantear inhabilidades cuando se cumplen las condiciones legales.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una de las partes descubre que el juez es tío de su contraparte.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Qué preocupación aparece?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Que un vínculo familiar pueda comprometer la imparcialidad.</div></details></div>", "mins": 5, "ref": "pp. 8–11 y 38"}, {"session": 1, "title": "¿Qué es el debido proceso?", "sub": "Reglas para una decisión justa", "body": "<p>El debido proceso comprende garantías como un tribunal establecido por ley, defensa y oportunidad de ser oído.</p><p>Estas garantías buscan evitar decisiones arbitrarias; su forma concreta depende del tipo de procedimiento.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una persona enfrenta una acusación y debe poder defenderse.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Podría crearse una comisión especial después de ocurrido el hecho para juzgarla?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">La regla del juez establecido previamente busca impedir ese tipo de tribunal creado para el caso.</div></details></div>", "mins": 5, "ref": "pp. 8–11 y 36"}, {"session": 1, "title": "¿Qué es la presunción de inocencia?", "sub": "Nadie debe ser tratado como culpable sin una condena conforme al proceso", "body": "<p>La persona imputada conserva la presunción de inocencia mientras no exista una condena conforme a las reglas del proceso.</p><p>La carga de probar la acusación y el estándar probatorio importan; una medida cautelar no equivale automáticamente a una condena.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Un tribunal condena pese a que las pruebas dejan dudas razonables.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Qué garantía se compromete?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">La presunción de inocencia y la exigencia probatoria aplicable al proceso penal.</div></details></div>", "mins": 5, "ref": "pp. 10–12 y 37"}, {"session": 1, "title": "¿Cómo se organizan los tribunales?", "sub": "Primera instancia y tribunales superiores", "body": "<p>En general, una causa comienza ante un tribunal competente; algunas decisiones pueden revisarse por un tribunal superior mediante los recursos que correspondan.</p><p>La Corte Suprema y las Cortes de Apelaciones cumplen funciones distintas. No toda decisión tiene necesariamente el mismo tipo de recurso.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una sentencia puede ser revisada si procede una apelación.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Para qué sirve la revisión?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Para reducir el riesgo de que una decisión errónea permanezca sin corrección.</div></details></div>", "mins": 5, "ref": "pp. 14–18"}, {"session": 1, "title": "¿Quiénes participan en un caso penal?", "sub": "Investigar, defender y juzgar son tareas distintas", "body": "<p>El Ministerio Público dirige la investigación penal; la defensa protege los derechos de la persona imputada.</p><p>Los tribunales controlan y resuelven las materias que les corresponden. La víctima también tiene derechos dentro del procedimiento.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una persona es imputada por un delito y no tiene abogado.</p></div><div class=\"question\"><b>Para conversar</b><p>¿El fiscal es su defensor?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. El fiscal investiga y puede acusar; la defensa corresponde a un abogado defensor.</div></details></div>", "mins": 5, "ref": "pp. 18–19"}, {"session": 1, "title": "¿Qué ocurre si no hay una regla exacta?", "sub": "El tribunal debe buscar una solución jurídica", "body": "<p>El principio de inexcusabilidad exige que el tribunal competente resuelva un caso aun cuando no haya una norma que lo regule expresamente.</p><p>Para hacerlo puede recurrir a reglas y principios jurídicos pertinentes, según el caso.</p><div class=\"question\"><b>Para conversar</b><p>¿Puede simplemente esperar indefinidamente una nueva ley?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Debe resolver usando las herramientas jurídicas aplicables.</div></details></div>", "mins": 3, "ref": "pp. 8–13"}, {"session": 1, "title": "Practiquemos con la guía", "sub": "Preguntas 1, 2, 3, 5, 7", "body": "<p>Resuelve primero en la guía. Luego explica tu alternativa y compara con la revisión.</p><details><summary>Pregunta 1 · Reforma Procesal Penal</summary><div class=\"answer\"><b>Respuesta: B.</b> La persecución penal se asignó a un organismo autónomo: el Ministerio Público.<p><b>Para descartar:</b> El tribunal no asume la función general de investigar y acusar.</p></div></details><details><summary>Pregunta 2 · Tribunal establecido previamente</summary><div class=\"answer\"><b>Respuesta: B.</b> La regla protege un juzgamiento conforme a garantías del debido proceso y frente a tribunales especiales creados para el caso.<p><b>Para descartar:</b> La publicidad se relaciona con otra garantía distinta.</p></div></details><details><summary>Pregunta 3 · Ausencia de regulación expresa</summary><div class=\"answer\"><b>Respuesta: D.</b> En el caso hipotético, el tribunal debe resolver y puede recurrir a normas aplicables o analogía.<p><b>Para descartar:</b> No debe suspender indefinidamente el caso esperando una ley.</p></div></details><details><summary>Pregunta 5 · Presunción de inocencia</summary><div class=\"answer\"><b>Respuesta: D.</b> Condenar cuando subsisten dudas razonables vulnera el estándar penal indicado.<p><b>Para descartar:</b> Investigar o decretar una cautelar no equivale por sí solo a una condena.</p></div></details><details><summary>Pregunta 7 · Imparcialidad</summary><div class=\"answer\"><b>Respuesta: A.</b> La relación familiar descrita puede justificar la inhabilidad del juez.<p><b>Para descartar:</b> Vivir en la misma comuna no demuestra por sí solo parcialidad.</p></div></details><label>Mis apuntes<textarea data-note=\"s1\" placeholder=\"¿Qué entendí? ¿Qué necesito repasar?\"></textarea></label>", "mins": 22, "ref": "pp. 36–39"}, {"session": 1, "title": "Cerremos la clase", "sub": "Volvamos a la pregunta guía", "body": "<div class=\"question\"><b>Para conversar</b><p>¿Qué garantiza una justicia accesible e imparcial?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Se requieren tribunales independientes e imparciales, defensa, procedimientos y condiciones reales de acceso.</div></details></div><div class=\"question\"><b>Para conversar</b><p>¿Cómo abordar una pregunta PAES?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Identifico qué se pregunta, busco el dato clave y comparo las alternativas antes de decidir.</div></details></div>", "mins": 5, "ref": ""}, {"session": 2, "title": "Clase 2 · Acceso a la justicia y derechos en Chile", "sub": "Sesión 2 · Formación Ciudadana", "body": "<p class=\"lead\">En esta clase exploraremos una pregunta para entender mejor la vida en democracia.</p><div class=\"highlight\"><strong>Pregunta guía</strong><p>¿Cómo pueden las personas defender sus derechos?</p></div>", "mins": 3, "ref": "pp. 19–30"}, {"session": 2, "title": "¿Qué aprenderemos hoy?", "sub": "Comprender, relacionar y aplicar", "body": "<p>Explicar los conceptos y situaciones de la guía, relacionándolos con ejemplos cercanos y preguntas de la PAES.</p><div class=\"highlight\"><strong>Pregunta guía</strong><p>¿Cómo pueden las personas defender sus derechos?</p></div><p>Al finalizar, trabajaremos con los ejercicios de la guía y conversaremos sobre las alternativas.</p>", "mins": 3, "ref": "pp. 19–30"}, {"session": 2, "title": "Activemos ideas previas", "sub": "Pensemos en lo que ya sabemos", "body": "<div class=\"question\"><b>Para conversar</b><p>¿Qué idea de la clase anterior recuerdas?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">La clase recupera distintas ideas y las relaciona con ejemplos y conceptos de la guía.</div></details></div><div class=\"question\"><b>Para conversar</b><p>¿Cómo podemos justificar una respuesta?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Identificando información relevante y explicando cómo se relaciona con el concepto.</div></details></div>", "mins": 4, "ref": ""}, {"session": 2, "title": "¿Cómo llega un conflicto a la justicia?", "sub": "El camino depende de la situación", "body": "<p>Una denuncia, querella o demanda puede iniciar o activar procedimientos distintos según el asunto.</p><p>Antes de elegir una vía conviene identificar qué ocurrió, qué derecho se busca proteger y qué autoridad es competente.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una persona quiere demandar el cumplimiento de un contrato.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Es lo mismo que denunciar un delito?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Son situaciones distintas y pueden seguir procedimientos diferentes.</div></details></div>", "mins": 5, "ref": "pp. 19–22"}, {"session": 2, "title": "¿Qué es la defensa penal pública?", "sub": "Apoyo para una persona imputada", "body": "<p>Una persona imputada tiene derecho a defensa. Si no cuenta con defensor, el sistema contempla la designación que corresponda.</p><p>No debe confundirse el papel del defensor con el del fiscal, quien dirige la investigación penal.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una persona imputada aún no ha contratado abogado.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Quién puede defenderla?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Un defensor penal, conforme a las reglas aplicables.</div></details></div>", "mins": 5, "ref": "pp. 18–19 y 39"}, {"session": 2, "title": "¿Qué es la asistencia jurídica?", "sub": "Orientación y apoyo para ejercer derechos", "body": "<p>La asistencia jurídica puede ayudar a personas que enfrentan barreras económicas u otras dificultades para acceder a la justicia.</p><p>La guía explica el cambio gradual desde las Corporaciones de Asistencia Judicial hacia un nuevo servicio. Las condiciones concretas dependen del sistema aplicable.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una persona necesita orientación para enfrentar un conflicto familiar.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Por qué la orientación también es parte del acceso?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Porque ayuda a comprender las opciones y los pasos disponibles.</div></details></div>", "mins": 5, "ref": "pp. 22–23"}, {"session": 2, "title": "¿Qué es el recurso de protección?", "sub": "Una vía para proteger ciertos derechos", "body": "<p>El recurso de protección permite solicitar tutela ante una Corte de Apelaciones cuando se cumplen sus requisitos y se afectan derechos protegidos por esa vía.</p><p>No sirve automáticamente para cualquier conflicto ni reemplaza todos los juicios ordinarios.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una acción u omisión afecta un derecho protegido y se analizan las condiciones del caso.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Por qué hay que revisar el derecho y los requisitos?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Porque la procedencia depende de lo ocurrido y de las reglas del recurso.</div></details></div>", "mins": 5, "ref": "pp. 23–25"}, {"session": 2, "title": "¿Qué es el amparo?", "sub": "Una vía de protección de la libertad personal", "body": "<p>El recurso de amparo busca proteger la libertad personal y la seguridad individual ante situaciones que cumplan sus requisitos.</p><p>Se diferencia del recurso de protección, aunque ambos son mecanismos de tutela de derechos.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una detención podría afectar ilegítimamente la libertad de una persona.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Qué derecho observarías primero?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">La libertad personal y la seguridad individual.</div></details></div>", "mins": 5, "ref": "pp. 25–26"}, {"session": 2, "title": "¿Qué hace la justicia internacional?", "sub": "Puede examinar responsabilidades de los Estados", "body": "<p>El sistema interamericano permite revisar casos bajo condiciones y procedimientos específicos.</p><p>La Corte Interamericana se pronuncia sobre la responsabilidad internacional de Estados, no reemplaza sin más a los tribunales nacionales.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una sentencia pide a un Estado adecuar normas de justicia militar.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Qué se infiere sobre el problema abordado?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Que el tribunal identificó una situación que requería adecuación a estándares internacionales.</div></details></div>", "mins": 5, "ref": "pp. 26–27 y 39"}, {"session": 2, "title": "¿Cómo leer una norma o sentencia?", "sub": "Buscar la regla y sus condiciones", "body": "<p>Identifica quién actúa, qué puede o debe hacer y en qué condiciones. Distingue lo que el texto dice de conclusiones que requieren más información.</p><p>Si preguntan por una inferencia, la respuesta debe apoyarse en la fuente sin agregar hechos no presentados.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una norma busca evitar detenciones que puedan presionar a jueces.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Significa que los jueces nunca pueden ser investigados?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Una garantía de independencia no implica impunidad.</div></details></div>", "mins": 5, "ref": "pp. 28–30 y 38"}, {"session": 2, "title": "¿Cómo responder una pregunta PAES?", "sub": "Leer, identificar y contrastar", "body": "<p>Primero detecta qué pide la pregunta; luego subraya el dato o principio necesario.</p><p>Compara alternativas y descarta las que agregan información, cambian la función de una institución o contradicen la fuente.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una pregunta pide interpretar una norma sobre lenguaje claro.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Qué responderías si el texto dice que el lenguaje jurídico es técnico pero debe ser claro?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Que el juez debe comunicarse con claridad aunque el lenguaje sea técnico.</div></details></div>", "mins": 5, "ref": "pp. 28–30"}, {"session": 2, "title": "Practiquemos con la guía", "sub": "Preguntas 4, 6, 8, 9, 10", "body": "<p>Resuelve primero en la guía. Luego explica tu alternativa y compara con la revisión.</p><details><summary>Pregunta 4 · Lenguaje judicial</summary><div class=\"answer\"><b>Respuesta: B.</b> El texto pide claridad aunque el lenguaje jurídico sea técnico.<p><b>Para descartar:</b> No afirma que todo lenguaje jurídico deba eliminarse.</p></div></details><details><summary>Pregunta 6 · Garantía judicial</summary><div class=\"answer\"><b>Respuesta: D.</b> La norma busca evitar una detención usada como presión contra jueces.<p><b>Para descartar:</b> No significa inmunidad frente a cualquier delito.</p></div></details><details><summary>Pregunta 8 · Doble instancia</summary><div class=\"answer\"><b>Respuesta: C.</b> La revisión permite corregir eventuales errores cuando la apelación procede.<p><b>Para descartar:</b> No busca prolongar el proceso por sí mismo.</p></div></details><details><summary>Pregunta 9 · Sentencia interamericana</summary><div class=\"answer\"><b>Respuesta: A.</b> La orden de impedir que civiles sean juzgados en tribunales militares permite inferir que ese problema existía en la legislación de la época.<p><b>Para descartar:</b> La fuente no afirma que toda la justicia ordinaria dependiera del mando militar.</p></div></details><details><summary>Pregunta 10 · Defensa</summary><div class=\"answer\"><b>Respuesta: C.</b> La persona imputada tiene derecho a defensa y recibirá defensor si carece de uno.<p><b>Para descartar:</b> El fiscal investiga; no asume su defensa.</p></div></details><label>Mis apuntes<textarea data-note=\"s2\" placeholder=\"¿Qué entendí? ¿Qué necesito repasar?\"></textarea></label>", "mins": 25, "ref": "pp. 36–39"}, {"session": 2, "title": "Cerremos la clase", "sub": "Volvamos a la pregunta guía", "body": "<div class=\"question\"><b>Para conversar</b><p>¿Cómo pueden las personas defender sus derechos?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Según el caso, pueden buscar orientación, acudir a tribunales o solicitar mecanismos de tutela con sus requisitos.</div></details></div><div class=\"question\"><b>Para conversar</b><p>¿Cómo abordar una pregunta PAES?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Identifico qué se pregunta, busco el dato clave y comparo las alternativas antes de decidir.</div></details></div>", "mins": 5, "ref": ""}];let pos=0;const main=document.querySelector('main');function show(i){pos=Math.max(0,Math.min(slides.length-1,i));const s=slides[pos];main.innerHTML=`<div class="eyebrow">HIS-M23 / Sesión ${s.session} / ${s.mins} min orientativos</div><h1>${s.title}</h1><h2>${s.sub}</h2>${s.body}<p class="ref">Base: guía HIS-M23, Acceso a la justicia y derechos en Chile. ${s.ref}</p>`;document.querySelector('#counter').textContent=`${pos+1} / ${slides.length} · Sesión ${s.session}`;document.querySelector('#bar').style.width=((pos+1)/slides.length*100)+'%';document.querySelector('#prev').disabled=pos===0;document.querySelector('#next').disabled=pos===slides.length-1;document.querySelectorAll('[data-session]').forEach(b=>b.setAttribute('aria-current',Number(b.dataset.session)===s.session));document.querySelectorAll('textarea').forEach(t=>{try{t.value=localStorage.getItem('m23-'+t.dataset.note)||''}catch{}t.oninput=()=>{try{localStorage.setItem('m23-'+t.dataset.note,t.value)}catch{}}});if(document.querySelector('#chart')){draw(false);document.querySelector('#scenario').onchange=()=>draw(false);document.querySelector('#predict').onclick=()=>draw(true)}window.scrollTo(0,0)}function draw(reveal){const v=document.querySelector('#scenario').value;let d=100,o=20;if(v==='dplus')d=124;if(v==='dminus')d=76;if(v==='splus')o=-4;if(v==='sminus')o=44;const p=(d+o)/2,q=(d-o)/2;let x=q=>70+q*4.4,y=p=>315-p*2.1;const line=(q1,p1,q2,p2,color,dash='')=>`<line x1="${x(q1)}" y1="${y(p1)}" x2="${x(q2)}" y2="${y(p2)}" stroke="${color}" stroke-width="3" stroke-dasharray="${dash}"/>`;let out=`<path d="M70 20V315H640" stroke="#675c75" fill="none"/><text x="22" y="24">P</text><text x="640" y="342">Q</text>`;out+=line(0,100,95,5,'#c9bbd8','6 5')+line(0,20,95,115,'#a9d7d9','6 5');out+=line(Math.max(0,d-135),Math.min(d,135),Math.min(d,100),Math.max(0,d-100),'#643a91')+line(Math.max(0,-o),Math.max(0,o),Math.min(100,135-o),Math.min(135,o+100),'#087f89');out+='<text x="525" y="295" fill="#643a91">D</text><text x="505" y="35" fill="#087f89">O</text>';if(reveal){out+=`<circle cx="${x(q)}" cy="${y(p)}" r="7" fill="#271c3b"/><path d="M70 ${y(p)}H${x(q)}V315" stroke="#665878" stroke-dasharray="4 4" fill="none"/><text x="10" y="${y(p)+6}">${p}</text><text x="${x(q)-8}" y="342">${q}</text>`}document.querySelector('#chart').innerHTML=out;document.querySelector('#result').textContent=reveal?`Equilibrio: P = ${p}; Q = ${q}. ${({base:'Inicial: P = 60; Q = 40.',dplus:'Mayor demanda: suben precio y cantidad.',dminus:'Menor demanda: bajan precio y cantidad.',splus:'Mayor oferta: baja precio y sube cantidad.',sminus:'Menor oferta: sube precio y baja cantidad.'})[v]} Líneas discontinuas: curvas iniciales.`:'Antes de mostrar el resultado, piensa qué pasa con el precio y la cantidad. Las líneas punteadas muestran la situación inicial.'}document.querySelector('#prev').onclick=()=>show(pos-1);document.querySelector('#next').onclick=()=>show(pos+1);document.querySelectorAll('[data-session]').forEach(b=>b.onclick=()=>show(slides.findIndex(s=>s.session==b.dataset.session)));const dlg=document.querySelector('dialog');document.querySelector('#index').onclick=()=>dlg.showModal();document.querySelector('#close').onclick=()=>dlg.close();document.querySelector('#list').innerHTML=slides.map((s,i)=>`<button data-i="${i}">S${s.session} · ${s.title} <small>(${s.mins} min)</small></button>`).join('');document.querySelector('#list').onclick=e=>{const b=e.target.closest('[data-i]');if(b){show(+b.dataset.i);dlg.close()}};document.querySelector('#full').onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>{})}else document.exitFullscreen?.()};document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT','SUMMARY','BUTTON'].includes(e.target.tagName)||dlg.open)return;if(e.key==='ArrowRight'){e.preventDefault();show(pos+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(pos-1)}});show(0);</script></html>
