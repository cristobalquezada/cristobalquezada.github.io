<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HIS-M24 · Mercado · Dos sesiones</title><style>*{box-sizing:border-box} :root{--purple:#643a91;--dark:#271c3b;--teal:#087f89;--line:#ddd7e7}body{margin:0;background:#f6f4f9;color:var(--dark);font-family:Inter,Arial,sans-serif}button,select,textarea{font:inherit}button,select,summary{cursor:pointer}button{border:1px solid var(--line);background:white;color:var(--dark);padding:12px 17px;border-radius:8px}button:hover,button[aria-current=true]{background:var(--purple);color:white}button:focus-visible,summary:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #11a9b5;outline-offset:3px}header{padding:15px 4vw;background:white;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px}header small{display:block;color:var(--teal);margin-top:4px}nav{display:flex;gap:8px;flex-wrap:wrap}.progress{height:4px;background:#e4dfee}.progress div{height:100%;background:linear-gradient(90deg,var(--purple),#13a9b3)}main{max-width:1240px;margin:auto;padding:40px 5vw 100px}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:13px;color:var(--teal);font-weight:bold}h1{font-size:clamp(32px,4vw,55px);line-height:1.1;letter-spacing:-.035em;margin:15px 0}h2{font-size:23px;color:var(--purple);font-weight:500;margin:0 0 30px}p,td,summary{font-size:clamp(18px,1.7vw,23px);line-height:1.55}.lead{font-size:clamp(24px,2.6vw,34px);line-height:1.4}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}article{background:white;padding:22px;border:1px solid var(--line);border-top:4px solid var(--teal);border-radius:12px}article h3{color:var(--purple);font-size:23px;margin:0}article p{margin-bottom:0}details{background:white;border:1px solid var(--line);border-radius:9px;margin:12px 0}summary{padding:17px 20px;color:var(--purple);font-weight:600}.answer{border-top:1px solid var(--line);padding:18px 22px;font-size:21px;line-height:1.55}table{width:100%;border-collapse:collapse;background:white}td,th{text-align:left;padding:15px;border-bottom:1px solid var(--line)}th{background:var(--purple);color:white;font-size:17px}td{font-size:20px}.scroll{overflow-x:auto}.note{font-size:16px;color:#625b6c;border-left:3px solid var(--teal);padding:10px 16px;background:#eeebf4}footer{position:fixed;bottom:0;width:100%;background:#ffffffee;border-top:1px solid var(--line);padding:10px 4vw;display:flex;justify-content:space-between;align-items:center;gap:12px;backdrop-filter:blur(8px)}#counter{font-size:14px}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center}select{padding:12px;border:1px solid var(--line);border-radius:8px}textarea{display:block;width:100%;min-height:110px;padding:14px;margin-top:10px;border:1px solid var(--line);border-radius:8px}label{display:block;margin-top:15px;color:var(--purple)}#chart{width:100%;max-height:370px;background:white;border-radius:10px;margin-top:14px}#result{min-height:60px;color:var(--teal)}dialog{border:1px solid var(--line);border-radius:14px;max-width:800px;width:90%;max-height:85vh}dialog::backdrop{background:#271c3b99}.indexlist{display:grid;gap:8px}.indexlist button{text-align:left}.ref{font-size:14px;color:#6e6477;margin-top:25px}@media(max-width:650px){header{align-items:flex-start;flex-direction:column}main{padding:25px 20px 110px}.grid{grid-template-columns:1fr}td{font-size:17px;padding:10px}footer button{padding:10px}footer #counter{max-width:100px}h2{font-size:20px}}@media print{header,footer,.progress{display:none}main{padding:0}details{break-inside:avoid} }.stack{display:grid;gap:12px;margin:22px 0}.block{background:#fff;border:1px solid #e1d9ec;border-left:5px solid #0c929b;border-radius:12px;padding:17px 22px}.block b{font-size:22px;color:#604086}.block p{margin:6px 0 0}.highlight{background:#eee8f6;border-left:5px solid #7546a0;border-radius:12px;padding:18px 22px;margin:22px 0}.highlight strong{color:#653a8c;text-transform:uppercase;font-size:14px;letter-spacing:.08em}.highlight p{margin:8px 0 0}.question{margin:25px 0;padding:18px 22px;border-radius:12px;background:#eaf7f6;border:1px solid #c5e9e7}.question>b{color:#087f89}.question>p{margin:7px 0}main{max-width:1250px}h1{max-width:1050px}main>p{max-width:1100px}</style><header><div><b>ECONOMÍA / HIS-M24</b><small>Funcionamiento del mercado · Dos sesiones de 80 minutos</small></div><nav aria-label="Sesiones"><button data-session="1">Sesión 1</button><button data-session="2">Sesión 2</button><button id="index">Índice</button><button id="full" aria-label="Alternar pantalla completa">Pantalla completa</button></nav></header><div class="progress"><div id="bar"></div></div><main></main><footer><button id="prev">← Anterior</button><span id="counter" aria-live="polite"></span><button id="next">Siguiente →</button></footer><dialog aria-label="Índice de sesiones"><button id="close">Cerrar índice</button><h2>Elegir un tema</h2><div id="list" class="indexlist"></div></dialog><script>const slides=[{"session": 1, "title": "Clase 1 · ¿Cómo funciona el mercado?", "sub": "Escasez, oferta, demanda y precios", "body": "<p class=\"lead\">Cada vez que compramos, vendemos o decidimos cómo usar nuestro dinero, participamos en la economía.</p><p>En esta clase veremos cómo se relacionan esas decisiones y por qué cambian los precios.</p><div class=\"highlight\"><strong>Pregunta guía</strong><p>¿Cómo se forman los precios y por qué pueden cambiar?</p></div>", "mins": 3, "ref": "pp. 3–17"}, {"session": 1, "title": "¿Qué aprenderemos hoy?", "sub": "Comprender para explicar y aplicar", "body": "<div class=\"stack\"><div class=\"block\"><b>Objetivo</b><p>Explicar cómo la oferta y la demanda influyen en los precios, usando ejemplos cotidianos y preguntas de la guía.</p></div><div class=\"block\"><b>Pregunta guía</b><p>¿Cómo se forman los precios y por qué pueden cambiar?</p></div><div class=\"block\"><b>Para esta clase</b><p>Necesitaremos la guía HIS-M24. Al final resolveremos y revisaremos sus ejercicios.</p></div></div>", "mins": 2, "ref": "pp. 3–17"}, {"session": 1, "title": "Activemos ideas previas", "sub": "Pensemos en situaciones conocidas", "body": "<div class=\"question\"><b>Para conversar</b><p>Si una helada daña una cosecha, ¿qué podría pasar con el precio de esa fruta? ¿Por qué?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Al haber menos fruta disponible, su precio podría subir. Veremos por qué usando la oferta y la demanda.</div></details></div><div class=\"question\"><b>Para conversar</b><p>Si una familia tiene dinero limitado, ¿puede comprar todo lo que quiere?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No siempre. Por eso necesita elegir y dejar algunas alternativas para después.</div></details></div>", "mins": 4, "ref": ""}, {"session": 1, "title": "¿Por qué tenemos que elegir?", "sub": "La escasez nos obliga a tomar decisiones", "body": "<p>La <b>escasez</b> ocurre porque los recursos son limitados y tienen distintos usos posibles. Esto afecta a las personas, las empresas y al Estado.</p><p>Si usamos un recurso para algo, dejamos de usarlo para otra alternativa.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Con $10.000 puedes comprar un libro o ir al cine. Si eliges el libro, renuncias a ir al cine.</p></div><div class=\"question\"><b>Para conversar</b><p>¿El tiempo también puede ser un recurso escaso?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Sí. Si dedicas una hora a estudiar, no puedes usar esa misma hora para trabajar o descansar.</div></details></div>", "mins": 4, "ref": "p. 4"}, {"session": 1, "title": "¿Qué dejamos de ganar al elegir?", "sub": "Eso es el costo de oportunidad", "body": "<p>El <b>costo de oportunidad</b> es el valor de la mejor alternativa a la que renunciamos al tomar una decisión.</p><p>No siempre se trata de dinero. También puede ser tiempo, descanso u otra oportunidad.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Si decides estudiar en vez de trabajar y ganar $12.000, ese ingreso es parte del costo de oportunidad de estudiar.</p></div><div class=\"question\"><b>Para conversar</b><p>Si eliges trabajar, ¿a qué renuncias?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Al beneficio que habrías obtenido usando ese tiempo para estudiar, si esa era tu mejor alternativa.</div></details></div>", "mins": 4, "ref": "p. 4"}, {"session": 1, "title": "¿Qué usamos para satisfacer necesidades?", "sub": "Bienes y servicios", "body": "<p>Un <b>bien</b> es un objeto material, como un pan o un computador. Un <b>servicio</b> es una actividad, como un viaje en bus o una consulta médica.</p><p>Los bienes pueden clasificarse de distintas maneras. Por ejemplo, un alimento satisface directamente una necesidad; una máquina sirve para producir otros bienes.</p><div class=\"question\"><b>Para conversar</b><p>En una panadería, ¿la harina y el horno cumplen la misma función?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. La harina se utiliza para hacer pan; el horno se usa durante muchas producciones. Es un bien de capital.</div></details></div>", "mins": 3, "ref": "pp. 5–6"}, {"session": 1, "title": "¿Quiénes participan en la economía?", "sub": "Los agentes económicos toman decisiones", "body": "<div class=\"stack\"><div class=\"block\"><b>Familias</b><p>Compran bienes y servicios y ofrecen trabajo. Reciben ingresos por ese trabajo y por otros recursos.</p></div><div class=\"block\"><b>Empresas</b><p>Contratan recursos y personas para producir y vender bienes o servicios.</p></div><div class=\"block\"><b>Estado</b><p>Cobra impuestos, entrega servicios, regula y también compra bienes y contrata trabajadores.</p></div><div class=\"block\"><b>Resto del mundo</b><p>Otros países y agentes con quienes se comercia, invierte y presta dinero.</p></div></div><div class=\"question\"><b>Para conversar</b><p>¿Qué relación existe entre una familia y una empresa?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">La familia puede trabajar para la empresa y recibir un salario. También puede comprar sus productos.</div></details></div>", "mins": 4, "ref": "pp. 7–9"}, {"session": 1, "title": "¿Qué es un mercado?", "sub": "Compradores y vendedores se relacionan", "body": "<p>Un <b>mercado</b> reúne a quienes quieren comprar y a quienes quieren vender un bien o servicio.</p><p>No necesita ser un lugar físico: también existe un mercado cuando compras por internet.</p><div class=\"highlight\"><strong>Dos lados de una misma relación</strong><p>La <b>demanda</b> corresponde a los compradores. La <b>oferta</b> corresponde a los vendedores.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Qué personas forman parte del mercado del pan?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Quienes compran pan y quienes lo producen o venden.</div></details></div>", "mins": 3, "ref": "pp. 9–10"}, {"session": 1, "title": "¿Qué es la demanda?", "sub": "Es lo que queremos y podemos comprar", "body": "<p>La <b>demanda</b> relaciona el precio de un producto con la cantidad que las personas quieren y pueden comprar.</p><p>Si el precio sube, normalmente se compra menos. Si baja, normalmente se compra más, siempre que las demás condiciones no cambien.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Si sube mucho el precio de las paltas, una familia podría comprar menos kilos.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Basta con querer un computador para demandarlo?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. En economía, también importa que la persona pueda pagarlo.</div></details></div>", "mins": 4, "ref": "pp. 10–11"}, {"session": 1, "title": "¿Qué es la oferta?", "sub": "Es lo que los vendedores quieren y pueden vender", "body": "<p>La <b>oferta</b> relaciona el precio de un producto con la cantidad que sus vendedores quieren y pueden ofrecer.</p><p>Si el precio sube, producir y vender más puede resultar atractivo. Si baja, algunos productores pueden ofrecer menos, manteniendo iguales las demás condiciones.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Si aumenta el precio de las frambuesas y los costos se mantienen, cultivarlas puede volverse más conveniente.</p></div>", "mins": 4, "ref": "pp. 12–13"}, {"session": 1, "title": "¿Cuándo cambia la demanda o la oferta?", "sub": "Distingamos qué cambió primero", "body": "<div class=\"stack\"><div class=\"block\"><b>Cambia el precio del producto</b><p>Cambia la cantidad que se compra o vende. Nos movemos sobre la misma curva.</p></div><div class=\"block\"><b>Cambia otro factor</b><p>Puede cambiar la demanda o la oferta completa: la curva se desplaza.</p></div></div><div class=\"highlight\"><strong>Dos ejemplos</strong><p>Si sube el precio del pan, baja la cantidad demandada de pan. Si baja el costo de la harina, puede aumentar la oferta de pan.</p></div><div class=\"question\"><b>Para conversar</b><p>Si más personas llegan a vivir a un barrio, ¿qué podría pasar con la demanda de pan?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Podría aumentar, porque habría más compradores a cada precio.</div></details></div>", "mins": 5, "ref": "pp. 10–13"}, {"session": 1, "title": "¿Qué pasa con productos relacionados?", "sub": "Sustitutos y complementarios", "body": "<p>Los <b>sustitutos</b> pueden reemplazarse: té y café. Los <b>complementarios</b> suelen usarse juntos: una consola y sus juegos.</p><div class=\"stack\"><div class=\"block\"><b>Si sube el precio del café…</b><p>Algunas personas pueden cambiarse al té. La demanda de té podría aumentar.</p></div><div class=\"block\"><b>Si sube el precio de una consola…</b><p>Podrían comprarse menos consolas y, con ello, menos juegos para esa consola.</p></div></div><div class=\"question\"><b>Para conversar</b><p>¿Azúcar y endulzante pueden funcionar como sustitutos?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Sí. Si uno se encarece, algunas personas pueden cambiarse al otro.</div></details></div>", "mins": 4, "ref": "p. 11"}, {"session": 1, "title": "¿Cómo se forma el precio?", "sub": "La oferta y la demanda se encuentran", "body": "<p>El <b>precio de equilibrio</b> es aquel en que la cantidad que las personas quieren comprar coincide con la que los vendedores quieren ofrecer.</p><div class=\"stack\"><div class=\"block\"><b>Si falta producto</b><p>Hay más personas queriendo comprar que productos disponibles. El precio tiende a subir.</p></div><div class=\"block\"><b>Si sobra producto</b><p>Los vendedores ofrecen más de lo que se quiere comprar. El precio tiende a bajar.</p></div></div><p>Estos ajustes describen un modelo simplificado: en la realidad pueden tardar o verse afectados por otras condiciones.</p>", "mins": 4, "ref": "pp. 13–15"}, {"session": 1, "title": "Exploremos el mercado", "sub": "¿Qué pasa si cambia la oferta o la demanda?", "body": "<p>Elige un cambio, anticipa qué pasará y luego revisa el resultado. Las líneas punteadas muestran la situación inicial. El modelo usa números de ejemplo.</p><div class=\"controls\"><label>Escenario <select id=\"scenario\"><option value=\"base\">Equilibrio inicial</option><option value=\"dplus\">Aumenta demanda</option><option value=\"dminus\">Disminuye demanda</option><option value=\"splus\">Aumenta oferta</option><option value=\"sminus\">Disminuye oferta</option></select></label><button id=\"predict\">Mostrar resultado</button></div><svg id=\"chart\" viewBox=\"0 0 680 360\" role=\"img\" aria-label=\"Oferta y demanda con precio en eje vertical y cantidad horizontal\"></svg><p id=\"result\" aria-live=\"polite\">Antes de revelar, piensa: ¿subirán o bajarán el precio y la cantidad?</p>", "mins": 5, "ref": "pp. 15–17"}, {"session": 1, "title": "¿Qué puede hacer cambiar el precio?", "sub": "Sigamos el efecto paso a paso", "body": "<p>Si aumenta la demanda y la oferta se mantiene, el precio y la cantidad vendida tienden a subir.</p><p>Si disminuye la oferta y la demanda se mantiene, el precio tiende a subir y la cantidad vendida a bajar.</p><div class=\"highlight\"><strong>Recordemos</strong><p>Primero identifica qué cambió: ¿quieren comprar más personas o hay menos producto disponible?</p></div><div class=\"question\"><b>Para conversar</b><p>Una helada reduce la cosecha de limones. ¿Qué curva cambia?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">La oferta disminuye. Si la demanda se mantiene, el precio tiende a subir y se vende una cantidad menor.</div></details></div>", "mins": 4, "ref": "pp. 15–17"}, {"session": 1, "title": "Practiquemos con la guía", "sub": "Preguntas 1, 4, 5, 6 y 8", "body": "<p>Resuelve las preguntas en tu guía. Después, explica por qué elegiste cada alternativa y compara tu respuesta.</p><details><summary>Pregunta 1 · Precio de las frambuesas</summary><div class=\"answer\"><b>Respuesta: C.</b> Si sube el precio y los costos no cambian, cultivar frambuesas puede ser más conveniente.<p><b>Para descartar:</b> Las otras opciones no siguen esa señal de precio.</p></div></details><details><summary>Pregunta 4 · Azúcar y endulzante</summary><div class=\"answer\"><b>Respuesta: C.</b> Si sube el precio del endulzante, algunas personas pueden comprar más azúcar, su sustituto.<p><b>Para descartar:</b> Un cambio en el precio del azúcar cambia la cantidad demandada, no la demanda completa.</p></div></details><details><summary>Pregunta 5 · Nuevo instituto y fotocopias</summary><div class=\"answer\"><b>Respuesta: A.</b> La dueña espera más clientes y, por lo tanto, mayor demanda.<p><b>Para descartar:</b> El diálogo no informa que cambien los ingresos o los costos.</p></div></details><details><summary>Pregunta 6 · Costos de las flores</summary><div class=\"answer\"><b>Respuesta: B.</b> Una inundación de los cultivos puede reducir las flores disponibles y encarecerlas.<p><b>Para descartar:</b> Una cosecha abundante tendería a aumentar la disponibilidad.</p></div></details><details><summary>Pregunta 8 · Venta de computadores</summary><div class=\"answer\"><b>Respuesta: B.</b> Si la demanda aumenta y la oferta se mantiene, el precio tiende a subir.<p><b>Para descartar:</b> El aumento de ventas por sí solo no demuestra qué ocurrió con el precio; para responder se usa el contexto y el supuesto de oferta constante.</p></div></details><label>Mis apuntes<textarea data-note=\"s1\" placeholder=\"¿Qué entendí? ¿Qué necesito repasar?\"></textarea></label>", "mins": 18, "ref": "pp. 28–30"}, {"session": 1, "title": "Cerremos la primera clase", "sub": "Volvamos a la pregunta guía", "body": "<div class=\"question\"><b>Para conversar</b><p>¿Cómo se forman los precios y por qué pueden cambiar?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">En el modelo estudiado, los precios se relacionan con la oferta y la demanda. Pueden cambiar si varían los costos, las preferencias, el número de compradores u otros factores.</div></details></div><div class=\"question\"><b>Para conversar</b><p>Una mejora tecnológica abarata producir bicicletas. ¿Qué puede pasar?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">La oferta puede aumentar. Si la demanda se mantiene, el precio tiende a bajar y la cantidad vendida a subir.</div></details></div>", "mins": 5, "ref": ""}, {"session": 2, "title": "Clase 2 · ¿Qué puede alterar el mercado?", "sub": "Competencia, precios e inflación", "body": "<p class=\"lead\">Los precios no dependen solo de cuántas personas quieren comprar o vender.</p><p>También importan la competencia entre empresas, las decisiones de la autoridad y los cambios que afectan a la economía.</p><div class=\"highlight\"><strong>Pregunta guía</strong><p>¿Qué factores pueden cambiar el funcionamiento del mercado?</p></div>", "mins": 3, "ref": "pp. 17–24"}, {"session": 2, "title": "¿Qué aprenderemos hoy?", "sub": "Explicar y aplicar lo aprendido", "body": "<div class=\"stack\"><div class=\"block\"><b>Objetivo</b><p>Explicar cómo la competencia, la colusión, los controles de precios y la inflación pueden afectar a consumidores y empresas.</p></div><div class=\"block\"><b>Pregunta guía</b><p>¿Qué factores pueden cambiar el funcionamiento del mercado?</p></div><div class=\"block\"><b>Al finalizar</b><p>Resolveremos preguntas de la guía y conversaremos sobre cómo reconocer la alternativa correcta.</p></div></div>", "mins": 2, "ref": "pp. 17–24"}, {"session": 2, "title": "Recordemos lo anterior", "sub": "Oferta, demanda y precios", "body": "<div class=\"question\"><b>Para conversar</b><p>Si hay menos fruta disponible después de una helada, ¿qué pasa con la oferta?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">La oferta disminuye. Si la demanda no cambia, el precio tiende a subir.</div></details></div><div class=\"question\"><b>Para conversar</b><p>Si aumenta el precio de un producto, ¿qué suele pasar con la cantidad que se compra?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Suele disminuir, siempre que las demás condiciones se mantengan.</div></details></div>", "mins": 3, "ref": ""}, {"session": 2, "title": "¿Por qué importa la competencia?", "sub": "Más alternativas pueden limitar el poder de una empresa", "body": "<p>Hay <b>competencia</b> cuando distintas empresas buscan atraer compradores. Para hacerlo, pueden cambiar precios, mejorar la calidad o diferenciar sus productos.</p><p>Si existen pocas alternativas, una empresa puede tener más posibilidades de cobrar un precio alto.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Dos cafeterías venden en el mismo barrio. Una puede cobrar más si sus clientes valoran algo especial de ella.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Un precio más alto demuestra que una cafetería se coludió?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Puede deberse a diferencias de calidad, ubicación o a otros factores.</div></details></div>", "mins": 5, "ref": "pp. 17–19"}, {"session": 2, "title": "¿Todos los mercados son iguales?", "sub": "La cantidad de vendedores cambia la competencia", "body": "<div class=\"stack\"><div class=\"block\"><b>Monopolio</b><p>Un vendedor ofrece un producto sin sustitutos cercanos.</p></div><div class=\"block\"><b>Oligopolio</b><p>Unas pocas empresas concentran gran parte de las ventas.</p></div><div class=\"block\"><b>Productos diferenciados</b><p>Hay varias empresas, pero sus productos se distinguen por marca, calidad o ubicación.</p></div></div><p class=\"note\">Que haya pocas empresas no demuestra, por sí solo, que exista un acuerdo entre ellas.</p>", "mins": 5, "ref": "pp. 17–19"}, {"session": 2, "title": "¿Qué es la colusión?", "sub": "Empresas competidoras se ponen de acuerdo", "body": "<p>La <b>colusión</b> ocurre cuando empresas que deberían competir acuerdan, por ejemplo, subir precios, limitar la producción o repartirse el mercado.</p><p>Al reducir la competencia, pueden perjudicar a los consumidores: pagarían más o tendrían menos opciones.</p><div class=\"highlight\"><strong>Caso de la guía</strong><p>Empresas productoras de pollo acordaron limitar la producción y repartirse cuotas de mercado.</p></div><div class=\"question\"><b>Para conversar</b><p>Si varias empresas suben los precios el mismo día, ¿eso prueba colusión?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No necesariamente. Podrían enfrentar el mismo aumento de costos. Para hablar de colusión se necesita evidencia de un acuerdo.</div></details></div>", "mins": 6, "ref": "pp. 19–20"}, {"session": 2, "title": "¿Qué pasa si se fija un precio máximo?", "sub": "Depende de cómo se compare con el precio de mercado", "body": "<p>Una autoridad puede fijar el precio máximo al que se permite vender un producto.</p><p>Si ese máximo queda <b>bajo el precio de equilibrio</b>, más personas pueden querer comprar, mientras los vendedores ofrecen menos. Puede faltar producto.</p><div class=\"question\"><b>Para conversar</b><p>¿Qué ocurre si el máximo se fija sobre el precio de equilibrio?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">En ese caso no limita el precio de equilibrio: el máximo no estaría actuando como restricción en el modelo.</div></details></div>", "mins": 5, "ref": "pp. 20–21"}, {"session": 2, "title": "¿Qué pasa con un precio mínimo?", "sub": "Por debajo de ese valor no se puede vender", "body": "<p>Un precio mínimo sobre el equilibrio puede hacer que se ofrezca más de lo que se quiere comprar. En el modelo simple, eso genera un excedente.</p><p>El salario es el precio del trabajo. Las personas ofrecen trabajo y las empresas lo demandan; además influyen las leyes, la negociación y la productividad.</p><div class=\"highlight\"><strong>Para pensar</strong><p>Un modelo ayuda a anticipar efectos, pero sus resultados dependen de los supuestos y del contexto.</p></div>", "mins": 4, "ref": "pp. 17 y 20–21"}, {"session": 2, "title": "¿Qué es la inflación?", "sub": "Los precios suben de forma general y sostenida", "body": "<p>La <b>inflación</b> es el aumento sostenido y generalizado de los precios. No significa que todos los productos suban lo mismo ni que siempre suban todos.</p><p>Si los precios suben más rápido que nuestros ingresos, el dinero alcanza para comprar menos.</p><div class=\"question\"><b>Para conversar</b><p>Si solo sube el precio de los tomates, ¿podemos afirmar que hay inflación?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No solo con ese dato. Necesitamos observar qué ocurre con el nivel general de precios.</div></details></div>", "mins": 5, "ref": "pp. 21–22"}, {"session": 2, "title": "¿Cómo leemos los datos del IPC?", "sub": "El período de comparación importa", "body": "<p>El IPC permite observar la variación de precios de una canasta de bienes y servicios.</p><div class=\"stack\"><div class=\"block\"><b>Variación mensual</b><p>Compara con el mes anterior.</p></div><div class=\"block\"><b>Variación acumulada del año</b><p>Compara con diciembre del año anterior.</p></div><div class=\"block\"><b>Variación a doce meses</b><p>Compara con el mismo mes del año anterior.</p></div></div><div class=\"highlight\"><strong>Ejemplo de la guía</strong><p>En el ejercicio 10 aparecen tres cifras: 0,6 % mensual; 3,6 % acumulado en el año; 4,1 % a doce meses. Son datos del ejemplo, no cifras actuales.</p></div>", "mins": 5, "ref": "pp. 21–22 y 31"}, {"session": 2, "title": "¿Inflación más baja significa precios más bajos?", "sub": "No necesariamente", "body": "<p>Si la inflación baja de 10 % a 5 %, los precios siguen subiendo, pero más lentamente. A eso se le llama <b>desinflación</b>.</p><p>La <b>deflación</b> ocurre cuando el nivel general de los precios baja durante un tiempo prolongado.</p><div class=\"question\"><b>Para conversar</b><p>Si se espera que los precios sigan bajando, ¿qué podrían hacer algunas familias?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Podrían postergar compras grandes para esperar un precio menor.</div></details></div>", "mins": 4, "ref": "pp. 21–22"}, {"session": 2, "title": "¿Por qué pueden subir los precios?", "sub": "Hay más de un camino", "body": "<div class=\"stack\"><div class=\"block\"><b>Aumenta la demanda</b><p>Si muchas personas quieren comprar y la producción no alcanza a crecer, los precios pueden subir.</p></div><div class=\"block\"><b>Suben los costos</b><p>Si se encarecen la energía o las materias primas, producir puede costar más.</p></div><div class=\"block\"><b>Cambia el dólar</b><p>Si sube el precio del dólar, algunos productos o insumos importados pueden encarecerse.</p></div></div><p>Estos factores pueden influir en los precios, aunque sus efectos dependen del contexto.</p>", "mins": 4, "ref": "pp. 21–23"}, {"session": 2, "title": "¿Cómo puede intervenir la autoridad?", "sub": "Precios, aranceles y tasa de interés", "body": "<p>Un <b>arancel</b> es un cobro a productos importados. Puede hacer que estos resulten más caros.</p><p>Si el Banco Central sube la tasa de política monetaria, el crédito tiende a encarecerse. Esto puede reducir el gasto y, con el tiempo, disminuir la presión sobre los precios.</p><div class=\"question\"><b>Para conversar</b><p>¿Un alza de la tasa baja todos los precios de inmediato?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Sus efectos toman tiempo y dependen de cómo respondan personas, empresas y bancos.</div></details></div>", "mins": 4, "ref": "pp. 22–24"}, {"session": 2, "title": "¿Puede una compra afectar a otras personas?", "sub": "Las externalidades afectan a terceros", "body": "<p>Una <b>externalidad</b> ocurre cuando una actividad genera costos o beneficios para otras personas que no participan directamente en ella.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una fábrica contamina un río. Sus vecinos enfrentan un daño que puede no estar incluido en el precio de lo que produce.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Por qué este es un problema para el mercado?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Porque el precio puede no reflejar todos los costos que la actividad genera para la comunidad.</div></details></div>", "mins": 3, "ref": "p. 24"}, {"session": 2, "title": "Practiquemos con la guía", "sub": "Preguntas 2, 3, 7, 9 y 10", "body": "<p>Resuelve las preguntas en tu guía. Después, explica por qué elegiste cada alternativa y compara tu respuesta.</p><details><summary>Pregunta 2 · La cafetería y sus clientes</summary><div class=\"answer\"><b>Respuesta: D.</b> Las personas pueden valorar una característica que distingue a esa cafetería.<p><b>Para descartar:</b> Que tenga costos mayores no explica por sí solo por qué sus clientes aceptan pagar más.</p></div></details><details><summary>Pregunta 3 · Precio máximo de la leche</summary><div class=\"answer\"><b>Respuesta: A.</b> Si el máximo está bajo el equilibrio, puede haber más personas queriendo comprar que leche disponible.<p><b>Para descartar:</b> No se puede asumir que la producción aumentará con un precio menor.</p></div></details><details><summary>Pregunta 7 · Un factor que eleva el precio</summary><div class=\"answer\"><b>Respuesta: D.</b> Si disminuye la competencia, las empresas pueden ganar poder para cobrar más.<p><b>Para descartar:</b> Una máquina que abarata la producción tiende a ampliar la oferta.</p></div></details><details><summary>Pregunta 9 · Precios que siguen bajando</summary><div class=\"answer\"><b>Respuesta: A.</b> Si se espera que los precios continúen bajando, algunas familias podrían postergar compras grandes.<p><b>Para descartar:</b> El texto no permite afirmar que los salarios caigan al mismo ritmo.</p></div></details><details><summary>Pregunta 10 · Leer las cifras del IPC</summary><div class=\"answer\"><b>Respuesta: C.</b> La variación a doce meses es 4,1 %.<p><b>Para descartar:</b> 0,6 % es mensual y 3,6 % es el acumulado del año; no son la variación a doce meses.</p></div></details><label>Mis apuntes<textarea data-note=\"s2\" placeholder=\"¿Qué entendí? ¿Qué necesito repasar?\"></textarea></label>", "mins": 17, "ref": "pp. 28–31"}, {"session": 2, "title": "Cerremos la segunda clase", "sub": "Volvamos a la pregunta guía", "body": "<div class=\"question\"><b>Para conversar</b><p>¿Qué factores pueden cambiar el funcionamiento del mercado?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">La competencia, los acuerdos entre empresas, las decisiones sobre precios, los costos y los cambios en el nivel general de precios pueden afectar su funcionamiento.</div></details></div><div class=\"question\"><b>Para conversar</b><p>¿Cómo puedo elegir una alternativa en la PAES?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Primero identifico qué pregunta la consigna. Luego busco la información útil, aplico el concepto y comparo por qué una alternativa se sostiene mejor que las demás.</div></details></div>", "mins": 5, "ref": ""}];let pos=0;const main=document.querySelector('main');function show(i){pos=Math.max(0,Math.min(slides.length-1,i));const s=slides[pos];main.innerHTML=`<div class="eyebrow">HIS-M24 / Sesión ${s.session} / ${s.mins} min orientativos</div><h1>${s.title}</h1><h2>${s.sub}</h2>${s.body}<p class="ref">Base: guía HIS-M24, Funcionamiento del mercado y los factores que pueden alterarlo. ${s.ref}</p>`;document.querySelector('#counter').textContent=`${pos+1} / ${slides.length} · Sesión ${s.session}`;document.querySelector('#bar').style.width=((pos+1)/slides.length*100)+'%';document.querySelector('#prev').disabled=pos===0;document.querySelector('#next').disabled=pos===slides.length-1;document.querySelectorAll('[data-session]').forEach(b=>b.setAttribute('aria-current',Number(b.dataset.session)===s.session));document.querySelectorAll('textarea').forEach(t=>{try{t.value=localStorage.getItem('m24-'+t.dataset.note)||''}catch{}t.oninput=()=>{try{localStorage.setItem('m24-'+t.dataset.note,t.value)}catch{}}});if(document.querySelector('#chart')){draw(false);document.querySelector('#scenario').onchange=()=>draw(false);document.querySelector('#predict').onclick=()=>draw(true)}window.scrollTo(0,0)}function draw(reveal){const v=document.querySelector('#scenario').value;let d=100,o=20;if(v==='dplus')d=124;if(v==='dminus')d=76;if(v==='splus')o=-4;if(v==='sminus')o=44;const p=(d+o)/2,q=(d-o)/2;let x=q=>70+q*4.4,y=p=>315-p*2.1;const line=(q1,p1,q2,p2,color,dash='')=>`<line x1="${x(q1)}" y1="${y(p1)}" x2="${x(q2)}" y2="${y(p2)}" stroke="${color}" stroke-width="3" stroke-dasharray="${dash}"/>`;let out=`<path d="M70 20V315H640" stroke="#675c75" fill="none"/><text x="22" y="24">P</text><text x="640" y="342">Q</text>`;out+=line(0,100,95,5,'#c9bbd8','6 5')+line(0,20,95,115,'#a9d7d9','6 5');out+=line(Math.max(0,d-135),Math.min(d,135),Math.min(d,100),Math.max(0,d-100),'#643a91')+line(Math.max(0,-o),Math.max(0,o),Math.min(100,135-o),Math.min(135,o+100),'#087f89');out+='<text x="525" y="295" fill="#643a91">D</text><text x="505" y="35" fill="#087f89">O</text>';if(reveal){out+=`<circle cx="${x(q)}" cy="${y(p)}" r="7" fill="#271c3b"/><path d="M70 ${y(p)}H${x(q)}V315" stroke="#665878" stroke-dasharray="4 4" fill="none"/><text x="10" y="${y(p)+6}">${p}</text><text x="${x(q)-8}" y="342">${q}</text>`}document.querySelector('#chart').innerHTML=out;document.querySelector('#result').textContent=reveal?`Equilibrio: P = ${p}; Q = ${q}. ${({base:'Inicial: P = 60; Q = 40.',dplus:'Mayor demanda: suben precio y cantidad.',dminus:'Menor demanda: bajan precio y cantidad.',splus:'Mayor oferta: baja precio y sube cantidad.',sminus:'Menor oferta: sube precio y baja cantidad.'})[v]} Líneas discontinuas: curvas iniciales.`:'Antes de mostrar el resultado, piensa qué pasa con el precio y la cantidad. Las líneas punteadas muestran la situación inicial.'}document.querySelector('#prev').onclick=()=>show(pos-1);document.querySelector('#next').onclick=()=>show(pos+1);document.querySelectorAll('[data-session]').forEach(b=>b.onclick=()=>show(slides.findIndex(s=>s.session==b.dataset.session)));const dlg=document.querySelector('dialog');document.querySelector('#index').onclick=()=>dlg.showModal();document.querySelector('#close').onclick=()=>dlg.close();document.querySelector('#list').innerHTML=slides.map((s,i)=>`<button data-i="${i}">S${s.session} · ${s.title} <small>(${s.mins} min)</small></button>`).join('');document.querySelector('#list').onclick=e=>{const b=e.target.closest('[data-i]');if(b){show(+b.dataset.i);dlg.close()}};document.querySelector('#full').onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>{})}else document.exitFullscreen?.()};document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT','SUMMARY','BUTTON'].includes(e.target.tagName)||dlg.open)return;if(e.key==='ArrowRight'){e.preventDefault();show(pos+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(pos-1)}});show(0);</script></html>
