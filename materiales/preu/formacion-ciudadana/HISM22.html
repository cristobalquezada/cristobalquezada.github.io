<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HIS-M22 · Mercado · Dos sesiones</title><style>*{box-sizing:border-box} :root{--purple:#643a91;--dark:#271c3b;--teal:#087f89;--line:#ddd7e7}body{margin:0;background:#f6f4f9;color:var(--dark);font-family:Inter,Arial,sans-serif}button,select,textarea{font:inherit}button,select,summary{cursor:pointer}button{border:1px solid var(--line);background:white;color:var(--dark);padding:12px 17px;border-radius:8px}button:hover,button[aria-current=true]{background:var(--purple);color:white}button:focus-visible,summary:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #11a9b5;outline-offset:3px}header{padding:15px 4vw;background:white;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px}header small{display:block;color:var(--teal);margin-top:4px}nav{display:flex;gap:8px;flex-wrap:wrap}.progress{height:4px;background:#e4dfee}.progress div{height:100%;background:linear-gradient(90deg,var(--purple),#13a9b3)}main{max-width:1240px;margin:auto;padding:40px 5vw 100px}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:13px;color:var(--teal);font-weight:bold}h1{font-size:clamp(32px,4vw,55px);line-height:1.1;letter-spacing:-.035em;margin:15px 0}h2{font-size:23px;color:var(--purple);font-weight:500;margin:0 0 30px}p,td,summary{font-size:clamp(18px,1.7vw,23px);line-height:1.55}.lead{font-size:clamp(24px,2.6vw,34px);line-height:1.4}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}article{background:white;padding:22px;border:1px solid var(--line);border-top:4px solid var(--teal);border-radius:12px}article h3{color:var(--purple);font-size:23px;margin:0}article p{margin-bottom:0}details{background:white;border:1px solid var(--line);border-radius:9px;margin:12px 0}summary{padding:17px 20px;color:var(--purple);font-weight:600}.answer{border-top:1px solid var(--line);padding:18px 22px;font-size:21px;line-height:1.55}table{width:100%;border-collapse:collapse;background:white}td,th{text-align:left;padding:15px;border-bottom:1px solid var(--line)}th{background:var(--purple);color:white;font-size:17px}td{font-size:20px}.scroll{overflow-x:auto}.note{font-size:16px;color:#625b6c;border-left:3px solid var(--teal);padding:10px 16px;background:#eeebf4}footer{position:fixed;bottom:0;width:100%;background:#ffffffee;border-top:1px solid var(--line);padding:10px 4vw;display:flex;justify-content:space-between;align-items:center;gap:12px;backdrop-filter:blur(8px)}#counter{font-size:14px}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center}select{padding:12px;border:1px solid var(--line);border-radius:8px}textarea{display:block;width:100%;min-height:110px;padding:14px;margin-top:10px;border:1px solid var(--line);border-radius:8px}label{display:block;margin-top:15px;color:var(--purple)}#chart{width:100%;max-height:370px;background:white;border-radius:10px;margin-top:14px}#result{min-height:60px;color:var(--teal)}dialog{border:1px solid var(--line);border-radius:14px;max-width:800px;width:90%;max-height:85vh}dialog::backdrop{background:#271c3b99}.indexlist{display:grid;gap:8px}.indexlist button{text-align:left}.ref{font-size:14px;color:#6e6477;margin-top:25px}@media(max-width:650px){header{align-items:flex-start;flex-direction:column}main{padding:25px 20px 110px}.grid{grid-template-columns:1fr}td{font-size:17px;padding:10px}footer button{padding:10px}footer #counter{max-width:100px}h2{font-size:20px}}@media print{header,footer,.progress{display:none}main{padding:0}details{break-inside:avoid} }.stack{display:grid;gap:12px;margin:22px 0}.block{background:#fff;border:1px solid #e1d9ec;border-left:5px solid #0c929b;border-radius:12px;padding:17px 22px}.block b{font-size:22px;color:#604086}.block p{margin:6px 0 0}.highlight{background:#eee8f6;border-left:5px solid #7546a0;border-radius:12px;padding:18px 22px;margin:22px 0}.highlight strong{color:#653a8c;text-transform:uppercase;font-size:14px;letter-spacing:.08em}.highlight p{margin:8px 0 0}.question{margin:25px 0;padding:18px 22px;border-radius:12px;background:#eaf7f6;border:1px solid #c5e9e7}.question>b{color:#087f89}.question>p{margin:7px 0}main{max-width:1250px}h1{max-width:1050px}main>p{max-width:1100px}</style><header><div><b>ECONOMÍA / HIS-M22</b><small>La democracia en la sociedad de la información · Dos sesiones de 80 minutos</small></div><nav aria-label="Sesiones"><button data-session="1">Sesión 1</button><button data-session="2">Sesión 2</button><button id="index">Índice</button><button id="full" aria-label="Alternar pantalla completa">Pantalla completa</button></nav></header><div class="progress"><div id="bar"></div></div><main></main><footer><button id="prev">← Anterior</button><span id="counter" aria-live="polite"></span><button id="next">Siguiente →</button></footer><dialog aria-label="Índice de sesiones"><button id="close">Cerrar índice</button><h2>Elegir un tema</h2><div id="list" class="indexlist"></div></dialog><script>const slides=[{"session": 1, "title": "Clase 1 · La democracia en la sociedad de la información", "sub": "Sesión 1 · Formación Ciudadana", "body": "<p class=\"lead\">En esta clase exploraremos una pregunta para entender mejor la vida en democracia.</p><div class=\"highlight\"><strong>Pregunta guía</strong><p>¿Por qué la información importa para la democracia?</p></div>", "mins": 3, "ref": "pp. 3–12"}, {"session": 1, "title": "¿Qué aprenderemos hoy?", "sub": "Comprender, relacionar y aplicar", "body": "<p>Explicar los conceptos y situaciones de la guía, relacionándolos con ejemplos cercanos y preguntas de la PAES.</p><div class=\"highlight\"><strong>Pregunta guía</strong><p>¿Por qué la información importa para la democracia?</p></div><p>Al finalizar, trabajaremos con los ejercicios de la guía y conversaremos sobre las alternativas.</p>", "mins": 3, "ref": "pp. 3–12"}, {"session": 1, "title": "Activemos ideas previas", "sub": "Pensemos en lo que ya sabemos", "body": "<div class=\"question\"><b>Para conversar</b><p>¿Qué entiendes por democracia y participación?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">La clase recupera distintas ideas y las relaciona con ejemplos y conceptos de la guía.</div></details></div><div class=\"question\"><b>Para conversar</b><p>¿Cómo podemos justificar una respuesta?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Identificando información relevante y explicando cómo se relaciona con el concepto.</div></details></div>", "mins": 4, "ref": ""}, {"session": 1, "title": "¿Por qué importa estar informados?", "sub": "La información permite deliberar y controlar", "body": "<p>Para participar en democracia, las personas necesitan conocer asuntos públicos y contar con distintas fuentes.</p><p>La información también permite examinar decisiones de autoridades y otros actores con poder.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Un medio investiga cómo se usaron recursos de una municipalidad.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Qué puede hacer la ciudadanía con esa información?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Formarse una opinión y exigir explicaciones.</div></details></div>", "mins": 5, "ref": "pp. 3–4"}, {"session": 1, "title": "¿Qué hacen los medios?", "sub": "Informan, seleccionan y ponen temas en discusión", "body": "<p>Los medios buscan y difunden información, pero también seleccionan qué hechos cubrir y cómo presentarlos.</p><p>Sus decisiones pueden influir en la agenda pública: los temas que reciben atención y discusión.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Un noticiario dedica varios días a un problema de transporte.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Dar atención a un tema significa resolverlo?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Puede hacerlo visible; resolverlo corresponde a otros procesos y actores.</div></details></div>", "mins": 5, "ref": "pp. 4 y 10"}, {"session": 1, "title": "¿Qué es la opinión pública?", "sub": "Opiniones que circulan sobre asuntos compartidos", "body": "<p>La opinión pública reúne posiciones que se expresan y discuten sobre asuntos de interés colectivo.</p><p>No es una sola opinión ni representa automáticamente a todas las personas de un país.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Distintos grupos comentan una propuesta de ley desde perspectivas diferentes.</p></div><div class=\"question\"><b>Para conversar</b><p>¿La opinión más visible representa necesariamente a todos?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. La visibilidad no demuestra consenso.</div></details></div>", "mins": 5, "ref": "pp. 4–5"}, {"session": 1, "title": "¿Qué protege la libertad de expresión?", "sub": "Podemos opinar e informar sin censura previa", "body": "<p>La libertad de expresión protege la circulación de ideas e información y favorece el pluralismo.</p><p>La ausencia de censura previa no implica que los delitos o abusos queden sin responsabilidad legal.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Un medio publica una investigación sobre decisiones de una autoridad.</p></div><div class=\"question\"><b>Para conversar</b><p>¿La autoridad debería autorizarla antes por ser incómoda?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">La garantía de no censura previa protege frente a ese control anticipado, con las responsabilidades que establezca la ley.</div></details></div>", "mins": 5, "ref": "pp. 5–7"}, {"session": 1, "title": "¿Qué es el pluralismo informativo?", "sub": "Acceso a perspectivas diversas", "body": "<p>El pluralismo requiere que circulen ideas y voces distintas para que la ciudadanía pueda comparar.</p><p>Si pocas empresas concentran muchos medios, puede reducirse la diversidad de enfoques, aunque concentración y contenido no son exactamente lo mismo.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Varias radios comparten un mismo dueño y repiten la misma pauta.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Qué pregunta conviene hacer?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Qué voces se incluyen, cuáles faltan y quién decide los contenidos.</div></details></div>", "mins": 5, "ref": "pp. 7–10"}, {"session": 1, "title": "¿Cómo cambió internet la comunicación?", "sub": "Las audiencias también producen contenidos", "body": "<p>Las plataformas permiten publicar, comentar y compartir sin pasar siempre por un medio tradicional.</p><p>Eso amplía oportunidades de participación, pero no garantiza que la información sea verdadera o llegue a todas las personas por igual.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Un vecino publica un video sobre un problema del barrio.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Publicar desde un celular convierte automáticamente algo en noticia verificada?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. La información debe revisarse y contrastarse.</div></details></div>", "mins": 5, "ref": "pp. 10–12"}, {"session": 1, "title": "¿Qué es la brecha digital?", "sub": "No todas las personas acceden en las mismas condiciones", "body": "<p>La brecha digital incluye diferencias en conexión, dispositivos y habilidades para usar tecnologías.</p><p>Estas desigualdades pueden afectar el acceso a información, trámites y oportunidades de participación.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una familia tiene teléfono, pero conexión inestable y datos limitados.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Tener un dispositivo elimina todas las barreras digitales?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. También importan la conectividad, el costo y las habilidades de uso.</div></details></div>", "mins": 5, "ref": "pp. 11–12"}, {"session": 1, "title": "¿Cómo analizar una fuente?", "sub": "Identificar quién habla y qué sostiene", "body": "<p>Al leer una fuente, reconoce su autor, fecha, tema y propósito. Luego distingue lo que dice de lo que tú ya sabes.</p><p>Antes de elegir una alternativa, busca qué afirmación se apoya en el texto y evita agregar causas no mencionadas.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Un texto sostiene que difundir escándalos puede afectar la confianza en medios.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Se puede concluir solo con eso que la causa fue la competencia comercial?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Esa explicación no aparece necesariamente en el fragmento.</div></details></div>", "mins": 5, "ref": "pp. 10–12 y 29"}, {"session": 1, "title": "Practiquemos con la guía", "sub": "Preguntas 1, 2, 3, 4, 5", "body": "<p>Resuelve primero en la guía. Luego explica tu alternativa y compara con la revisión.</p><details><summary>Pregunta 1 · Ciudadanía y plataformas</summary><div class=\"answer\"><b>Respuesta: D.</b> Las plataformas permiten que personas generen y difundan contenido.<p><b>Para descartar:</b> No garantizan que todo se verifique antes de publicarse.</p></div></details><details><summary>Pregunta 2 · Autoridades y redes</summary><div class=\"answer\"><b>Respuesta: A.</b> Los anuncios directos pueden aumentar su capacidad de poner temas en la agenda.<p><b>Para descartar:</b> Publicar en redes no elimina el control institucional.</p></div></details><details><summary>Pregunta 3 · Medios y democracia</summary><div class=\"answer\"><b>Respuesta: C.</b> Los medios pueden exponer decisiones al escrutinio ciudadano.<p><b>Para descartar:</b> No reemplazan las funciones de los órganos públicos.</p></div></details><details><summary>Pregunta 4 · Lectura de Castells</summary><div class=\"answer\"><b>Respuesta: C.</b> El autor plantea que difundir escándalos puede poner en riesgo la propia credibilidad de los medios.<p><b>Para descartar:</b> La competencia comercial no es la explicación indicada en el fragmento.</p></div></details><details><summary>Pregunta 5 · Brecha digital</summary><div class=\"answer\"><b>Respuesta: B.</b> Mejorar la conectividad puede ampliar el acceso a información política en línea.<p><b>Para descartar:</b> El texto no establece que se vote por internet.</p></div></details><label>Mis apuntes<textarea data-note=\"s1\" placeholder=\"¿Qué entendí? ¿Qué necesito repasar?\"></textarea></label>", "mins": 25, "ref": "pp. 28–31"}, {"session": 1, "title": "Cerremos la clase", "sub": "Volvamos a la pregunta guía", "body": "<div class=\"question\"><b>Para conversar</b><p>¿Por qué la información importa para la democracia?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">La información permite conocer asuntos públicos, debatir y examinar a quienes ejercen poder.</div></details></div><div class=\"question\"><b>Para conversar</b><p>¿Cómo abordar una pregunta PAES?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Identifico qué se pregunta, busco el dato clave y comparo las alternativas antes de decidir.</div></details></div>", "mins": 5, "ref": ""}, {"session": 2, "title": "Clase 2 · La democracia en la sociedad de la información", "sub": "Sesión 2 · Formación Ciudadana", "body": "<p class=\"lead\">En esta clase exploraremos una pregunta para entender mejor la vida en democracia.</p><div class=\"highlight\"><strong>Pregunta guía</strong><p>¿Cómo analizamos información en el entorno digital?</p></div>", "mins": 3, "ref": "pp. 13–21"}, {"session": 2, "title": "¿Qué aprenderemos hoy?", "sub": "Comprender, relacionar y aplicar", "body": "<p>Explicar los conceptos y situaciones de la guía, relacionándolos con ejemplos cercanos y preguntas de la PAES.</p><div class=\"highlight\"><strong>Pregunta guía</strong><p>¿Cómo analizamos información en el entorno digital?</p></div><p>Al finalizar, trabajaremos con los ejercicios de la guía y conversaremos sobre las alternativas.</p>", "mins": 3, "ref": "pp. 13–21"}, {"session": 2, "title": "Activemos ideas previas", "sub": "Pensemos en lo que ya sabemos", "body": "<div class=\"question\"><b>Para conversar</b><p>¿Qué idea de la clase anterior recuerdas?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">La clase recupera distintas ideas y las relaciona con ejemplos y conceptos de la guía.</div></details></div><div class=\"question\"><b>Para conversar</b><p>¿Cómo podemos justificar una respuesta?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Identificando información relevante y explicando cómo se relaciona con el concepto.</div></details></div>", "mins": 4, "ref": ""}, {"session": 2, "title": "¿Qué es la desinformación?", "sub": "Información falsa o engañosa que puede difundirse con intención", "body": "<p>La desinformación puede producirse o compartirse para engañar; no todo error implica una intención deliberada.</p><p>También puede haber contenidos verdaderos utilizados fuera de contexto para llevar a una conclusión engañosa.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una publicación usa una fotografía antigua para atribuirla a un hecho reciente.</p></div><div class=\"question\"><b>Para conversar</b><p>¿La fotografía debe ser falsa para que el mensaje engañe?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Puede ser real y estar presentada fuera de contexto.</div></details></div>", "mins": 5, "ref": "pp. 13–15"}, {"session": 2, "title": "¿Qué es la posverdad?", "sub": "Cuando emociones y creencias influyen en cómo se recibe una afirmación", "body": "<p>La posverdad describe situaciones en que las apelaciones emocionales y las creencias personales pueden pesar más que la evidencia verificable.</p><p>Comprender emociones es importante, pero una afirmación sobre hechos necesita fuentes y pruebas contrastables.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Un mensaje impactante afirma algo grave sin mostrar evidencia.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Que una noticia provoque indignación demuestra que es verdadera?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. La emoción no reemplaza la verificación.</div></details></div>", "mins": 5, "ref": "pp. 13–15"}, {"session": 2, "title": "¿Cómo verificar una publicación?", "sub": "Detenerse, buscar y comparar", "body": "<p>Primero identifica quién publica, cuándo lo hizo y qué evidencia ofrece. Busca la fuente original antes de compartir.</p><p>Después contrasta con medios o instituciones independientes y revisa si imágenes y cifras corresponden al contexto.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Un mensaje dice que se suspendieron las clases, pero no indica fecha ni fuente.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Qué harías antes de reenviarlo?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Buscar el anuncio original y revisar fecha y contexto.</div></details></div>", "mins": 5, "ref": "pp. 15–16"}, {"session": 2, "title": "¿Qué hacen los algoritmos?", "sub": "Seleccionan contenido según distintos criterios", "body": "<p>Las plataformas ordenan recomendaciones usando señales como interacciones o preferencias; sus criterios pueden ser difíciles de conocer.</p><p>Esa selección puede influir en lo que vemos, pero las personas no están necesariamente encerradas en una sola burbuja.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Dos usuarios reciben publicaciones distintas en la misma aplicación.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Ambos están viendo necesariamente todo lo publicado?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Cada uno puede recibir una selección diferente.</div></details></div>", "mins": 5, "ref": "pp. 16–19"}, {"session": 2, "title": "¿Qué es el microtargeting?", "sub": "Mensajes adaptados a perfiles específicos", "body": "<p>Las campañas pueden usar datos de navegación y preferencias para dirigir mensajes distintos a grupos o personas.</p><p>Esto puede dificultar que el electorado conozca el conjunto de propuestas y que todos puedan examinar lo que se promete.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una campaña muestra una promesa a un grupo y otra distinta a otro.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Qué sería útil revisar?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">El programa completo, las fuentes de las promesas y cómo se usan los datos.</div></details></div>", "mins": 5, "ref": "pp. 16–19"}, {"session": 2, "title": "¿Por qué importan los datos personales?", "sub": "Nuestra información puede utilizarse para influir", "body": "<p>Los datos personales incluyen información que identifica o puede identificar a una persona.</p><p>Conocer qué datos se recolectan y para qué ayuda a ejercer decisiones informadas sobre su uso.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una aplicación solicita acceso a datos que no parecen necesarios para su función.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Por qué conviene revisar los permisos?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Para entender qué información se entrega y evaluar si es necesaria.</div></details></div>", "mins": 5, "ref": "pp. 20–21"}, {"session": 2, "title": "¿Quién debería controlar la desinformación?", "sub": "Una pregunta con riesgos y tensiones", "body": "<p>Enfrentar contenidos engañosos importa, pero el control puede afectar la libertad de expresión si se concentra sin garantías.</p><p>Es necesario examinar transparencia, independencia, responsabilidades y mecanismos de revisión.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una autoridad decide retirar una noticia solo porque le resulta incómoda.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Qué tensión aparece?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">La lucha contra la desinformación puede convertirse en una restricción indebida de la expresión.</div></details></div>", "mins": 5, "ref": "pp. 15 y 30–31"}, {"session": 2, "title": "¿Cómo evaluar influencia?", "sub": "Seguidores y credibilidad no son idénticos", "body": "<p>Una persona puede tener muchos seguidores y aun así influir de maneras diferentes según su relación con la audiencia.</p><p>Una fuente puede valorar el prestigio o confianza que las personas atribuyen a alguien, además de su alcance.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una campaña contrata a quien tiene más seguidores sin analizar su influencia.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Qué objeción plantea el texto de la guía?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">El número de seguidores, por sí solo, no demuestra la capacidad de persuadir.</div></details></div>", "mins": 5, "ref": "p. 30"}, {"session": 2, "title": "Practiquemos con la guía", "sub": "Preguntas 6, 7, 8, 9, 10", "body": "<p>Resuelve primero en la guía. Luego explica tu alternativa y compara con la revisión.</p><details><summary>Pregunta 6 · Concentración de medios</summary><div class=\"answer\"><b>Respuesta: B.</b> La concentración puede reducir la diversidad de visiones difundidas.<p><b>Para descartar:</b> No elimina automáticamente el derecho individual a opinar.</p></div></details><details><summary>Pregunta 7 · Franja electoral</summary><div class=\"answer\"><b>Respuesta: A.</b> La franja gratuita y regulada busca limitar el peso del dinero en esa propaganda.<p><b>Para descartar:</b> No garantiza que todas las afirmaciones sean verdaderas.</p></div></details><details><summary>Pregunta 8 · Influencia y seguidores</summary><div class=\"answer\"><b>Respuesta: C.</b> El texto destaca la autoridad o prestigio que la audiencia atribuye a una persona.<p><b>Para descartar:</b> No sostiene que más seguidores impliquen necesariamente menos credibilidad.</p></div></details><details><summary>Pregunta 9 · Control de información</summary><div class=\"answer\"><b>Respuesta: D.</b> El retiro por autoridad administrativa sin intervención judicial previa representa el riesgo planteado en la pregunta.<p><b>Para descartar:</b> Las otras opciones abordan riesgos o mecanismos diferentes.</p></div></details><details><summary>Pregunta 10 · Mensajes segmentados</summary><div class=\"answer\"><b>Respuesta: B.</b> Si cada persona recibe solo mensajes seleccionados, puede conocer una parte incompleta del programa.<p><b>Para descartar:</b> La segmentación no demuestra que se conozca cómo votó cada persona.</p></div></details><label>Mis apuntes<textarea data-note=\"s2\" placeholder=\"¿Qué entendí? ¿Qué necesito repasar?\"></textarea></label>", "mins": 25, "ref": "pp. 28–31"}, {"session": 2, "title": "Cerremos la clase", "sub": "Volvamos a la pregunta guía", "body": "<div class=\"question\"><b>Para conversar</b><p>¿Cómo analizamos información en el entorno digital?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Identificando fuentes, contrastando evidencia y distinguiendo hechos, opiniones y contenidos fuera de contexto.</div></details></div><div class=\"question\"><b>Para conversar</b><p>¿Cómo abordar una pregunta PAES?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Identifico qué se pregunta, busco el dato clave y comparo las alternativas antes de decidir.</div></details></div>", "mins": 5, "ref": ""}];let pos=0;const main=document.querySelector('main');function show(i){pos=Math.max(0,Math.min(slides.length-1,i));const s=slides[pos];main.innerHTML=`<div class="eyebrow">HIS-M22 / Sesión ${s.session} / ${s.mins} min orientativos</div><h1>${s.title}</h1><h2>${s.sub}</h2>${s.body}<p class="ref">Base: guía HIS-M22, La democracia en la sociedad de la información. ${s.ref}</p>`;document.querySelector('#counter').textContent=`${pos+1} / ${slides.length} · Sesión ${s.session}`;document.querySelector('#bar').style.width=((pos+1)/slides.length*100)+'%';document.querySelector('#prev').disabled=pos===0;document.querySelector('#next').disabled=pos===slides.length-1;document.querySelectorAll('[data-session]').forEach(b=>b.setAttribute('aria-current',Number(b.dataset.session)===s.session));document.querySelectorAll('textarea').forEach(t=>{try{t.value=localStorage.getItem('m22-'+t.dataset.note)||''}catch{}t.oninput=()=>{try{localStorage.setItem('m22-'+t.dataset.note,t.value)}catch{}}});if(document.querySelector('#chart')){draw(false);document.querySelector('#scenario').onchange=()=>draw(false);document.querySelector('#predict').onclick=()=>draw(true)}window.scrollTo(0,0)}function draw(reveal){const v=document.querySelector('#scenario').value;let d=100,o=20;if(v==='dplus')d=124;if(v==='dminus')d=76;if(v==='splus')o=-4;if(v==='sminus')o=44;const p=(d+o)/2,q=(d-o)/2;let x=q=>70+q*4.4,y=p=>315-p*2.1;const line=(q1,p1,q2,p2,color,dash='')=>`<line x1="${x(q1)}" y1="${y(p1)}" x2="${x(q2)}" y2="${y(p2)}" stroke="${color}" stroke-width="3" stroke-dasharray="${dash}"/>`;let out=`<path d="M70 20V315H640" stroke="#675c75" fill="none"/><text x="22" y="24">P</text><text x="640" y="342">Q</text>`;out+=line(0,100,95,5,'#c9bbd8','6 5')+line(0,20,95,115,'#a9d7d9','6 5');out+=line(Math.max(0,d-135),Math.min(d,135),Math.min(d,100),Math.max(0,d-100),'#643a91')+line(Math.max(0,-o),Math.max(0,o),Math.min(100,135-o),Math.min(135,o+100),'#087f89');out+='<text x="525" y="295" fill="#643a91">D</text><text x="505" y="35" fill="#087f89">O</text>';if(reveal){out+=`<circle cx="${x(q)}" cy="${y(p)}" r="7" fill="#271c3b"/><path d="M70 ${y(p)}H${x(q)}V315" stroke="#665878" stroke-dasharray="4 4" fill="none"/><text x="10" y="${y(p)+6}">${p}</text><text x="${x(q)-8}" y="342">${q}</text>`}document.querySelector('#chart').innerHTML=out;document.querySelector('#result').textContent=reveal?`Equilibrio: P = ${p}; Q = ${q}. ${({base:'Inicial: P = 60; Q = 40.',dplus:'Mayor demanda: suben precio y cantidad.',dminus:'Menor demanda: bajan precio y cantidad.',splus:'Mayor oferta: baja precio y sube cantidad.',sminus:'Menor oferta: sube precio y baja cantidad.'})[v]} Líneas discontinuas: curvas iniciales.`:'Antes de mostrar el resultado, piensa qué pasa con el precio y la cantidad. Las líneas punteadas muestran la situación inicial.'}document.querySelector('#prev').onclick=()=>show(pos-1);document.querySelector('#next').onclick=()=>show(pos+1);document.querySelectorAll('[data-session]').forEach(b=>b.onclick=()=>show(slides.findIndex(s=>s.session==b.dataset.session)));const dlg=document.querySelector('dialog');document.querySelector('#index').onclick=()=>dlg.showModal();document.querySelector('#close').onclick=()=>dlg.close();document.querySelector('#list').innerHTML=slides.map((s,i)=>`<button data-i="${i}">S${s.session} · ${s.title} <small>(${s.mins} min)</small></button>`).join('');document.querySelector('#list').onclick=e=>{const b=e.target.closest('[data-i]');if(b){show(+b.dataset.i);dlg.close()}};document.querySelector('#full').onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>{})}else document.exitFullscreen?.()};document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT','SUMMARY','BUTTON'].includes(e.target.tagName)||dlg.open)return;if(e.key==='ArrowRight'){e.preventDefault();show(pos+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(pos-1)}});show(0);</script></html>
