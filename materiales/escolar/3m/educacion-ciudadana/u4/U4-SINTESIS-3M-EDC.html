w,34px);margin:18px 0}.level{font-weight:900;text-transform:uppercase;letter-spacing:.08em}.Blanco{color:#5b6874}.Azul{color:#176fc1}.Verde{color:#08704b}.options{display:grid;gap:10px;margin:16px 0}.option{text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px}.option.sel{border-color:var(--navy);background:var(--blue)}.option.ok{border-color:var(--green);background:var(--green2)}.option:disabled{cursor:default}.feedback{display:none;margin-top:12px;padding:12px;border-left:5px solid var(--green);background:var(--green2)}.feedback.show{display:block}.feedback.bad{border-color:var(--red);background:#fff0f0}.steps{display:grid;gap:10px}.step{border:2px dashed var(--line);border-radius:12px;padding:15px;background:#fff;color:var(--muted)}.step.revealed{border-style:solid;border-color:var(--green);background:var(--green2);color:var(--ink)}blockquote{margin:12px 0;padding:16px 20px;background:#f7fafc;border-left:6px solid var(--navy);font-size:1.08rem}.prompts{display:grid;gap:12px}.prompt{padding:14px;border-radius:12px;background:var(--blue)}textarea{width:100%;min-height:135px;border:2px solid var(--line);border-radius:12px;padding:13px;resize:vertical}.notice{display:none;color:var(--red);font-weight:800}.notice.show{display:block}.criteria{background:var(--green2);padding:14px;border-radius:12px}.model{display:none;margin-top:12px;padding:15px;background:#fff7eb;border-left:5px solid var(--orange)}.model.show{display:block}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:#fff;border-radius:16px;padding:20px;border:1px solid var(--line);text-align:center}.stat b{display:block;color:var(--navy);font-size:2rem}.reviewlist li{margin:8px 0}.book{color:var(--muted);font-weight:750}.sr{position:absolute;left:-9999px}@media(max-width:780px){body{font-size:17px}.axisgrid,.flashgrid,.stats{grid-template-columns:1fr}.navin{padding:8px}.topic,.case,.reading,.writebox,.mapbox{padding:20px}.essential{align-it </style></head><body><header class="mast"><div class="eyebrow">Biblioteca interactiva de estudio</div><h1>Síntesis interactiva de Unidad 4</h1><p>Economía, Estado y desarrollo para el bien común</p><div class="id">Cristóbal · 3° Medio · Unidad 4 · EDC</div><div class="progressline"><i id="topProgress"></i></div></header><nav class="nav" aria-label="Navegación principal"><div class="navin" id="nav"></div></nav><main class="wrap" id="app"></main><script>
const D={"axes":[{"name":"Escasez y decisiones","goal":"Explicar por qué elegir implica renuncias y criterios de asignación.","pages":"90–97","topics":[["¿Por qué la escasez obliga a decidir?","Las necesidades son múltiples y los recursos disponibles son limitados.","La escasez no significa ausencia total, sino imposibilidad de satisfacer simultáneamente todos los usos. Elegir una alternativa implica renunciar a otra: ese sacrificio es el costo de oportunidad.",["escasez","elección","costo de oportunidad"],"Recursos limitados → alternativas → elección → renuncia","¿Qué se sacrifica al elegir una alternativa?"],["¿Qué preguntas organiza toda economía?","Toda sociedad decide qué producir, cómo producir y para quién producir.","Estas preguntas distribuyen recursos, métodos y resultados. Sus respuestas incorporan criterios de eficiencia, derechos, necesidades, propiedad y bien común.",["qué producir","cómo producir","para quién"],"Necesidad → decisión productiva → distribución","¿Cuál pregunta económica aborda la distribución?"],["¿Quiénes participan como agentes económicos?","Familias, empresas y Estado toman decisiones interdependientes.","Las familias consumen, trabajan y ahorran; las empresas producen, contratan e invierten; el Estado regula, recauda y provee bienes o servicios. Ningún agente actúa de forma aislada.",["familias","empresas","Estado"],"Trabajo e ingresos ↔ consumo y producción ↔ regulación","¿Qué intercambio conecta directamente a familias y empresas?"]]},{"name":"Sistemas y coordinación","goal":"Comparar formas de coordinación y comprender el carácter mixto de la economía.","pages":"98–105","topics":[["¿Cómo se diferencian los sistemas económicos?","Se distinguen por quién decide y cómo se asignan recursos y bienes.","El mercado coordina mediante precios y decisiones descentralizadas; la planificación central concentra decisiones; un sistema mixto combina iniciativa privada y acción estatal.",["mercado","planificación","sistema mixto"],"Reglas e instituciones → decisiones → asignación","¿Qué rasgo define a un sistema mixto?"],["¿Cómo circulan recursos e ingresos?","Los agentes intercambian trabajo, dinero, bienes, servicios e impuestos.","Los flujos reales corresponden a trabajo, bienes y servicios; los monetarios incluyen salarios, pagos, ahorro, inversión e impuestos. Observar ambos muestra la interdependencia económica.",["flujo real","flujo monetario","interdependencia"],"Trabajo → producción → ingreso → consumo","¿Qué diferencia un flujo real de uno monetario?"],["¿Por qué Estado y mercado pueden complementarse?","La coordinación combina iniciativa, regulación y provisión orientada al interés público.","Los mercados pueden organizar intercambios, mientras el Estado corrige fallas, protege derechos y garantiza bienes públicos. La pregunta central es qué combinación responde mejor al problema.",["regulación","falla de mercado","bien público"],"Problema colectivo → coordinación → resultados → evaluación","¿En qué caso se justifica una regulación pública?"]]},{"name":"Estado y políticas públicas","goal":"Relacionar impuestos, regulación, probidad y estabilidad con el bien común.","pages":"106–111","topics":[["¿Qué funciones económicas cumple el Estado?","Regula, redistribuye, provee bienes públicos y contribuye a estabilizar la economía.","El Estado establece reglas, financia servicios, reduce brechas y responde a fluctuaciones. Estas funciones deben evaluarse por sus efectos, costos y contribución al bienestar colectivo.",["regulación","redistribución","estabilización"],"Diagnóstico → función estatal → medida → evaluación","¿Qué función aparece al financiar acceso a salud?"],["¿Para qué sirven los impuestos?","Financian la acción pública y pueden contribuir a redistribuir recursos.","Los impuestos directos gravan renta o patrimonio; los indirectos recaen sobre consumo. Su diseño influye en recaudación, equidad e incentivos económicos.",["impuesto directo","impuesto indirecto","recaudación"],"Tributo → presupuesto → política pública → servicio","¿Qué diferencia principal existe entre impuestos directos e indirectos?"],["¿Qué protegen la probidad y la estabilidad monetaria?","La probidad cuida el uso íntegro de recursos; el Banco Central resguarda la estabilidad de precios.","La probidad exige decisiones públicas honestas y orientadas al interés general. El Banco Central actúa con herramientas monetarias para evitar que la inflación deteriore el poder adquisitivo.",["probidad","Banco Central","inflación"],"Confianza pública + estabilidad → mejores condiciones colectivas","¿Por qué la inflación afecta especialmente a hogares vulnerables?"]]},{"name":"Desigualdad y sostenibilidad","goal":"Distinguir crecimiento, desarrollo, pobreza y desigualdad para evaluar políticas.","pages":"112–120","topics":[["¿Son iguales pobreza y desigualdad?","La pobreza describe carencias; la desigualdad compara cómo se distribuyen recursos y oportunidades.","Una sociedad puede reducir pobreza y mantener grandes brechas. El coeficiente de Gini aproxima la concentración del ingreso, pero debe complementarse con información social.",["pobreza","desigualdad","Gini"],"Ingresos y oportunidades → distribución → brechas","¿Por qué bajar la pobreza no elimina necesariamente la desigualdad?"],["¿En qué se diferencian crecimiento y desarrollo?","Crecer aumenta la producción; desarrollarse amplía capacidades y calidad de vida.","El crecimiento puede entregar recursos, pero no garantiza acceso equitativo a salud, educación o participación. El desarrollo humano evalúa resultados más amplios.",["crecimiento","desarrollo humano","capacidades"],"Producción → recursos → políticas → bienestar","¿Qué evidencia mostraría desarrollo además de crecimiento?"],["¿Qué exige el desarrollo sostenible?","Integrar viabilidad económica, justicia social y cuidado ambiental.","Una decisión sostenible considera efectos actuales y futuros. No basta con reducir contaminación si aumenta la exclusión, ni con crecer si se destruyen las condiciones que sostienen la vida.",["sostenibilidad","equidad","ambiente"],"Decisión → impactos económicos, sociales y ambientales → ajuste","¿Qué dimensiones deben evaluarse conjuntamente?"]]}],"maps":[["Decidir bajo escasez",["Necesidades","Recursos limitados","Alternativas y costos","Decisión justificada"]],["Circuito económico",["Trabajo y recursos","Producción","Ingresos e impuestos","Consumo y servicios"]],["De problema a política",["Diagnóstico","Diseño y financiamiento","Implementación","Evaluación pública"]],["Del crecimiento al desarrollo",["Producción","Recursos disponibles","Distribución y capacidades","Bienestar sostenible"]]],"reads":[["Agua limitada","Una sequía reduce el agua disponible. Hogares, agricultura e industria requieren el recurso y la autoridad debe fijar prioridades públicas.","Aplicar escasez, costo de oportunidad y bien común."],["Un servicio mixto","El Estado financia vacunación mediante impuestos, regula estándares y contrata centros privados para ampliar la cobertura.","Reconocer funciones y coordinación Estado-mercado."],["Crecimiento sin bienestar","Una región aumenta su producción, pero mantiene brechas educativas y contaminación severa en comunas de menores ingresos.","Distinguir crecimiento, desigualdad y desarrollo sostenible."],["Presupuesto bajo sospecha","Una municipalidad adjudica fondos a una empresa vinculada con una autoridad y oculta los criterios de selección.","Examinar probidad, transparencia y confianza pública."]],"writes":[["¿Cómo priorizar recursos escasos?","140–180 palabras","Criterio explícito; costo de oportunidad; bien común."],["¿Qué combinación de Estado y mercado conviene?","150–190 palabras","Problema concreto; funciones; límites; evaluación."],["¿Basta el crecimiento para hablar de desarrollo?","150–190 palabras","Distinción conceptual; evidencia; consecuencia social."],["Diseña una política pública sostenible","170–220 palabras","Problema; medida; financiamiento; dimensiones social y ambiental."]],"cards":[{"a":0,"q":"escasez","d":"Idea central: Las necesidades son múltiples y los recursos disponibles son limitados.","e":"Ejemplo o secuencia: Recursos limitados → alternativas → elección → renuncia","r":"Se relaciona con elección.","x":"Evita usar el concepto como una etiqueta sin explicar la relación."},{"a":0,"q":"elección","d":"Permite comprender ¿por qué la escasez obliga a decidir?","e":"La escasez no significa ausencia total, sino imposibilidad de satisfacer simultáneamente todos los usos.","r":"Conecta con escasez y costo de oportunidad.","x":"Evita confundir una definición con un ejemplo aislado."},{"a":0,"q":"¿Por qué la escasez obliga a decidir?","d":"Las necesidades son múltiples y los recursos disponibles son limitados.","e":"Recursos limitados → alternativas → elección → renuncia","r":"Pregunta de control: ¿Qué se sacrifica al elegir una alternativa?","x":"Responde con una relación explicada, no solo con una palabra."},{"a":0,"q":"qué producir","d":"Idea central: Toda sociedad decide qué producir, cómo producir y para quién producir.","e":"Ejemplo o secuencia: Necesidad → decisión productiva → distribución","r":"Se relaciona con cómo producir.","x":"Evita usar el concepto como una etiqueta sin explicar la relación."},{"a":0,"q":"cómo producir","d":"Permite comprender ¿qué preguntas organiza toda economía?","e":"Estas preguntas distribuyen recursos, métodos y resultados.","r":"Conecta con qué producir y para quién.","x":"Evita confundir una definición con un ejemplo aislado."},{"a":0,"q":"¿Qué preguntas organiza toda economía?","d":"Toda sociedad decide qué producir, cómo producir y para quién producir.","e":"Necesidad → decisión productiva → distribución","r":"Pregunta de control: ¿Cuál pregunta económica aborda la distribución?","x":"Responde con una relación explicada, no solo con una palabra."},{"a":0,"q":"familias","d":"Idea central: Familias, empresas y Estado toman decisiones interdependientes.","e":"Ejemplo o secuencia: Trabajo e ingresos ↔ óstico → función estatal → medida → evaluación","r":"Se relaciona con redistribución.","x":"Evita usar el concepto como una etiqueta sin explicar la relación."},{"a":2,"q":"redistribución","d":"Permite comprender ¿qué funciones económicas cumple el estado?","e":"El Estado establece reglas, financia servicios, reduce brechas y responde a fluctuaciones.","r":"Conecta con regulación y estabilización.","x":"Evita confundir una definición con un ejemplo aislado."},{"a":2,"q":"¿Qué funciones económicas cumple el Estado?","d":"Regula, redistribuye, provee bienes públicos y contribuye a estabilizar la economía.","e":"Diagnóstico → función estatal → medida → evaluación","r":"Pregunta de control: ¿Qué función aparece al financiar acceso a salud?","x":"Responde con una relación explicada, no solo con una palabra."},{"a":2,"q":"impuesto directo","d":"Idea central: Financian la acción pública y pueden contribuir a redistribuir recursos.","e":"Ejemplo o secuencia: Tributo → presupuesto → política pública → servicio","r":"Se relaciona con impuesto indirecto.","x":"Evita usar el concepto como una etiqueta sin explicar la relación."},{"a":2,"q":"impuesto indirecto","d":"Permite comprender ¿para qué sirven los impuestos?","e":"Los impuestos directos gravan renta o patrimonio; los indirectos recaen sobre consumo.","r":"Conecta con impuesto directo y recaudación.","x":"Evita confundir una definición con un ejemplo aislado."},{"a":2,"q":"¿Para qué sirven los impuestos?","d":"Financian la acción pública y pueden contribuir a redistribuir recursos.","e":"Tributo → presupuesto → política pública → servicio","r":"Pregunta de control: ¿Qué diferencia principal existe entre impuestos directos e indirectos?","x":"Responde con una relación explicada, no solo con una palabra."},{"a":2,"q":"probidad","d":"Idea central: La probidad cuida el uso íntegro de recursos; el Banco Central resguarda la estabilidad de precios.","e":"Ejemplo o secuencia: Confianza pública + estabilidad → mejores condiciones puede ahorrar ingresos?",["El Banco Central autónomo nacional","Las empresas productoras de servicios","Las familias como agentes económicos","Los municipios mediante políticas territoriales"]],["Blanco","¿Qué sistema combina iniciativa privada con acción estatal?",["Un sistema económico completamente mixto","Una planificación central sin mercado","Un mercado ausente de regulación","Una economía doméstica sin intercambio"]],["Azul","El Estado financia vacunación y fiscaliza centros privados. ¿Qué relación muestra?",["Eliminación completa del intercambio económico","Ausencia total de responsabilidades públicas","Sustitución de familias por empresas","Coordinación entre regulación y provisión"]],["Azul","Un tributo grava directamente la renta anual personal. ¿Cómo se clasifica?",["Impuesto indirecto aplicado al consumo","Pago voluntario por servicios públicos","Impuesto directo sobre los ingresos","Ahorro privado destinado a inversión"]],["Azul","Una autoridad favorece a familiares usando fondos públicos. ¿Qué principio vulnera?",["La productividad de todos los agentes","La probidad en función pública aquí","La escasez de recursos naturales aquí","La estabilidad general de precios aquí"]],["Azul","Una región produce más, pero aumenta contaminación y segregación. ¿Qué conclusión corresponde?",["Logró desarrollo humano plenamente sostenible aquí","Eliminó desigualdad mediante mayor producción aquí","La política pública dejó de importar","Creció sin asegurar desarrollo integral aquí"]],["Verde","¿Qué medida combina redistribución y provisión pública?",["Financiar becas mediante impuestos progresivos","Eliminar estándares para reducir costos","Privatizar plazas sin acceso gratuito","Fijar salarios solamente por sorteo"]],["Verde","¿Qué diferencia mejor pobreza y desigualdad?",["Ambas miden exactamente la misma carencia","Una observa carencias; otra, distribución relativa","Una mide inflación; otra, productividad laboral","Ambas desaparecen cuando aumenta el producto"]],["Verde","¿Qué evaluación corresponde a una política sostenible?",["Considerar únicamente su rentabilidad inmediata aquí","Medir solamente la cantidad producida anualmente","Evitar participación para ejecutar rápidamente aquí","Comparar impactos económicos, sociales y ambientales"]],["Verde","¿Qué función cumple el Banco Central principalmente?",["Contribuir a la estabilidad general de precios","Elegir directamente todas las inversiones privadas aquí","Recaudar impuestos para financiar municipalidades aquí también","Distribuir gratuitamente todos los bienes públicos aquí"]],["Verde","¿Qué evidencia indica desarrollo humano además de crecimiento?",["Aumenta solamente la producción minera regional","Suben ventas sin mejorar servicios públicos","Mejoran capacidades, equidad y entorno ambiental","Crecen precios sin aumentar ingresos reales"]]]},META={"abbr":"EDC","subject":"Educación Ciudadana","title":"Economía, Estado y desarrollo para el bien común","intro":"Explora cómo la escasez obliga a decidir, cómo se relacionan los agentes económicos y qué funciones cumplen el Estado, las políticas públicas y la ciudadanía frente a la desigualdad y la sostenibilidad."};const app=document.getElementById('app'),nav=document.getElementById('nav'),topProgress=document.getElementById('topProgress');const KEY='U4-SINTESIS-3M-'+META.abbr+'-v1';const tabs=[['home','Inicio'],['content','Ejes de contenido'],['flash','Flashcards'],['cases','Casos de aplicación'],['reads','Lecturas guiadas'],['maps','Mapas y relaciones'],['writes','Desafíos de escritura'],['progress','Progreso']];let S=load(),current='home',axisFilter='all';
function fresh(){return{last:'home',topics:{},cards:{},cases:{},reads:{},writes:{},maps:{}}}function load(){try{return Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return fresh()}}function save(){S.last=current;localStorage.setItem(KEY,JSON.stringify(S));updateProgress()}function e(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}function cat(){return '<svg class="cat" viewBox="0 0 64 48" aria-hidden="true"><path d="M12 21 8 5l15 10c6-2 12-2 18 0L56 5l-4 17c3 4 4 8 3 13-2 9-12 13-23 13S11 44 9 35c-1-5 0-10 3-14Zm12 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm16 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm-8 10c4 0 7-2 8-5H24c1 3 4 5 8 5Z"/></svg>'}
function go(id,ax){current=id;if(ax!==undefined)axisFilter=String(ax);render();scrollTo({top:0,behavior:'smooth'});save()}window.go=go;
function renderNav(){nav.innerHTML=tabs.map(t=>'<button '+(current===t[0]?'class="on"':'')+' data-go="'+t[0]+'">'+t[1]+'</button>').join('');nav.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go))}
function render(){renderNav();app.innerHTML='<section class="view on">'+({home:home(),content:content(),flash:flash(),cases:cases(),reads:reads(),maps:maps(),writes:writes(),progress:progress()}[current])+'</section>';bind();updateProgress()}
function home(){return '<div class="hero"><h2>Tu biblioteca de la Unidad 4</h2><p class="lead">'+META.intro+'</p><p>Puedes estudiar un eje completo o entrar directamente a flashcards, casos, lecturas, mapas y escritura. No existe un orden obligatorio.</p><div class="axisgrid">'+D.axes.map((a,i)=>'<article class="axis"><small>EJE '+(i+1)+' · PÁGINAS '+a.pages+'</small><h3>'+a.name+'</h3><p>'+a.goal+'</p><button data-go="content" data-axis="'+i+'">Explorar este eje</button></article>').join('')+'</div><div class="homeacts"><button class="primary" data-go="'+(S.last==='home'?'content':S.last)+'">Continuar desde el último punto</button><button class="secondary danger" id="reset">Reiniciar progreso</button></div></div>'}
function filter(){return '<div class="tools"><label>Mostrar eje: <select id="axisFilter"><option value="all">Todos los ejes</option>'+D.axes.map((a,i)=>'<option value="'+i+'" '+(axisFilter==i?'selected':'')+'>'+a.name+'</option>').join('')+'</select></label></div>'}
function content(){const axes=D.axes.map((a,ai)=>{if(axisFilter!=='all'&&axisFilter!=ai)return '';return '<section><div class="axisintro"><small>EJE '+(ai+1)+' · Libro: '+a.pages+'</small><h2>'+a.name+'</h2><p>'+a.goal+' Se conecta con los demás ejes porque permite pasar de conceptos y decisiones a sus efectos públicos.</p><b>Al finalizar, deberías poder explicar, relacionar y aplicar estos conceptos en un caso nuevo.</b></div><div class="topics">'+a.topics.map((t,ti)=>{const k=ai+'-'+ti;return '<article class="topic"><h3>'+t[0]+'</h3><div class="essential">'+cat()+'<span>'+t[1]+'</span></div><p>'+t[2]+'</p><div class="concepts">'+t[3].map(x=>'<span>'+x+'</span>').join('')+'</div><div class="relation"><b>Relación clave</b><br>'+t[4]+'</div><div class="check"><details><summary>Comprueba tu comprensión</summary><p>'+t[5]+'</p><p><b>Ruta:</b> responde con una idea del tema y explica una relación.</p></details></div><p class="book">Revisemos el libro en las páginas '+a.pages+' para profundizar este tema.</p><button class="secondary topicdone '+(S.topics[k]?'done':'')+'" data-k="'+k+'">'+(S.topics[k]?'Tema revisado ✓':'Marcar tema revisado')+'</button></article>'}).join('')+'</div></section>'}).join('');return '<h2>Ejes y temas de contenido</h2><p class="lead">Cada tema parte con una pregunta y concentra lo esencial junto al gato naranja.</p>'+filter()+axes}
function flash(){const list=D.cards.map((x,i)=>{if(axisFilter!=='all'&&axisFilter!=x.a)return '';const st=S.cards[i];return '<article class="flash '+(st&&st.flip?'flip':'')+'" data-card="'+i+'"><div class="front"><span class="tag">'+D.axes[x.a].name+'</span><h3>'+x.q+'</h3><p>Intenta recordarlo antes de girar la tarjeta.</p></div><div class="back"><h3>'+x.q+'</h3><p><b>Definición:</b> '+x.d+'</p><p><b>Ejemplo:</b> '+x.e+'</p><p><b>Relación:</b> '+x.r+'</p><p><b>Error frecuente:</b> '+x.x+'</p></div><footer><button class="secondary flip">Girar tarjeta</button><button class="mark" data-cardmark="'+i+'" data-v="ok">Lo comprendí</button><button class="review" data-cardmark="'+i+'" data-v="review">Necesito repasarlo</button></footer></article>'}).join('');return '<h2>Flashcards por eje</h2><p class="lead">36 tarjetas para recuperar conceptos, ejemplos y relaciones.</p>'+filter()+'<div class="flashgrid">'+list+'</div>'}
function cases(){return '<h2>Casos de aplicación</h2><p class="lead">Selecciona una alternativa y luego confirma. Los errores solo se registran al confirmar; la respuesta correcta permanece oculta hasta acertar.</p>'+D.cases.map((q,i)=>{const s=S.cases[i]||{};return '<article class="case" data-case="'+i+'"><div class="level '+q[0]+'">Nivel '+q[0]+'</div><h3>'+(i+1)+'. '+q[1]+'</h3><div class="options">'+q[2].map((o,j)=>'<button class="option '+(s.sel===j?'sel ':'')+(s.done&&q.a===j?'ok':'')+'" data-opt="'+j+'" '+(s.done||((s.tried||[]).includes(j))?'disabled':'')+'>'+String.fromCharCode(65+j)+'. '+o+'</button>').join('')+'</div><button class="confirm" '+(s.sel===undefined||s.done?'disabled':'')+'>Confirmar</button><div class="feedback '+(s.msg?'show ':'')+(s.done?'':'bad')+'">'+(s.msg||'')+'</div></article>'}).join('')}
function reads(){return '<h2>Lecturas guiadas</h2><p class="lead">Lee cada situación y responde desde tres niveles. Los apoyos orientan el proceso sin entregar la respuesta.</p>'+D.reads.map((r,i)=>'<article class="reading"><span class="tag">Lectura '+(i+1)+'</span><h3>'+r[0]+'</h3><p><b>Contexto:</b> '+r[2]+'</p><blockquote>'+r[1]+'</blockquote><div class="prompts"><div class="prompt"><b class="Blanco">Blanco · Identificar</b><br>¿Qué hecho o problema central presenta el texto?</div><div class="prompt"><b class="Azul">Azul · Relacionar</b><br>Relaciona el caso con dos conceptos de la unidad.<br><small>Apoyo: nombra cada concepto y explica el vínculo con una evidencia del texto.</small></div><div class="prompt"><b class="Verde">Verde · Interpretar</b><br>Formula una conclusión justificada o una decisión responsable.<br><small>Apoyo: postura → evidencia → concepto → consecuencia.</small></div></div><textarea data-read="'+i+'" placeholder="Escribe tus respuestas con tus propias palabras.">'+e(S.reads[i]&&S.reads[i].text||'')+'</textarea><p class="notice">Pegar está deshabilitado. Escribe la respuesta con tus propias palabras.</p><button class="secondary readDone" data-i="'+i+'">'+(S.reads[i]&&S.reads[i].done?'Lectura completada ✓':'Marcar lectura completada')+'</button></article>').join('')}
function maps(){return '<h2>Mapas y relaciones</h2><p class="lead">Revela cada proceso por etapas e intenta anticipar el paso siguiente.</p>'+D.maps.map((m,i)=>'<article class="mapbox"><span class="tag">Mapa '+(i+1)+'</span><h3>'+m[0]+'</h3><div class="steps">'+m[1].map((s,j)=>'<button class="step '+((S.maps[i]||0)>j?'revealed':'')+'" data-map="'+i+'" data-step="'+j+'">'+((S.maps[i]||0)>j?(j+1)+'. '+s:'Revelar paso '+(j+1))+'</button>').join('')+'</div></article>').join('')}
function writes(){return '<h2>Desafíos de escritura</h2><p class="lead">Escribe primero. El modelo de estructura se habilita después de producir un borrador suficiente.</p>'+D.writes.map((w,i)=>{const s=S.writes[i]||{};return '<article class="writebox"><span class="tag">Desafío '+(i+1)+'</span><h3>'+w[0]+'</h3><p><b>Extensión:</b> '+w[1]+'</p><div class="criteria"><b>Criterios:</b> '+w[2]+'<br><b>Conectores útiles:</b> porque · sin embargo · por ejemplo · por lo tanto.</div><textarea data-write="'+i+'" placeholder="Redacta aquí tu respuesta.">'+e(s.text||'')+'</textarea><p class="notice">Pegar está deshabilitado. Escribe la respuesta con tus propias palabras.</p><div class="homeacts"><button class="secondary compare" data-i="'+i+'" '+((s.text||'').trim().length<120?'disabled':'')+'>Comparar con una estructura modelo</button><button class="secondary writeDone" data-i="'+i+'">'+(s.done?'Desafío completado ✓':'Marcar como completado')+'</button></div><div class="model '+(s.model?'show':'')+'"><b>Estructura modelo, no respuesta:</b> inicia con una tesis directa; desarrolla una razón con un concepto; agrega evidencia o ejemplo; considera una objeción; cierra explicando una consecuencia.</div></article>'}).join('')}
function calc(){const vals=[Object.keys(S.topics).filter(k=>S.topics[k]).length/(D.axes.length*3),Object.keys(S.cards).filter(k=>S.cards[k].mark).length/D.cards.length,Object.keys(S.cases).filter(k=>S.cases[k].done).length/D.cases.length,Object.keys(S.reads).filter(k=>S.reads[k].done).length/D.reads.length,Object.keys(S.maps).filter(k=>(S.maps[k]||0)>=D.maps[k][1].length).length/D.maps.length,Object.keys(S.writes).filter(k=>S.writes[k].done).length/D.writes.length];return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*100)}
function progress(){const understood=Object.keys(S.cards).filter(k=>S.cards[k].mark==='ok').length,review=Object.keys(S.cards).filter(k=>S.cards[k].mark==='review').map(k=>D.cards[k].q);return '<h2>Mi progreso</h2><div class="stats"><div class="stat"><b>'+calc()+'%</b>avance global</div><div class="stat"><b>'+Object.keys(S.topics).filter(k=>S.topics[k]).length+'/12</b>temas revisados</div><div class="stat"><b>'+understood+'/36</b>flashcards comprendidas</div><div class="stat"><b>'+Object.keys(S.cases).filter(k=>S.cases[k].done).length+'/12</b>casos logrados</div></div><article class="panel" style="padding:26px;margin-top:18px"><h3>Conceptos que necesitan repaso</h3>'+(review.length?'<ul class="reviewlist">'+review.map(x=>'<li>'+x+'</li>').join('')+'</ul>':'<p>Aún no has marcado tarjetas para repasar.</p>')+'<p><small>Este registro es una ayuda local de estudio y no garantiza autoría ni reemplaza la retroalimentación docente.</small></p></article>'}
function bind(){document.querySelectorAll('#app [data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go,b.dataset.axis));const af=document.getElementById('axisFilter');if(af)af.onchange=()=>{axisFilter=af.value;render()};document.querySelectorAll('.topicdone').forEach(b=>b.onclick=()=>{S.topics[b.dataset.k]=!S.topics[b.dataset.k];save();render()});document.querySelectorAll('.flip').forEach(b=>b.onclick=()=>{const el=b.closest('.flash'),i=el.dataset.card;S.cards[i]=S.cards[i]||{};S.cards[i].flip=!S.cards[i].flip;save();el.classList.toggle('flip')});document.querySelectorAll('[data-cardmark]').forEach(b=>b.onclick=()=>{const i=b.dataset.cardmark;S.cards[i]=S.cards[i]||{};S.cards[i].mark=b.dataset.v;save();render()});document.querySelectorAll('.case').forEach(el=>{const i=+el.dataset.case,q=D.cases[i],s=S.cases[i]=S.cases[i]||{tried:[],attempts:0,errors:0};el.querySelectorAll('.option').forEach(o=>o.onclick=()=>{s.sel=+o.dataset.opt;save();render()});el.querySelector('.confirm').onclick=()=>{if(s.sel===undefined||s.done)return;s.attempts++;if(s.sel===q.a){s.done=true;s.msg='Correcto. La alternativa aplica el concepto central al caso y mantiene una relación coherente con la unidad.'}else{s.errors++;s.tried.push(s.sel);delete s.sel;s.msg='Revisa qué concepto explica mejor la relación del caso y vuelve a intentarlo. La respuesta correcta sigue oculta.'}save();render()}});document.querySelectorAll('textarea').forEach(t=>guard(t));document.querySelectorAll('[data-read]').forEach(t=>t.oninput=()=>{const i=t.dataset.read;S.reads[i]=S.reads[i]||{};S.reads[i].text=t.value;save()});document.querySelectorAll('.readDone').forEach(b=>b.onclick=()=>{const i=b.dataset.i,Sr=S.reads[i]=S.reads[i]||{};Sr.done=!!(Sr.text||'').trim();if(!Sr.done)alert('Escribe primero una respuesta propia.');save();render()});document.querySelectorAll('[data-write]').forEach(t=>t.oninput=()=>{const i=t.dataset.write;S.writes[i]=S.writes[i]||{};S.writes[i].text=t.value;save();const b=t.closest('.writebox').querySelector('.compare');b.disabled=t.value.trim().length<120});document.querySelectorAll('.compare').forEach(b=>b.onclick=()=>{S.writes[b.dataset.i]=S.writes[b.dataset.i]||{};S.writes[b.dataset.i].model=true;save();render()});document.querySelectorAll('.writeDone').forEach(b=>b.onclick=()=>{const i=b.dataset.i,s=S.writes[i]=S.writes[i]||{};s.done=(s.text||'').trim().length>=120;if(!s.done)alert('Desarrolla primero un borrador de al menos 120 caracteres.');save();render()});document.querySelectorAll('[data-map]').forEach(b=>b.onclick=()=>{const i=+b.dataset.map,j=+b.dataset.step,n=S.maps[i]||0;if(j===n)S.maps[i]=n+1;save();render()});const resetBtn=document.getElementById('reset');if(resetBtn)resetBtn.onclick=()=>{if(confirm('¿Reiniciar todo el progreso guardado en este navegador?')){localStorage.removeItem(KEY);S=fresh();current='home';render()}}}
function guard(t){const msg=t.parentElement.querySelector('.notice');const block=ev=>{ev.preventDefault();msg&&msg.classList.add('show');setTimeout(()=>msg&&msg.classList.remove('show'),2600)};t.addEventListener('paste',block);t.addEventListener('drop',block);t.addEventListener('beforeinput',ev=>{if(['insertFromPaste','insertFromPasteAsQuotation','insertFromDrop'].includes(ev.inputType))block(ev)});t.addEventListener('keydown',ev=>{if(((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='v')||(ev.shiftKey&&ev.key==='Insert'))block(ev)})}
function updateProgress(){topProgress.style.width=calc()+'%'}render();
</script></body></html>
