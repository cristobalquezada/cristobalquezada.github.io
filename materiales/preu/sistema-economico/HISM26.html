<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HIS-M26 · Mercado · Dos sesiones</title><style>*{box-sizing:border-box} :root{--purple:#643a91;--dark:#271c3b;--teal:#087f89;--line:#ddd7e7}body{margin:0;background:#f6f4f9;color:var(--dark);font-family:Inter,Arial,sans-serif}button,select,textarea{font:inherit}button,select,summary{cursor:pointer}button{border:1px solid var(--line);background:white;color:var(--dark);padding:12px 17px;border-radius:8px}button:hover,button[aria-current=true]{background:var(--purple);color:white}button:focus-visible,summary:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #11a9b5;outline-offset:3px}header{padding:15px 4vw;background:white;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px}header small{display:block;color:var(--teal);margin-top:4px}nav{display:flex;gap:8px;flex-wrap:wrap}.progress{height:4px;background:#e4dfee}.progress div{height:100%;background:linear-gradient(90deg,var(--purple),#13a9b3)}main{max-width:1240px;margin:auto;padding:40px 5vw 100px}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:13px;color:var(--teal);font-weight:bold}h1{font-size:clamp(32px,4vw,55px);line-height:1.1;letter-spacing:-.035em;margin:15px 0}h2{font-size:23px;color:var(--purple);font-weight:500;margin:0 0 30px}p,td,summary{font-size:clamp(18px,1.7vw,23px);line-height:1.55}.lead{font-size:clamp(24px,2.6vw,34px);line-height:1.4}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}article{background:white;padding:22px;border:1px solid var(--line);border-top:4px solid var(--teal);border-radius:12px}article h3{color:var(--purple);font-size:23px;margin:0}article p{margin-bottom:0}details{background:white;border:1px solid var(--line);border-radius:9px;margin:12px 0}summary{padding:17px 20px;color:var(--purple);font-weight:600}.answer{border-top:1px solid var(--line);padding:18px 22px;font-size:21px;line-height:1.55}table{width:100%;border-collapse:collapse;background:white}td,th{text-align:left;padding:15px;border-bottom:1px solid var(--line)}th{background:var(--purple);color:white;font-size:17px}td{font-size:20px}.scroll{overflow-x:auto}.note{font-size:16px;color:#625b6c;border-left:3px solid var(--teal);padding:10px 16px;background:#eeebf4}footer{position:fixed;bottom:0;width:100%;background:#ffffffee;border-top:1px solid var(--line);padding:10px 4vw;display:flex;justify-content:space-between;align-items:center;gap:12px;backdrop-filter:blur(8px)}#counter{font-size:14px}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center}select{padding:12px;border:1px solid var(--line);border-radius:8px}textarea{display:block;width:100%;min-height:110px;padding:14px;margin-top:10px;border:1px solid var(--line);border-radius:8px}label{display:block;margin-top:15px;color:var(--purple)}#chart{width:100%;max-height:370px;background:white;border-radius:10px;margin-top:14px}#result{min-height:60px;color:var(--teal)}dialog{border:1px solid var(--line);border-radius:14px;max-width:800px;width:90%;max-height:85vh}dialog::backdrop{background:#271c3b99}.indexlist{display:grid;gap:8px}.indexlist button{text-align:left}.ref{font-size:14px;color:#6e6477;margin-top:25px}@media(max-width:650px){header{align-items:flex-start;flex-direction:column}main{padding:25px 20px 110px}.grid{grid-template-columns:1fr}td{font-size:17px;padding:10px}footer button{padding:10px}footer #counter{max-width:100px}h2{font-size:20px}}@media print{header,footer,.progress{display:none}main{padding:0}details{break-inside:avoid} }.stack{display:grid;gap:12px;margin:22px 0}.block{background:#fff;border:1px solid #e1d9ec;border-left:5px solid #0c929b;border-radius:12px;padding:17px 22px}.block b{font-size:22px;color:#604086}.block p{margin:6px 0 0}.highlight{background:#eee8f6;border-left:5px solid #7546a0;border-radius:12px;padding:18px 22px;margin:22px 0}.highlight strong{color:#653a8c;text-transform:uppercase;font-size:14px;letter-spacing:.08em}.highlight p{margin:8px 0 0}.question{margin:25px 0;padding:18px 22px;border-radius:12px;background:#eaf7f6;border:1px solid #c5e9e7}.question>b{color:#087f89}.question>p{margin:7px 0}main{max-width:1250px}h1{max-width:1050px}main>p{max-width:1100px}</style><header><div><b>ECONOMÍA / HIS-M26</b><small>Desarrollo y medioambiente · Dos sesiones de 80 minutos</small></div><nav aria-label="Sesiones"><button data-session="1">Sesión 1</button><button data-session="2">Sesión 2</button><button id="index">Índice</button><button id="full" aria-label="Alternar pantalla completa">Pantalla completa</button></nav></header><div class="progress"><div id="bar"></div></div><main></main><footer><button id="prev">← Anterior</button><span id="counter" aria-live="polite"></span><button id="next">Siguiente →</button></footer><dialog aria-label="Índice de sesiones"><button id="close">Cerrar índice</button><h2>Elegir un tema</h2><div id="list" class="indexlist"></div></dialog><script>const slides=[{"session": 1, "title": "Clase 1 · Modelos y desarrollo sostenible", "sub": "¿Puede crecer un país sin mejorar la vida de todas las personas?", "body": "<p class=\"lead\">Una economía puede producir más y, al mismo tiempo, enfrentar desigualdad o daño ambiental. Veamos cómo se relacionan estos procesos.</p><div class=\"highlight\"><strong>Pregunta guía</strong><p>¿Puede crecer un país sin mejorar la vida de todas las personas?</p></div>", "mins": 3, "ref": "pp. 3–9"}, {"session": 1, "title": "¿Qué aprenderemos hoy?", "sub": "Nuestro propósito", "body": "<div class=\"stack\"><div class=\"block\"><b>Objetivo</b><p>Explicar modelos y desarrollo sostenible a partir de situaciones cercanas y preguntas de la guía.</p></div><div class=\"block\"><b>Pregunta guía</b><p>¿Puede crecer un país sin mejorar la vida de todas las personas?</p></div><div class=\"block\"><b>Al finalizar</b><p>Resolveremos preguntas de la guía y revisaremos cómo elegir y justificar una respuesta.</p></div></div>", "mins": 3, "ref": "pp. 3–9"}, {"session": 1, "title": "Activemos ideas previas", "sub": "Pensemos en nuestro entorno", "body": "<div class=\"question\"><b>Para conversar</b><p>¿Qué necesita una comunidad para vivir bien?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Puede necesitar empleo e ingresos, pero también salud, agua, vivienda y un ambiente seguro.</div></details></div><div class=\"question\"><b>Para conversar</b><p>¿Crecer económicamente asegura por sí solo todas esas condiciones?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No necesariamente. Importa cómo se distribuyen los beneficios y qué pasa con el ambiente.</div></details></div>", "mins": 4, "ref": ""}, {"session": 1, "title": "¿Qué es un modelo de desarrollo?", "sub": "Es una orientación para organizar la economía", "body": "<p>Un <b>modelo de desarrollo</b> reúne decisiones sobre cómo un país busca producir, crecer y mejorar la vida de su población.</p><p>Esas decisiones influyen en el papel del Estado, las empresas, el comercio y el uso de los recursos naturales.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Un país puede impulsar la industria local o favorecer las exportaciones.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Qué se debe observar al comparar dos modelos?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Sus actividades principales y sus efectos económicos, sociales y ambientales.</div></details></div>", "mins": 5, "ref": "pp. 3–4"}, {"session": 1, "title": "¿Qué modelos ha seguido Chile?", "sub": "Las prioridades han cambiado en el tiempo", "body": "<p>El modelo exportador de materias primas dio gran importancia a la venta de recursos al exterior.</p><p>La industrialización por sustitución de importaciones buscó producir en el país bienes que antes se compraban afuera. Después se impulsó una mayor apertura económica.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Producir textiles en Chile en lugar de importarlos es un ejemplo de sustitución de importaciones.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Exportar materias primas y producir bienes industriales son lo mismo?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Son actividades distintas, aunque una economía puede combinar ambas.</div></details></div>", "mins": 5, "ref": "pp. 4–5"}, {"session": 1, "title": "¿Crecer es lo mismo que desarrollarse?", "sub": "Producir más es solo una parte de la historia", "body": "<p>El crecimiento económico se refiere al aumento de la producción de bienes y servicios.</p><p>El desarrollo considera también las condiciones de vida: acceso a oportunidades, bienestar y otros aspectos que importan a la sociedad.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>El PIB de un país sube, pero muchas familias aún no tienen agua potable.</p></div><div class=\"question\"><b>Para conversar</b><p>¿El crecimiento por sí solo demuestra que mejoró la vida de todos?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Se necesitan otros datos, como acceso a servicios, distribución de ingresos y situación ambiental.</div></details></div>", "mins": 5, "ref": "pp. 3–6"}, {"session": 1, "title": "¿Qué es el desarrollo sostenible?", "sub": "Equilibra economía, sociedad y medioambiente", "body": "<p>El desarrollo sostenible busca responder a las necesidades del presente sin comprometer las posibilidades de las futuras generaciones.</p><p>Para evaluarlo se consideran tres dimensiones relacionadas: económica, social y ambiental.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una empresa crea empleos, pero agota el agua de una comunidad.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Basta con contar los empleos para evaluar el proyecto?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. También hay que considerar el acceso al agua, los impactos ambientales y cómo se distribuyen los beneficios.</div></details></div>", "mins": 5, "ref": "pp. 6–7"}, {"session": 1, "title": "¿Qué propone la Agenda 2030?", "sub": "Metas comunes para distintos desafíos", "body": "<p>La Agenda 2030 de Naciones Unidas reúne Objetivos de Desarrollo Sostenible, como reducir la pobreza y proteger el ambiente.</p><p>Sus metas están relacionadas: por ejemplo, el acceso al agua influye en salud, educación y actividades productivas.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una comunidad mejora el acceso al agua y disminuye enfermedades asociadas a su falta.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Por qué conviene trabajar las metas en conjunto?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Porque un mismo problema puede afectar simultáneamente a la economía, las personas y los ecosistemas.</div></details></div>", "mins": 5, "ref": "p. 7"}, {"session": 1, "title": "¿Qué es la economía circular?", "sub": "Mantener productos y materiales en uso", "body": "<p>En una economía lineal solemos extraer, fabricar, usar y desechar.</p><p>La economía circular busca reducir residuos desde el diseño y mantener productos y materiales en uso por más tiempo.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una fábrica recibe muebles usados, los repara y vuelve a venderlos.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Qué cambia al reparar el mueble?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Se prolonga su vida útil y se posterga que se convierta en residuo.</div></details></div>", "mins": 5, "ref": "pp. 7–8"}, {"session": 1, "title": "¿Qué es la bioeconomía?", "sub": "Usar recursos biológicos con una mirada sostenible", "body": "<p>La bioeconomía aprovecha recursos biológicos, conocimientos y tecnologías para producir bienes y servicios.</p><p>Su aporte al desarrollo sostenible depende de cómo se usen, conserven y regeneren esos recursos.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Los cultivos, bosques y recursos marinos pueden dar origen a nuevos productos.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Todo uso de recursos biológicos es automáticamente sostenible?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Es necesario considerar sus efectos y cómo se conservan o regeneran los recursos.</div></details></div>", "mins": 5, "ref": "pp. 7–8"}, {"session": 1, "title": "¿Qué es la justicia ambiental?", "sub": "Los costos y beneficios no siempre se reparten igual", "body": "<p>Algunas comunidades concentran industrias y soportan una mayor parte de la contaminación.</p><p>La justicia ambiental pregunta quién recibe los beneficios, quién asume los daños y quién participa en las decisiones.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una zona genera energía para muchas ciudades, pero sus vecinos respiran aire contaminado.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Qué desigualdad muestra el ejemplo?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Los beneficios se distribuyen ampliamente mientras los costos ambientales recaen en una comunidad específica.</div></details></div>", "mins": 5, "ref": "pp. 8–9"}, {"session": 1, "title": "Practiquemos con la guía", "sub": "Preguntas 1, 3, 4, 5, 10", "body": "<p>Resuelve las preguntas en tu guía. Luego explica tu elección y revisa las respuestas cuando corresponda.</p><details><summary>Pregunta 1 · Crecimiento y sostenibilidad</summary><div class=\"answer\"><b>Respuesta: D.</b> El PIB crece, pero el problema del agua muestra que el crecimiento no basta para afirmar que el desarrollo sea sostenible.<p><b>Para descartar:</b> La pregunta no permite concluir que deba detenerse todo crecimiento.</p></div></details><details><summary>Pregunta 3 · Reparación de muebles</summary><div class=\"answer\"><b>Respuesta: C.</b> Reparar y revender mantiene los productos en uso por más tiempo.<p><b>Para descartar:</b> El caso no describe generación de energía ni cambios en el diseño original.</p></div></details><details><summary>Pregunta 4 · Conservación marina</summary><div class=\"answer\"><b>Respuesta: B.</b> El texto destaca la coordinación entre el Estado y distintos actores sociales.<p><b>Para descartar:</b> No afirma que la conservación dependa necesariamente de fondos externos.</p></div></details><details><summary>Pregunta 5 · Comunidades y contaminación</summary><div class=\"answer\"><b>Respuesta: D.</b> El problema es que pocas comunidades concentran costos que benefician a territorios más amplios.<p><b>Para descartar:</b> Las demás opciones no expresan directamente la distribución desigual del daño.</p></div></details><details><summary>Pregunta 10 · Desafíos del desarrollo</summary><div class=\"answer\"><b>Respuesta: C.</b> Capacitar a trabajadores se relaciona con desarrollar competencias, como propone la fuente.<p><b>Para descartar:</b> El texto no plantea elevar aranceles ni subsidiar combustibles.</p></div></details><label>Mis apuntes<textarea data-note=\"s1\" placeholder=\"¿Qué entendí? ¿Qué necesito repasar?\"></textarea></label>", "mins": 25, "ref": "pp. 19–20 y 22"}, {"session": 1, "title": "Cerremos la clase", "sub": "Volvamos a la pregunta guía", "body": "<div class=\"question\"><b>Para conversar</b><p>¿Puede crecer un país sin mejorar la vida de todas las personas?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Sí. El crecimiento puede coexistir con desigualdad o daño ambiental. Para hablar de desarrollo sostenible hay que considerar las tres dimensiones.</div></details></div><div class=\"question\"><b>Para conversar</b><p>¿Cómo enfrento una pregunta PAES?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Identifico qué pregunta la consigna, busco los datos clave y comparo las alternativas con la información disponible.</div></details></div>", "mins": 5, "ref": ""}, {"session": 2, "title": "Clase 2 · Cambio climático y políticas ambientales", "sub": "¿Cómo enfrentamos los problemas ambientales de forma justa?", "body": "<p class=\"lead\">Sequías, cambios en las temperaturas y contaminación afectan a las personas de maneras diferentes.</p><div class=\"highlight\"><strong>Pregunta guía</strong><p>¿Cómo enfrentamos los problemas ambientales de forma justa?</p></div>", "mins": 3, "ref": "pp. 9–15"}, {"session": 2, "title": "¿Qué aprenderemos hoy?", "sub": "Nuestro propósito", "body": "<div class=\"stack\"><div class=\"block\"><b>Objetivo</b><p>Explicar cambio climático y políticas ambientales a partir de situaciones cercanas y preguntas de la guía.</p></div><div class=\"block\"><b>Pregunta guía</b><p>¿Cómo enfrentamos los problemas ambientales de forma justa?</p></div><div class=\"block\"><b>Al finalizar</b><p>Resolveremos preguntas de la guía y revisaremos cómo elegir y justificar una respuesta.</p></div></div>", "mins": 3, "ref": "pp. 9–15"}, {"session": 2, "title": "Recordemos lo anterior", "sub": "Las tres dimensiones del desarrollo", "body": "<div class=\"question\"><b>Para conversar</b><p>¿Qué dimensiones considera el desarrollo sostenible?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">La económica, la social y la ambiental.</div></details></div><div class=\"question\"><b>Para conversar</b><p>¿Por qué reparar muebles se relaciona con la economía circular?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Porque permite mantener un producto en uso durante más tiempo.</div></details></div>", "mins": 4, "ref": ""}, {"session": 2, "title": "¿Qué es el cambio climático?", "sub": "Son cambios duraderos en el clima", "body": "<p>El cambio climático se refiere a cambios de largo plazo en temperaturas y otros patrones del clima.</p><p>La actividad humana, especialmente el uso de combustibles fósiles, ha aumentado los gases de efecto invernadero y es la causa principal del calentamiento reciente.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>La quema de carbón, petróleo y gas libera gases que retienen calor en la atmósfera.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Una tarde fría demuestra que no existe calentamiento global?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Un día corresponde al tiempo atmosférico; el clima se observa en períodos largos y en áreas más amplias.</div></details></div>", "mins": 5, "ref": "pp. 9–10"}, {"session": 2, "title": "¿Cómo afecta a Chile?", "sub": "Los efectos cambian según el territorio", "body": "<p>El cambio climático puede intensificar problemas como sequías, escasez de agua y eventos extremos.</p><p>Sus consecuencias dependen también de la ubicación, los recursos disponibles y la capacidad de preparación de cada comunidad.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una sequía afecta el acceso al agua y dificulta la agricultura en una comuna.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Una sequía afecta igual a todos los hogares?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No necesariamente. Depende del acceso al agua, los ingresos y las medidas de apoyo disponibles.</div></details></div>", "mins": 5, "ref": "pp. 10–12"}, {"session": 2, "title": "¿Qué es mitigar?", "sub": "Actuar sobre las causas del cambio climático", "body": "<p>La <b>mitigación</b> busca reducir emisiones de gases de efecto invernadero o aumentar su captura.</p><p>Puede incluir cambios en la energía, el transporte o el uso de los bosques.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Reemplazar parte de la generación a carbón por fuentes bajas en emisiones puede reducir emisiones.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Mitigar significa únicamente prepararse para una sequía?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Prepararse para sus efectos es adaptación; reducir emisiones es mitigación.</div></details></div>", "mins": 5, "ref": "pp. 11 y 15"}, {"session": 2, "title": "¿Qué es adaptarse?", "sub": "Prepararse para los efectos", "body": "<p>La <b>adaptación</b> busca disminuir los daños que los cambios del clima pueden producir.</p><p>Puede incluir planificación del agua, prevención de riesgos y protección de comunidades vulnerables.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una comuna mejora sus sistemas de distribución y ahorro de agua para enfrentar sequías.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Adaptación y mitigación pueden realizarse juntas?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Sí. Se puede reducir emisiones y, al mismo tiempo, prepararse para impactos que ya ocurren o se esperan.</div></details></div>", "mins": 5, "ref": "pp. 11–12 y 15"}, {"session": 2, "title": "¿Por qué hablamos de transición justa?", "sub": "Cambiar la energía también afecta a las personas", "body": "<p>Retirar centrales a carbón puede ayudar a reducir emisiones y contaminación.</p><p>Pero esos cambios también pueden afectar empleos y economías locales; una transición justa busca considerar a las personas y comunidades involucradas.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>El cierre de una central cambia el trabajo y los ingresos de familias de la zona.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Por qué una política ambiental debe considerar el empleo?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Porque sus beneficios y costos afectan a personas concretas; el apoyo y la participación ayudan a enfrentar esos cambios.</div></details></div>", "mins": 5, "ref": "pp. 11–12"}, {"session": 2, "title": "¿Quién cuida el medioambiente?", "sub": "Distintas instituciones tienen tareas diferentes", "body": "<p>El Ministerio del Medio Ambiente diseña políticas y normas; el Servicio de Evaluación Ambiental administra la evaluación de proyectos.</p><p>La Superintendencia del Medio Ambiente fiscaliza el cumplimiento de las normas y condiciones ambientales.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una empresa presenta un proyecto que podría afectar a una comunidad.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Evaluar un proyecto es lo mismo que fiscalizar su cumplimiento después?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Son funciones relacionadas, pero distintas.</div></details></div>", "mins": 5, "ref": "pp. 13–14"}, {"session": 2, "title": "¿Para qué se evalúa un proyecto?", "sub": "Identificar impactos antes de ejecutarlo", "body": "<p>El Sistema de Evaluación de Impacto Ambiental revisa proyectos que deben ingresar según la ley.</p><p>Según sus características e impactos, el titular presenta una declaración o, cuando corresponde, un estudio de impacto ambiental.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Un proyecto obliga a trasladar una comunidad que vive en el lugar.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Qué tipo de documento corresponde al caso de la guía?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Un Estudio de Impacto Ambiental, por el efecto significativo descrito en el ejercicio.</div></details></div>", "mins": 5, "ref": "pp. 14–15"}, {"session": 2, "title": "¿Qué ocurre con los productos usados?", "sub": "La responsabilidad puede continuar después de la venta", "body": "<p>La responsabilidad extendida del productor busca que quienes introducen ciertos productos se hagan cargo de metas y costos de su gestión como residuos.</p><p>El objetivo es mejorar la recolección y valorización de productos prioritarios, según las reglas aplicables.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una empresa importa neumáticos y debe cumplir obligaciones para gestionar neumáticos usados.</p></div><div class=\"question\"><b>Para conversar</b><p>¿La obligación se reduce a vender un producto nuevo?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Según la guía, también debe financiar y organizar su gestión posterior conforme a la normativa.</div></details></div>", "mins": 5, "ref": "pp. 8 y 12"}, {"session": 2, "title": "Practiquemos con la guía", "sub": "Preguntas 2, 6, 7, 8, 9", "body": "<p>Resuelve las preguntas en tu guía. Luego explica tu elección y revisa las respuestas cuando corresponda.</p><details><summary>Pregunta 2 · Sequía y uso del agua</summary><div class=\"answer\"><b>Respuesta: A.</b> La guía indica que se prioriza el consumo humano frente a otros usos.<p><b>Para descartar:</b> La pregunta no propone priorizar las exportaciones ni repartir solo según derechos productivos.</p></div></details><details><summary>Pregunta 6 · Neumáticos usados</summary><div class=\"answer\"><b>Respuesta: B.</b> El productor asume obligaciones de financiar la gestión de los productos usados, según la Ley REP.<p><b>Para descartar:</b> El caso no establece una obligación de comprar cada neumático al cliente.</p></div></details><details><summary>Pregunta 7 · Proyecto y traslado de comunidad</summary><div class=\"answer\"><b>Respuesta: A.</b> El traslado descrito es un impacto que exige presentar un Estudio de Impacto Ambiental.<p><b>Para descartar:</b> Una declaración no corresponde al impacto significativo indicado en el caso.</p></div></details><details><summary>Pregunta 8 · Bioeconomía</summary><div class=\"answer\"><b>Respuesta: D.</b> El texto plantea un potencial productivo basado en recursos biológicos que todavía puede desarrollarse.<p><b>Para descartar:</b> No dice que la bioeconomía reemplace necesariamente la minería.</p></div></details><details><summary>Pregunta 9 · Transición energética justa</summary><div class=\"answer\"><b>Respuesta: A.</b> El cambio puede afectar el empleo y la vida de comunidades que dependen de esas actividades.<p><b>Para descartar:</b> La expresión «justa» se relaciona con las personas afectadas, no solo con la existencia de emisiones.</p></div></details><label>Mis apuntes<textarea data-note=\"s2\" placeholder=\"¿Qué entendí? ¿Qué necesito repasar?\"></textarea></label>", "mins": 25, "ref": "pp. 19–21"}, {"session": 2, "title": "Cerremos la clase", "sub": "Volvamos a la pregunta guía", "body": "<div class=\"question\"><b>Para conversar</b><p>¿Cómo enfrentamos los problemas ambientales de forma justa?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Reduciendo las causas y preparándonos para sus efectos, considerando a las comunidades y distribuyendo de manera más justa los costos y beneficios.</div></details></div><div class=\"question\"><b>Para conversar</b><p>¿Cómo enfrento una pregunta PAES?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Identifico qué pregunta la consigna, busco los datos clave y comparo las alternativas con la información disponible.</div></details></div>", "mins": 5, "ref": ""}];let pos=0;const main=document.querySelector('main');function show(i){pos=Math.max(0,Math.min(slides.length-1,i));const s=slides[pos];main.innerHTML=`<div class="eyebrow">HIS-M26 / Sesión ${s.session} / ${s.mins} min orientativos</div><h1>${s.title}</h1><h2>${s.sub}</h2>${s.body}<p class="ref">Base: guía HIS-M26, Impactos sociales y medioambientales de diversos modelos de desarrollo. ${s.ref}</p>`;document.querySelector('#counter').textContent=`${pos+1} / ${slides.length} · Sesión ${s.session}`;document.querySelector('#bar').style.width=((pos+1)/slides.length*100)+'%';document.querySelector('#prev').disabled=pos===0;document.querySelector('#next').disabled=pos===slides.length-1;document.querySelectorAll('[data-session]').forEach(b=>b.setAttribute('aria-current',Number(b.dataset.session)===s.session));document.querySelectorAll('textarea').forEach(t=>{try{t.value=localStorage.getItem('m26-'+t.dataset.note)||''}catch{}t.oninput=()=>{try{localStorage.setItem('m26-'+t.dataset.note,t.value)}catch{}}});if(document.querySelector('#chart')){draw(false);document.querySelector('#scenario').onchange=()=>draw(false);document.querySelector('#predict').onclick=()=>draw(true)}window.scrollTo(0,0)}function draw(reveal){const v=document.querySelector('#scenario').value;let d=100,o=20;if(v==='dplus')d=124;if(v==='dminus')d=76;if(v==='splus')o=-4;if(v==='sminus')o=44;const p=(d+o)/2,q=(d-o)/2;let x=q=>70+q*4.4,y=p=>315-p*2.1;const line=(q1,p1,q2,p2,color,dash='')=>`<line x1="${x(q1)}" y1="${y(p1)}" x2="${x(q2)}" y2="${y(p2)}" stroke="${color}" stroke-width="3" stroke-dasharray="${dash}"/>`;let out=`<path d="M70 20V315H640" stroke="#675c75" fill="none"/><text x="22" y="24">P</text><text x="640" y="342">Q</text>`;out+=line(0,100,95,5,'#c9bbd8','6 5')+line(0,20,95,115,'#a9d7d9','6 5');out+=line(Math.max(0,d-135),Math.min(d,135),Math.min(d,100),Math.max(0,d-100),'#643a91')+line(Math.max(0,-o),Math.max(0,o),Math.min(100,135-o),Math.min(135,o+100),'#087f89');out+='<text x="525" y="295" fill="#643a91">D</text><text x="505" y="35" fill="#087f89">O</text>';if(reveal){out+=`<circle cx="${x(q)}" cy="${y(p)}" r="7" fill="#271c3b"/><path d="M70 ${y(p)}H${x(q)}V315" stroke="#665878" stroke-dasharray="4 4" fill="none"/><text x="10" y="${y(p)+6}">${p}</text><text x="${x(q)-8}" y="342">${q}</text>`}document.querySelector('#chart').innerHTML=out;document.querySelector('#result').textContent=reveal?`Equilibrio: P = ${p}; Q = ${q}. ${({base:'Inicial: P = 60; Q = 40.',dplus:'Mayor demanda: suben precio y cantidad.',dminus:'Menor demanda: bajan precio y cantidad.',splus:'Mayor oferta: baja precio y sube cantidad.',sminus:'Menor oferta: sube precio y baja cantidad.'})[v]} Líneas discontinuas: curvas iniciales.`:'Antes de mostrar el resultado, piensa qué pasa con el precio y la cantidad. Las líneas punteadas muestran la situación inicial.'}document.querySelector('#prev').onclick=()=>show(pos-1);document.querySelector('#next').onclick=()=>show(pos+1);document.querySelectorAll('[data-session]').forEach(b=>b.onclick=()=>show(slides.findIndex(s=>s.session==b.dataset.session)));const dlg=document.querySelector('dialog');document.querySelector('#index').onclick=()=>dlg.showModal();document.querySelector('#close').onclick=()=>dlg.close();document.querySelector('#list').innerHTML=slides.map((s,i)=>`<button data-i="${i}">S${s.session} · ${s.title} <small>(${s.mins} min)</small></button>`).join('');document.querySelector('#list').onclick=e=>{const b=e.target.closest('[data-i]');if(b){show(+b.dataset.i);dlg.close()}};document.querySelector('#full').onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>{})}else document.exitFullscreen?.()};document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT','SUMMARY','BUTTON'].includes(e.target.tagName)||dlg.open)return;if(e.key==='ArrowRight'){e.preventDefault();show(pos+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(pos-1)}});show(0);</script></html>
