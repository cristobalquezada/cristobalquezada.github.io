<script>const D={"file": "CIERRE-02-1M-HIS.html", "code": "C2-1M-HIS", "course": "1° Medio", "number": "2", "title": "Progreso y desigualdad", "subtitle": "Industrialización, imperialismo y cuestión social", "units": "Unidad 2", "lead": "Leeremos procesos conectados para distinguir causas, cambios, consecuencias y respuestas sociales.", "objective": "Relacionar la industrialización y la expansión imperialista con cambios económicos, sociales y políticos en Europa y Chile.", "guide": "¿Por qué un mismo proceso puede producir avances para algunos y problemas para otros?", "foundation": {"name": "causa y consecuencia", "definition": "causa = hecho que origina o favorece un cambio; consecuencia = resultado producido por ese cambio.", "question": "¿Qué ocurrió primero y qué cambió después?", "example": "La industrialización aumentó la producción; como consecuencia, crecieron las ciudades."}, "topics": [{"eye": "Unidad 2 · Industrialización", "title": "¿Por qué cambió la forma de producir?", "subtitle": "Las máquinas y nuevas fuentes de energía permitieron producir más.", "paragraphs": [{"role": "main", "text": "La <span class='anchor'>Revolución Industrial</span> reemplazó parte del trabajo artesanal por producción mecanizada en fábricas. El carbón y la máquina de vapor permitieron fabricar y transportar productos a mayor velocidad."}, {"role": "secondary", "text": "La producción aumentó y muchos bienes se hicieron más accesibles. También crecieron el comercio, los ferrocarriles y las ciudades."}, {"role": "secondary", "text": "Sin embargo, los beneficios se distribuyeron de manera desigual. Muchos trabajadores enfrentaron jornadas extensas, bajos salarios y viviendas precarias."}], "mainWhy": "Presenta el cambio que explica todo el texto.", "secondaryWhy": "Describen beneficios y problemas producidos por ese cambio.", "note": "industrialización = uso creciente de máquinas y fábricas; proletariado = trabajadores que viven de un salario.", "micro": {"q": "¿Qué cambió directamente la producción?", "options": ["El uso de máquinas y fábricas", "El regreso al trabajo feudal", "La eliminación del comercio"], "answer": 0, "why": "Las máquinas permitieron producir más y con mayor rapidez.", "hint": "Vuelve al texto y busca la relación más importante."}}, {"eye": "Unidad 2 · Sociedad industrial", "title": "¿Por qué crecieron las ciudades?", "subtitle": "Las fábricas atrajeron población y transformaron la vida urbana.", "paragraphs": [{"role": "main", "text": "La búsqueda de empleo impulsó la <span class='anchor'>migración campo-ciudad</span>. Las ciudades industriales crecieron con rapidez y concentraron fábricas, trabajadores y nuevos servicios."}, {"role": "secondary", "text": "El crecimiento sin planificación produjo hacinamiento, contaminación y enfermedades en barrios obreros."}, {"role": "secondary", "text": "Frente a estas condiciones, trabajadores formaron sindicatos y movimientos que exigieron mejores salarios, menos horas de trabajo y protección social."}], "mainWhy": "Explica la relación entre empleo industrial y urbanización.", "secondaryWhy": "Muestran problemas urbanos y una respuesta colectiva.", "note": "urbanización = crecimiento de la población que vive en ciudades; sindicato = organización de trabajadores que defiende intereses comunes.", "micro": {"q": "¿Qué fue una respuesta de los trabajadores?", "options": ["Eliminar las fábricas", "Formar sindicatos", "Cerrar todas las ciudades"], "answer": 1, "why": "Los sindicatos organizaron demandas laborales.", "hint": "Vuelve al texto y busca la relación más importante."}}, {"eye": "Unidad 2 · Imperialismo", "title": "¿Por qué las potencias ocuparon otros territorios?", "subtitle": "Buscaron materias primas, mercados y poder internacional.", "paragraphs": [{"role": "main", "text": "A fines del siglo XIX, varias potencias europeas extendieron su dominio sobre territorios de África y Asia. Este proceso se conoce como <span class='anchor'>imperialismo</span>."}, {"role": "secondary", "text": "La industria necesitaba materias primas y nuevos mercados. Además, los Estados competían por prestigio, rutas estratégicas y poder."}, {"role": "secondary", "text": "La ocupación fue justificada mediante ideas racistas que presentaban a los pueblos colonizados como inferiores. En la práctica, produjo explotación y pérdida de autonomía."}], "mainWhy": "Define el proceso histórico central.", "secondaryWhy": "Explican sus causas y consecuencias sobre los pueblos ocupados.", "note": "imperialismo = dominio político, económico o militar de un Estado sobre otros territorios; colonia = territorio controlado por una potencia externa.", "micro": {"q": "¿Qué fue una causa económica del imperialismo?", "options": ["Proteger la autonomía colonial", "Reducir la competencia entre potencias", "Buscar materias primas y mercados"], "answer": 2, "why": "La producción industrial necesitaba recursos y compradores.", "hint": "Vuelve al texto y busca la relación más importante."}}, {"eye": "Unidad 2 · Primera Guerra Mundial", "title": "¿Cómo una competencia terminó en una guerra mundial?", "subtitle": "Las rivalidades, alianzas y el nacionalismo ampliaron el conflicto.", "paragraphs": [{"role": "secondary", "text": "Antes de 1914, las potencias competían por territorios, armamento e influencia. Al mismo tiempo, formaron alianzas militares."}, {"role": "main", "text": "El asesinato del archiduque Francisco Fernando fue el <span class='anchor'>detonante</span>, pero la guerra se extendió por tensiones acumuladas y por el sistema de alianzas."}, {"role": "secondary", "text": "La guerra movilizó ejércitos y economías completas. Sus consecuencias incluyeron millones de muertes, destrucción y cambios territoriales."}], "mainWhy": "Distingue el detonante de las causas profundas.", "secondaryWhy": "Presentan las tensiones previas y las consecuencias.", "note": "causa profunda = condición que prepara un proceso; detonante = hecho que inicia directamente un acontecimiento.", "micro": ismo, prepararon la Primera Guerra Mundial.", "blue": [{"q": "¿Qué relación une industria e imperialismo?", "options": ["Igualdad política y cooperación", "Necesidad de recursos y ocupación", "Protección colonial y autonomía", "Menor producción y descolonización"], "answer": 1, "why": "La industria buscó recursos y mercados externos.", "hint": "Vuelve al texto y busca la relación más importante."}, {"q": "¿Qué función cumple “Por eso”?", "options": ["Agrega una definición", "Señala una duda", "Introduce una consecuencia", "Presenta una comparación"], "answer": 2, "why": "Conecta una causa con su resultado.", "hint": "Vuelve al texto y busca la relación más importante."}, {"q": "¿Qué fue una causa profunda de la guerra?", "options": ["La firma de la paz", "La creación de sindicatos", "El cierre de fábricas", "La competencia imperialista"], "answer": 3, "why": "La rivalidad entre potencias acumuló tensiones.", "hint": "Vuelve al texto y busca la relación más importante."}, {"q": "¿Qué afirmación resume mejor?", "options": ["Procesos económicos y políticos se relacionaron", "La guerra tuvo una sola causa inmediata", "El imperialismo redujo las rivalidades", "La industria no cambió la política"], "answer": 0, "why": "El texto conecta industria, expansión y guerra.", "hint": "Vuelve al texto y busca la relación más importante."}], "sequence": ["Industrialización europea", "Búsqueda de materias primas", "Expansión imperialista", "Aumento de rivalidades"], "classifyTitle": "Clasifica cada elemento", "classifyOptions": ["Causa", "Consecuencia", "Problema", "Respuesta"], "classify": [["Uso de máquinas y fábricas.", "Causa"], ["Crecimiento de las ciudades.", "Consecuencia"], ["Jornadas extensas y bajos salarios.", "Problema"], ["Organización de sindicatos.", "Respuesta"]], "writing": "Explica una relación entre industrialización, desigualdad y organización de los trabajadores. Usa una causa, una consecuencia y un ejemplo.", "supportQuestions": ["¿Qué cambió en la producción?" function popup(title,body){modalTitle.textContent=title;modalBody.innerHTML=body;modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}function readMode(id,mode){const x=document.getElementById(id);x.classList.remove('show-ideas','show-anchors');if(mode==='ideas'){x.classList.add('show-ideas');addSupport('Código de ideas: '+id)}if(mode==='anchors'){x.classList.add('show-anchors');addSupport('Palabras ancla: '+id)}const p=x.querySelector('.read-panel');p.classList.add('show');p.innerHTML=mode==='clean'?'Texto limpio: se quitaron todos los destacados.':mode==='ideas'?'<b>Amarillo:</b> idea principal, porque organiza el sentido. <b>Rosado:</b> ideas secundarias, porque explican, ejemplifican o entregan evidencia.':'<b>Morado:</b> palabras ancla. Si lees solo esos conceptos, puedes reconstruir el sentido general.'}
function micro(el,a,why){const opts=[...el.querySelectorAll('.opt')],fb=el.querySelector('.feedback');let selected=+el.dataset.selected;if(Number.isNaN(selected)){fb.textContent='Selecciona una alternativa.';fb.className='feedback show bad';return}if(selected===a){opts[a].classList.add('good');fb.textContent='Correcto. '+why;fb.className='feedback show'}else{fb.textContent='Revisa la idea principal y vuelve a intentar.';fb.className='feedback show bad'}}function selectOpt(btn){const wrap=btn.closest('.micro,.task,.closure-options');wrap.querySelectorAll('.opt,.closure-options button').forEach(x=>x.classList.remove('sel'));btn.classList.add('sel');wrap.dataset.selected=btn.dataset.i}
function topicHTML(t,i){return `<article class="slide"><div class="in"><div class="eye">${t.eye}</div><h2>${t.title}</h2><div class="sub">${t.subtitle}</div><div class="text-card explain-text" id="read${i}">${t.paragraphs.map(p=>`<p class="big idea-${p.role}">${p.text}</p>`).join('')}<div class="read-tools"><button class="read-btn" onclick="readMode('read${i}','clean')">Texto limpio</button><button class="read-btn" onclick="readMode('read${i}','ideas')">Ver las ideas</button><button class="read-btn" onclick="readMode('read${i}','anchors')">Ver palabras ancla</button></div><div class="read-panel"></div></div><div class="grid2" style="margin-top:17px"><div class="card blue"><h3>¿Por qué es principal?</h3><p class="compact">${t.mainWhy}</p></div><div class="card pink"><h3>¿Qué hacen las secundarias?</h3><p class="compact">${t.secondaryWhy}</p></div></div><div class="foundation-row"><button class="pop-btn notes" onclick='popup("Referencias para apuntes",${JSON.stringify(`<p>${t.note}</p>`)})'>Abrir referencias para apuntes</button></div>${microHTML(t.micro)}</div></article>`}
function microHTML(q){return `<div class="micro"><div class="micro-q">${q.q}</div><div class="options">${q.options.map((o,i)=>`<button class="opt" data-i="${i}" onclick="selectOpt(this)">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div><button class="check" onclick='micro(this.parentElement,${q.answer},${JSON.stringify(q.why)})'>Chequear</button><div class="feedback"></div></div>`}
function buildDeck(){const f=D.foundation;let html=`<article class="slide on"><div class="in cover"><div><div class="eye">Cierre anual · Clase ${D.number}</div><h1>${D.title}</h1><div class="sub">${D.subtitle}</div><p class="lead">${D.lead}</p><div class="meta"><span class="pill">${D.course}</span><span class="pill">Historia</span><span class="pill">${D.units}</span></div><div class="actions"><button class="primary" onclick="show(1)">Comenzar la clase</button><button class="direct" onclick="openRoute()">Ir directo a la actividad</button></div></div><div class="art"><h3>Ruta común</h3><div class="route-preview"><div>Leer y reconocer</div><div>Relacionar y organizar</div><div>Explicar con apoyo</div></div></div></div></article>`;
html+=`<article class="slide"><div class="in"><div class="eye">Propósito</div><h2>Comprender para explicar</h2><div class="card"><h3>Hoy vamos a…</h3><p class="big">${D.objective}</p></div><div class="guide"><b>Pregunta para trabajar</b><p class="big">${D.guide}</p></div></div></article>`;
html+=`<article class="slide"><div class="in"><div class="eye">Cimiento de comprensión</div><h2>${f.name}</h2><div class="grid2"><div class="card blue"><h3>Definición simple</h3><p class="big">${f.definition}</p></div><div class="card green"><h3>Pregunta de apoyo</h3><p class="big">${f.question}</p></div></div><div class="guide"><b>Ejemplo:</b> ${f.example}</div><div class="foundation-row"><button class="pop-btn" onclick='popup("Tema", "<p>tema = asunto general del texto.</p>")'>Tema</button><button class="pop-btn" onclick='popup("Idea principal", "<p>idea principal = información que organiza el sentido completo.</p>")'>Idea principal</button><button class="pop-btn" onclick='popup("Evidencia", "<p>evidencia = información que permite demostrar una respuesta.</p>")'>Evidencia</button></div></div></article>`;
D.topics.forEach((t,i)=>html+=topicHTML(t,i));const s=D.strategy;html+=`<article class="slide"><div class="in"><div class="eye">Estrategia de comprensión</div><h2>${s.title}</h2><div class="grid3">${s.steps.map((x,i)=>`<div class="card ${['blue','pink','green'][i]}"><h3>${i+1}</h3><p class="big">${x}</p></div>`).join('')}</div><div class="guide"><b>Ejemplo:</b> ${s.example}</div></div></article>`;
html+=`<article class="slide"><div class="in"><div class="eye">Glosario esencial</div><h2>Conceptos para volver a consultar</h2><p class="lead">Intenta explicar cada concepto antes de abrirlo.</p><div class="gloss">${D.glossary.map(g=>`<button onclick="this.classList.toggle('open')">${g[0]}<span>${g[0]} = ${g[1]}.</span></button>`).join('')}</div></div></article>`;
html+=`<article class="slide"><div class="in"><div class="eye">Actividad interactiva</div><h2>Laboratorio de comprensión histórica</h2><div class="routebox grid2"><div><p class="big">Todos realizan la misma ruta: reconocer, relacionar, organizar, clasificar y escribir.</p><p class="compact">Los apoyos son opcionales, pueden cerrarse y su uso queda registrado.</p></div><div class="actions"><button class="direct" onclick="openRoute()">Comenzar actividad</button><button class="ghost" onclick="show(${3+D.topics.length+3})">Omitir y pasar al cierre</button></div></div></div></article>`;
html+=whiteClosure();D.closureBlue.forEach((q,i)=>html+=blueClosure(q,i));deck.innerHTML=html;slides=[...document.querySelectorAll('.slide')];show(0)}
function whiteClosure(){return `<article class="slide"><div class="in"><div class="eye">Cierre · Blanco</div><h2>Completa mentalmente y chequea</h2><p class="lead">No necesitas escribir. Piensa la palabra y luego revisa.</p>${D.closureWhite.map((x,i)=>`<div class="blank-item">${i+1}. ${x[0]}<div>________________________________</div><button class="check" onclick="this.nextElementSibling.classList.add('show')">Chequear</button><div class="answer">Respuesta: ${x[1]}.</div></div>`).join('')}</div></article>`}
function blueClosure(q,i){return `<article class="slide"><div class="in"><div class="eye">Cierre · Azul ${i+1} de 3</div><h2>${q.q}</h2><div class="closure-options" data-answer="${q.answer}">${q.options.map((o,j)=>`<button data-i="${j}" onclick="selectOpt(this)">${String.fromCharCode(65+j)}. ${o}</button>`).join('')}<button class="check" onclick="checkClosure(this.parentElement,${q.answer},${JSON.stringify(q.why)})">Chequear</button><div class="feedback"></div></div></div></article>`}
function checkClosure(w,a,why){const i=+w.dataset.selected,fb=w.querySelector('.feedback');if(Number.isNaN(i)){fb.textContent='Selecciona una alternativa.';fb.className='feedback show bad';return}if(i!==a){fb.textContent='Revisa tu elección y vuelve a intentarlo.';fb.className='feedback show bad';return}w.querySelectorAll('button[data-i]')[a].classList.add('good');fb.textContent='Correcto. '+why;fb.className='feedback show'}
let slides=[];function show(i){current=Math.max(0,Math.min(i,slides.length-1));slides.forEach((s,j)=>s.classList.toggle('on',j===current));counter.textContent=(current+1)+' / '+slides.length;progress.style.width=((current+1)/slides.length*100)+'%';scrollTo(0,0)}function move(n){show(current+n)}
function openRoute(){route.classList.add('open');renderRoute(0)}function closeRoute(){route.classList.remove('open')}function renderRoute(step){routeStep=step;routeTitle.textContent=D.title;routeProgress.textContent=(step+1)+' / 7';const a=D.activity;if(step===0)routeMain.innerHTML=startStage();if(step===1)routeMain.innerHTML=questionStage('Blanco · Reconocer',a.text1,a.white,'w');if(step===2)routeMain.innerHTML=questionStage('Azul · Relacionar',a.text2,a.blue,'b');if(step===3)routeMain.innerHTML=sequenceStage();if(step===4)routeMain.innerHTML=classifyStage();if(step===5)routeMain.innerHTML=writingStage();if(step===6)routeMain.innerHTML=evidenceStage();bindRoute()}
function nextRoute(){renderRoute(Math.min(6,routeStep+1))}function prevRoute(){renderRoute(Math.max(0,routeStep-1))}function startStage(){return `<div class="stage on"><h2>Antes de comenzar</h2><p class="lead">Todos realizan la misma ruta. Puedes trabajar individualmente o en pareja.</p><div class="grid2"><input class="starter" id="name1" placeholder="Nombre estudiante 1" value="${esc(state.names[0]||'')}"><input class="starter" id="name2" placeholder="Nombre estudiante 2 (opcional)" value="${esc(state.names[1]||'')}"></div><button class="route-btn" onclick="startActivity()">Comenzar ruta común</button></div>`}
function startActivity(){state.names=[name1.value.trim(),name2.value.trim()];if(!state.names[0]){alert('Escribe al menos un nombre.');return}state.mode=state.names[1]?'En pareja':'Individual';save();nextRoute()}
function questionStage(title,text,qs,prefix){return `<div class="stage on"><h2>${title}</h2><div class="text-card"><p class="big">${text}</p></div>${qs.map((q,i)=>`<div class="task" data-key="${prefix+i}"><div class="task-title">${i+1}. ${q.q}</div>${prefix==='b'?`<button class="ghost" onclick="toggleSupport(this,${JSON.stringify('Pista '+prefix+i)})">Ver apoyo</button><div class="support">${q.hint}</div>`:''}<div class="options">${q.options.map((o,j)=>`<button class="opt" data-i="${j}" onclick="selectOpt(this)">${String.fromCharCode(65+j)}. ${o}</button>`).join('')}</div><button class="confirm" onclick="confirmTask(this,${q.answer},${JSON.stringify(q.why)})">Confirmar</button><div class="feedback"></div></div>`).join('')}<div class="actions"><button class="ghost" onclick="prevRoute()">Volver</button><button class="route-btn" onclick="advanceQuestions('${prefix}',${qs.length})">Continuar</button></div></div>`}
function toggleSupport(b,label){b.nextElementSibling.classList.toggle('show');b.textContent=b.nextElementSibling.classList.contains('show')?'Cerrar apoyo':'Ver apoyo';addSupport(label)}function confirmTask(b,a,why){const t=b.closest('.task'),i=+t.dataset.selected,fb=t.querySelector('.feedback');if(Number.isNaN(i)){fb.textContent='Selecciona una alternativa.';fb.className='feedback show bad';return}state.attempts++;if(i===a){t.querySelectorAll('.opt')[a].classList.add('good');fb.textContent='Correcto. '+why;fb.className='feedback show';state.answers[t.dataset.key]=true}else{state.errors++;fb.textContent='Revisa el texto y vuelve a intentarlo. La respuesta correcta continúa oculta.';fb.className='feedback show bad'}save()}function advanceQuestions(prefix,total){for(let i=0;i<total;i++)if(!state.answers[prefix+i]){alert('Confirma correctamente las '+total+' respuestas antes de continuar.');return}nextRoute()}
function sequenceStage(){const a=D.activity;return `<div class="stage on"><h2>Ordena el proceso</h2><p class="lead">Presiona el elemento que corresponde en cada momento.</p><button class="ghost" onclick="toggleSupport(this,'Apoyo para ordenar')">Ver apoyo</button><div class="support">Pregunta: ¿qué condición aparece primero y qué cambio permite después?</div><div class="sequence-bank">${a.sequence.map((x,i)=>`<button class="seq" data-i="${i}" onclick="chooseSeq(this,${i})">${x}</button>`).reverse().join('')}</div><div class="built" id="seqBuilt"></div><button class="ghost" onclick="resetSeq()">Reiniciar</button><div class="feedback" id="seqFb"></div><div class="actions"><button class="ghost" onclick="prevRoute()">Volver</button><button class="route-btn" onclick="advanceSequence()">Continuar</button></div></div>`}
function chooseSeq(b,i){if(i!==state.sequence.length){seqFb.textContent='Todavía no. Revisa qué debe ocurrir antes.';seqFb.className='feedback show bad';state.errors++;save();return}state.sequence.push(i);b.disabled=true;b.classList.add('good');seqBuilt.innerHTML=state.sequence.map(j=>'<span>'+D.activity.sequence[j]+'</span>').join(' → ');if(state.sequence.length===D.activity.sequence.length){seqFb.textContent='Orden correcto.';seqFb.className='feedback show'}save()}function resetSeq(){state.sequence=[];save();renderRoute(3)}function advanceSequence(){if(state.sequence.length!==D.activity.sequence.length){alert('Completa el orden antes de continuar.');return}nextRoute()}
function classifyStage(){const a=D.activity;return `<div class="stage on"><h2>${a.classifyTitle}</h2><button class="ghost" onclick="toggleSupport(this,'Apoyo para clasificar')">Ver definiciones</button><div class="support">${a.classifyOptions.map(x=>'<b>'+x+'</b>').join(' · ')}</div>${a.classify.map((x,i)=>`<div class="class-row"><span>${i+1}. ${x[0]}</span><select data-i="${i}"><option value="">Selecciona</option>${a.classifyOptions.slice().reverse().map(o=>`<option>${o}</option>`).join('')}</select></div>`).join('')}<button class="route-btn" onclick="checkClassify()">Chequear</button><div class="feedback" id="classFb"></div><div class="actions"><button class="ghost" onclick="prevRoute()">Volver</button><button class="route-btn" onclick="advanceClassify()">Continuar</button></div></div>`}
function checkClassify(){let wrong=0;document.querySelectorAll('.class-row select').forEach((s,i)=>{if(s.value!==D.activity.classify[i][1])wrong++});if(wrong){state.classifyDone=false;state.errors+=wrong;classFb.textContent='Hay '+wrong+' respuesta(s) por revisar.';classFb.className='feedback show bad'}else{state.classifyDone=true;classFb.textContent='Clasificación correcta.';classFb.className='feedback show'}save()}function advanceClassify(){if(!state.classifyDone){alert('Chequea correctamente las cuatro clasificaciones antes de continuar.');return}nextRoute()}
function writingStage(){const a=D.activity;return `<div class="stage on"><h2>Verde · Construye una explicación</h2><div class="guide"><p class="big">${a.writing}</p></div><div class="actions"><button class="ghost" onclick="openWriteSupport(1)">Apoyo 1: preguntas</button><button class="ghost" onclick="openWriteSupport(2)">Apoyo 2: comienzos</button><button class="ghost" onclick="openWriteSupport(3)">Apoyo 3: ordenar</button><button class="ghost" onclick="freeWrite()">Volver a escritura libre</button></div><div class="writing-support" id="ws1">${a.supportQuestions.map(x=>'<p>'+x+'</p>').join('')}</div><div class="writing-support" id="ws2">${a.starters.map(x=>'<p>'+x+'</p>').join('')}</div><div class="writing-support" id="ws3">${a.builder.map((row,i)=>`<div class="builder-row"><b>Oración ${i+1}</b><div class="chunk-bank">${row.map((x,j)=>`<button class="chunk" onclick="addChunk(${i},${j},this)">${x}</button>`).reverse().join('')}</div><div class="built" id="build${i}"></div></div>`).join('')}<button class="route-btn" onclick="useBuilder()">Usar estas oraciones</button></div><textarea id="writing" placeholder="Escribe entre 5 y 7 oraciones…" onpaste="event.preventDefault();alert('Escribe la respuesta con tus propias palabras.')">${esc(state.writing||'')}</textarea><button class="route-btn" onclick="checkWriting()">Revisar mi respuesta</button><div class="feedback" id="writeFb"></div><div class="actions"><button class="ghost" onclick="prevRoute()">Volver</button><button class="route-btn" onclick="finishActivity()">Preparar evidencia</button></div></div>`}
function openWriteSupport(n){document.querySelectorAll('.writing-support').forEach(x=>x.classList.remove('show'));document.getElementById('ws'+n).classList.add('show');addSupport('Escritura apoyo '+n);if(n===3)renderBuilder()}function freeWrite(){document.querySelectorAll('.writing-support').forEach(x=>x.classList.remove('show'));addSupport('Volvió a escritura libre')}function renderBuilder(){D.activity.builder.forEach((r,i)=>{const order=state.builder[i]||[];const el=document.getElementById('build'+i);if(el)el.innerHTML=order.map(j=>'<span>'+r[j]+'</span>').join(' ')})}function addChunk(i,j,b){state.builder[i]=state.builder[i]||[];if(state.builder[i].includes(j))return;state.builder[i].push(j);b.disabled=true;renderBuilder();save()}function useBuilder(){const ok=D.activity.builder.every((r,i)=>JSON.stringify(state.builder[i]||[])===JSON.stringify(r.map((_,j)=>j)));if(!ok){alert('Ordena correctamente las tres oraciones.');return}state.writing=D.activity.builder.map(r=>r.join(' ')).join(' ');writing.value=state.writing;save()}function checkWriting(){state.writing=writing.value.trim();const missing=D.activity.keywordGroups.filter(g=>!g.some(k=>state.writing.toLowerCase().includes(k.toLowerCase()))).length;if(state.writing.length<140||missing){writeFb.textContent='Revisa: desarrolla al menos cinco oraciones e incluye las ideas solicitadas.';writeFb.className='feedback show bad'}else{writeFb.textContent='La explicación incluye las ideas centrales. Léela una vez más.';writeFb.className='feedback show'}save()}function finishActivity(){state.writing=writing.value.trim();if(state.writing.length<80){alert('Completa primero una explicación.');return}if(!state.code)state.code=D.code+'-'+Date.now().toString(36).slice(-6).toUpperCase();save();nextRoute()}
function evidenceStage(){const detail=`Apoyos usados: ${state.supports.join(', ')||'ninguno'}\nIntentos: ${state.attempts}\nErrores: ${state.errors}`;const url=formUrl(detail);return `<div class="stage on"><h2>Comprobante de aprendizaje</h2><div class="evidence"><b>${esc(state.names.join(' y '))}</b> · ${D.course}\n${D.title}\n${detail}\n\nRESPUESTA\n${esc(state.writing)}\n\nCódigo: ${state.code}</div><div class="actions"><a class="route-btn" href="${url}" target="_blank">Abrir formulario prellenado</a><button class="direct" onclick="downloadEvidence()">Descargar evidencia PNG</button><button class="ghost" onclick="closeRoute()">Volver a la clase</button></div></div>`}function formUrl(detail){const p=new URLSearchParams({'usp':'pp_url','entry.1918313170':state.names[0]||'','entry.908926738':state.names[1]||'','entry.658722694':D.course,'entry.1593538729':'Historia','entry.362233009':D.code,'entry.1313710278':state.mode,'entry.1312041564':'Ruta común','entry.1095614607':detail,'entry.928022546':state.writing,'entry.299102895':state.code});return FORM+'?'+p.toString()}function downloadEvidence(){const c=document.createElement('canvas');c.width=1200;c.height=1000;const x=c.getContext('2d');x.fillStyle='#f5f8fb';x.fillRect(0,0,1200,1000);x.fillStyle='#0b2d5c';x.fillRect(0,0,1200,145);x.fillStyle='#fff';x.font='bold 38px system-ui';x.fillText(D.title,55,88);x.fillStyle='#17283a';x.font='25px system-ui';let y=205;const lines=[state.names.join(' y '),D.course+' · Historia',D.code,'Apoyos: '+(state.supports.join(', ')||'ninguno'),'Intentos: '+state.attempts+' · Errores: '+state.errors,'Respuesta:',state.writing,'Código: '+state.code];lines.forEach(t=>{for(const line of wrap(x,t,1060)){x.fillText(line,55,y);y+=36}y+=13});const a=document.createElement('a');a.download=D.code+'.png';a.href=c.toDataURL();a.click()}function wrap(ctx,t,w){const out=[];let line='';String(t).split(/\s+/).forEach(v=>{const z=line?line+' '+v:v;if(ctx.measureText(z).width>w&&line){out.push(line);line=v}else line=z});out.push(line);return out}function bindRoute(){if(routeStep===5)renderBuilder()}load();buildDeck();document.addEventListener('keydown',e=>{if(route.classList.contains('open')||modal.classList.contains('open'))return;if(e.key==='ArrowRight'||e.key==='PageDown')move(1);if(e.key==='ArrowLeft'||e.key==='PageUp')move(-1)});</script></body></html>
