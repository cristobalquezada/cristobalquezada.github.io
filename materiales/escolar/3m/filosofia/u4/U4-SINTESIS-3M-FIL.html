minmax(0,1fr));gap:18px;margin:24px 0}.axis{padding:24px;border-top:7px solid var(--navy)}.axis small{color:var(--green);font-weight:900}.axis button,.primary,.confirm{border:0;border-radius:11px;background:var(--navy);color:#fff;font-weight:850;padding:11px 15px}.secondary{border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--navy);font-weight:800;padding:10px 14px}.danger{color:var(--red)}.homeacts{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.axisintro{padding:26px;background:var(--blue);border-left:8px solid var(--navy);border-radius:18px;margin:22px 0}.topics{display:grid;gap:22px}.topic{padding:clamp(22px,4vw,38px)}.essential{display:flex;align-items:center;gap:12px;color:var(--green);font-size:1.22rem;font-weight:900;margin:12px 0}.cat{width:52px;min-width:52px;fill:var(--orange)}.concepts{display:flex;gap:8px;flex-wrap:wrap}.concepts span,.tag{display:inline-block;border-radius:99px;background:var(--green2);color:#08704b;padding:5px 10px;font-weight:800}.relation{margin:18px 0;padding:16px;border-left:6px solid var(--orange);background:#fff7eb;border-radius:10px}.check{margin-top:15px;padding:15px;background:var(--blue);border-radius:12px}.check summary{font-weight:850;cursor:pointer}.done{background:var(--green)!important}.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0}.tools select{padding:10px;border:1px solid var(--line);border-radius:10px}.flashgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.flash{padding:22px;min-height:250px;display:flex;flex-direction:column}.flash .back{display:none}.flash.flip .front{display:none}.flash.flip .back{display:block}.flash footer{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}.mark{background:var(--green2);color:#08704b;border:1px solid #9dd8bb;border-radius:9px;padding:8px 10px}.review{background:#fff3e3;color:#8b4f00;border:1px solid #efc682;border-radius:9px;padding:8px 10px}.case,.reading,.writebox,.mapbox{padding:clamp(20px,4vw,34px);margin:18px 0}.level{font-weight:900;text-transform:uppercase;letter-spacing:.08em}.Blanco{color:#5b6874}.Azul{color:#176fc1}.Verde{color:#08704b}.options{display:grid;gap:10px;margin:16px 0}.option{text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px}.option.sel{border-color:var(--navy);background:var(--blue)}.option.ok{border-color:var(--green);background:var(--green2)}.option:disabled{cursor:default}.feedback{display:none;margin-top:12px;padding:12px;border-left:5px solid var(--green);background:var(--green2)}.feedback.show{display:block}.feedback.bad{border-color:var(--red);background:#fff0f0}.steps{display:grid;gap:10px}.step{border:2px dashed var(--line);border-radius:12px;padding:15px;background:#fff;color:var(--muted)}.step.revealed{border-style:solid;border-color:var(--green);background:var(--green2);color:var(--ink)}blockquote{margin:12px 0;padding:16px 20px;background:#f7fafc;border-left:6px solid var(--navy);font-size:1.08rem}.prompts{display:grid;gap:12px}.prompt{padding:14px;border-radius:12px;background:var(--blue)}textarea{width:100%;min-height:135px;border:2px solid var(--line);border-radius:12px;padding:13px;resize:vertical}.notice{display:none;color:var(--red);font-weight:800}.notice.show{display:block}.criteria{background:var(--green2);padding:14px;border-radius:12px}.model{display:none;margin-top:12px;padding:15px;background:#fff7eb;border-left:5px solid var(--orange)}.model.show{display:block}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:#fff;border-radius:16px;padding:20px;border:1px solid var(--line);text-align:center}.stat b{display:block;color:var(--navy);font-size:2rem}.reviewlist li{margin:8px 0}.book{color:var(--muted);font-weight:750}.sr{position:absolute;left:-9999px}@media(max-width:780px){body{font-size:17px}.axisgrid,.flashgrid,.stats{grid-template-columns:1fr}.navin{padding:8px}.topic,.case,.reading,.writebox,.mapbox{padding:20px}.essential{align-items:flex-start}.cat{width:44px;min-width:44px}.mast{padding:28px 22px}.wrap{padding:0 14px 60px}}
</style></head><body><header class="mast"><div class="eyebrow">Biblioteca interactiva de estudio</div><h1>Síntesis interactiva de Unidad 4</h1><p>Verdad, lenguaje, diálogo y ciudadanía</p><div class="id">Cristóbal · 3° Medio · Unidad 4 · FIL</div><div class="progressline"><i id="topProgress"></i></div></header><nav class="nav" aria-label="Navegación principal"><div class="navin" id="nav"></div></nav><main class="wrap" id="app"></main><script>
const D={"axes":[{"name":"Verdad y posverdad","goal":"Distinguir hechos, interpretaciones y apelaciones emocionales al evaluar información.","pages":"82–89","topics":[["¿Por qué la verdad es un problema filosófico?","La verdad exige justificar cómo relacionamos afirmaciones, realidad y evidencia.","No basta con que una afirmación parezca convincente: debemos preguntar qué razones la sostienen y cómo podría contrastarse. Las teorías de la verdad ofrecen criterios distintos para examinar esa relación.",["verdad","evidencia","justificación"],"Afirmación → evidencia → contraste → conclusión","¿Qué diferencia hay entre creer algo y justificarlo?"],["¿Cómo interviene el lenguaje en lo que conocemos?","El lenguaje no solo nombra la realidad: también organiza nuestra interpretación.","Las palabras seleccionan, clasifican y enmarcan experiencias. Por eso una descripción puede destacar ciertos aspectos y dejar otros fuera, sin que toda interpretación sea igualmente válida.",["lenguaje","interpretación","marco"],"Experiencia → conceptos → interpretación comunicable","¿Por qué dos descripciones del mismo hecho pueden diferir?"],["¿Qué caracteriza a la posverdad?","En la posverdad, emociones y creencias previas pesan más que los hechos verificados.","Una información se vuelve persuasiva porque confirma identidades o provoca reacciones intensas. El juicio crítico exige revisar fuente, evidencia, contexto e intención antes de compartir.",["posverdad","sesgo","verificación"],"Impacto emocional → adhesión → difusión → debilitamiento del contraste","¿Qué paso debería preceder a compartir una noticia viral?"]]},{"name":"Argumentación, saber y poder","goal":"Construir argumentos y examinar quién legitima los discursos que circulan.","pages":"90–97","topics":[["¿Qué convierte una opinión en argumento?","Un argumento conecta razones pertinentes con una conclusión defendible.","La conclusión responde a una pregunta o problema; las premisas entregan apoyo. Un argumento se evalúa por la relación entre sus razones y no por el volumen o la seguridad de quien habla.",["premisa","conclusión","pertinencia"],"Razones pertinentes → inferencia → conclusión","¿Una mayoría favorable vuelve válido cualquier argumento?"],["¿Cómo se relacionan saber y poder?","Los saberes circulan dentro de instituciones y relaciones que pueden legitimarlos o excluirlos.","Preguntar quién habla, desde dónde y con qué efectos permite analizar por qué algunas versiones aparecen como autorizadas. Esto no elimina la evidencia: amplía el examen de sus condiciones de producción.",["saber","poder","legitimación"],"Institución → autoridad → discurso legítimo → efectos sociales","¿Qué pregunta revela mejor una relación entre saber y poder?"],["¿Qué estudia la filosofía del lenguaje?","Examina cómo las palabras producen significado y efectos en la vida común.","Hablar no es solo describir. También prometemos, ordenamos, clasificamos o excluimos. Analizar usos y contextos ayuda a comprender qué hace una expresión además de lo que dice.",["significado","uso","acto de habla"],"Expresión + contexto → significado y efecto","¿Qué cambia cuando una misma frase aparece en otro contexto?"]]},{"name":"Diálogo y desacuerdo","goal":"Reconocer el desacuerdo como una práctica de razones, escucha y reconocimiento.","pages":"92–99","topics":[["¿Qué hace filosófico a un diálogo?","Un diálogo filosófico formula problemas, pide razones y admite revisar posiciones.","No busca simplemente ganar. Sus participantes definen conceptos, preguntan por supuestos y responden a objeciones reconociéndose como interlocutores capaces de pensar.",["diálogo","problema","razones"],"Pregunta → posición → razones → objeción → revisión","¿Qué actitud distingue dialogar de imponer?"],["¿Qué aporta la escucha activa?","Comprender la posición ajena antes de evaluarla mejora la calidad del desacuerdo.","Escuchar activamente implica reconstruir la idea del otro, preguntar si fue comprendida y recién entonces responder. No obliga a coincidir: evita discutir contra una caricatura.",["escucha activa","paráfrasis","objeción"],"Escuchar → reconstruir → confirmar → responder","¿Por qué parafrasear puede fortalecer una discusión?"],["¿Qué revela el desacuerdo en Rancière?","El desacuerdo muestra quién puede hablar y ser reconocido en el espacio común.","A veces el conflicto no consiste solo en opiniones distintas, sino en que ciertas voces no cuentan como interlocutoras. La política aparece cuando esa distribución se cuestiona.",["desacuerdo","igualdad","voz excluida"],"Exclusión → aparición de una voz → disputa por lo común","¿Qué diferencia hay entre desacuerdo y simple confusión?"]]},{"name":"Juicio, prejuicio y tecnología","goal":"Aplicar el juicio crítico a la convivencia, la circunstancia y las tecnologías.","pages":"100–104","topics":[["¿Cómo se relacionan estereotipo, prejuicio y discriminación?","Una simplificación puede transformarse en juicio previo y luego en trato desigual.","El estereotipo atribuye rasgos rígidos a un grupo; el prejuicio juzga antes de conocer; la discriminación materializa ese juicio en acciones o exclusiones.",["estereotipo","prejuicio","discriminación"],"Estereotipo → prejuicio → trato desigual","¿En qué momento una generalización produce una consecuencia práctica?"],["¿Qué significa pensar desde una circunstancia?","Toda perspectiva parte de una historia y un contexto, pero puede examinar sus límites.","La idea de circunstancia ayuda a reconocer que no observamos desde ningún lugar neutral. Esto no vuelve equivalentes todas las afirmaciones: seguimos comparando razones y evidencia.",["circunstancia","perspectiva","responsabilidad"],"Contexto → perspectiva → examen crítico","¿Reconocer una perspectiva impide buscar mejores razones?"],["¿Cómo ejercer juicio crítico ante la inteligencia artificial?","La fluidez de una respuesta no reemplaza la verificación ni la responsabilidad.","Una herramienta puede producir información falsa con apariencia segura. Debemos contrastar fuentes, reconocer sesgos, distinguir ayuda de autoría y responder por lo que afirmamos.",["IA","verificación","responsabilidad"],"Respuesta automática → contraste → evaluación → uso responsable","¿Qué debería verificarse antes de usar una respuesta automática?"]]}],"maps":[["De afirmación a juicio responsable",["Afirmación","Fuente y contexto","Evidencia contrastable","Conclusión provisional"]],["Arquitectura del argumento",["Problema","Tesis","Razones","Objeción y revisión"]],["Del estereotipo a la exclusión",["Generalización","Prejuicio","Decisión o práctica","Discriminación"]],["Diálogo frente al desacuerdo",["Escucha","Reconstrucción","Razones","Revisión o desacuerdo fundado"]]],"reads":[["Una noticia que confirma","Un video recortado acusa a un grupo de recibir privilegios. Se comparte miles de veces; nadie enlaza la fuente completa y los comentarios aumentan la hostilidad.","Analizar cómo la posverdad y el prejuicio pueden reforzarse."],["¿Quién puede hablar?","En una asamblea se discute una medida que afecta a estudiantes migrantes, pero ninguna persona del grupo participa ni es consultada.","Examinar el desacuerdo y la exclusión de voces."],["Una respuesta impecable","Una IA redacta una explicación convincente y cita un estudio inexistente. El texto parece experto y coincide con la postura del curso.","Distinguir fluidez, evidencia y responsabilidad."],["Dos descripciones","Dos medios narran la misma protesta: uno destaca los daños; otro, las demandas y sus antecedentes. Ambos seleccionan hechos reales.","Comparar lenguaje, enfoque y argumentación."]],"writes":[["¿Puede una interpretación ser verdadera?","140–180 palabras","Tesis clara; distinción entre interpretación y arbitrariedad; ejemplo."],["¿Cuándo un desacuerdo es filosóficamente valioso?","150–190 palabras","Condiciones del diálogo; escucha; razones; voz excluida."],["¿Quién responde por un texto producido con IA?","160–200 palabras","Posición; dos razones; objeción; respuesta responsable."],["¿Cómo enfrentar un prejuicio en la comunidad?","140–180 palabras","Diagnóstico conceptual; acción dialogada; consecuencia esperada."]],"cards":[{"a":0,"q":"verdad","d":"Idea central: La verdad exige justificar cómo relacionamos afirmaciones, realidad y evidencia.","e":"Ejemplo o secuencia: Afirmación → evidencia → contraste → conclusión","r":"Se relaciona con evidencia.","x":"Evita usar el concepto como una etiqueta sin explicar la relación."},{"a":0,"q":"evidencia","d":"Permite comprender ¿por qué la verdad es un problema filosófico?","e":"No basta con que una afirmación parezca convincente: debemos preguntar qué razones la sostienen y cómo podría contrastarse.","r":"Conecta con verdad y justificación.","x":"Evita confundir una definición con un ejemplo aislado."},{"a":0,"q":"¿Por qué la verdad es un problema filosófico?","d":"La verdad exige justificar cómo relacionamos afirmaciones, realidad y evidencia.","e":"Afirmación → evidencia → contraste → conclusión","r":"Pregunta de control: ¿Qué diferencia hay entre creer algo y justificarlo?","x":"Responde con una relación explicada, no solo con una palabra."},{"a":0,"q":"lenguaje","d":"Idea central: El lenguaje no solo nombra la realidad: también organiza nuestra interpretación.","e":"Ejemplo o secuencia: Experiencia → conceptos → interpretación comunicable","r":"Se relaciona con interpretación.","x":"Evita usar el concepto como una etiqueta sin explicar la relación."},{"a":0,"q":"interpretación","d":"Permite comprender ¿cómo interviene el lenguaje en lo que conocemos?","e":"Las palabras seleccionan, clasifican y enmarcan experiencias.","r":"Conecta con lenguaje y marco.","x":"Evita confundir una definición con un ejemplo aislado."},{"a":0,"q":"¿Cómo interviene el lenguaje en lo que conocemos?","d":"El lenguaje no solo nombra la realidad: también organiza nuestra interpretación.","e":"Experiencia → conceptos → interpretación comunicable","r":"Pregunta de control: ¿Por qué dos descripciones del mismo hecho pueden diferir?","x":"Responde con una relación explicada, no solo con una palabra."},{"a":0,"q":"posverdad","d":"Idea central: En la posverdad, emociones y creencias previas pesan más que los hechos verificados.","e":"Ejemplo o secuencia: Impacto emocional → adhesión → difusión → debilitamiento del contraste","r":"Se relaciona con sesgo.","x":"Evita usar el concepto como una etiqueta sin explicar la relación."},{"a":0,"q":"sesgo","d":"Permite comprender ¿qué caracteriza a la posverdad?","e":"Una información se vuelve persuasiva porque confirma identidades o provoca reacciones intensas.","r":"Conecta con posverdad y verificación.","x":"Evita confundir una definición con un ejemplo aislado."},{"a":0,"q":"¿Qué caracteriza a la posverdad?","d":"En la posverdad, emociones y creencias previas pesan más que los hechos verificados.","e":"Impacto emocional → adhesión → difusión → debilitamiento del contraste","r":"Pregunta de control: ¿Qué paso debería preceder a compartir una noticia viral?","x":"Responde con una relación explicada, no solo con una palabra."},{"a":1,"q":"premisa","d":"Idea central: Un argumento conecta razones pertinentes con una conclusión defendible.","e":"Ejemplo o secuencia: Razones pertinentes → inferencia → conclusión","r":"Se relaciona con conclusión.","x":"Evita usar el concepto como una etiqueta sin explicar la relación."},{"a":1,"q":"conclusión","d":"Permite comprender ¿qué convierte una opinión en argumento?","e":"La conclusión responde a una pregunta o problema; las premisas entregan apoyo.","r":"Conecta con premisa y pertinencia.","x":"Evita confundir una definición con un ejemplo aislado."},{"a":1,"q":"¿Qué convierte una opinión en argumento?","d":"Un argumento conecta razones pertinentes con una conclusión defendible.","e":"Razones pertinentes → inferencia → conclusión","r":"Pregunta de control: ¿Una mayoría favorable vuelve válido cualquier argumento?","x":"Responde con una relación explicada, no solo con una palabra."},{"a":1,"q":"saber","d":"Idea central: Los saberes circulan dentro de instituciones y relaciones que pueden legitimarlos o excluirlos.","e":"Ejemplo o secuencia: Institución → autoridad → discurso legítimo → efectos sociales","r":"Se relaciona con poder.","x":"Evita usar el concepto como una etiqueta sin explicar la relación."},{"a":1,"q":"poder","d":"Permite comprender ¿cómo se relacionan saber y poder?","e":"Preguntar quién habla, desde dónde y con qué efectos permite analizar por qué algunas versiones aparecen como autorizadas.","r":"Conecta con saber y legitimación.","x":"Evita confundir una definición con un ejemplo aislado."},{"a":1,"q":"¿Cómo se relacionan saber y poder?","d":"Los saberes circulan dentro de instituciones y relaciones que pueden legitimarlos o excluirlos.","e":"Institución → autoridad → discurso legítimo → efectos sociales","r":"Pregunta de control: ¿Qué pregunta revela mejor una relación entre saber y poder?","x":"Responde con una relación explicada, no solo con una palabra."},{"a":1,"q":"significado","d":"Idea central: Examina cómo las palabras producen significado y efectos en la vida común.","e":"Ejemplo o secuencia: Expresión + contexto → significado y efecto","r":"Se relaciona con uso.","x":"Evita usar el concepto como una etiqueta sin explicar la relación."},{"a":1,"q":"uso","d":"Permite comprender ¿qué estudia la filosofía del lenguaje?","e":"Hablar no es solo describir.","r":"Conecta con significado y acto de habla.","x":"Evita confundir una definición con un ejemplo aislado."},{"a":1,"q":"¿Qué estudia la filosofía del lenguaje?","d":"Examina cómo las palabras producen significado y efectos en la vida común.","e":"Expresión + contexto → significado y efecto","r":"Pregunta de control: ¿Qué cambia cuando una misma frase aparece en otro contexto?","x":"Responde con una relación explicada, no solo con una palabra."},{"a":2,"q":"diálogo","d":"Idea central: Un diálogo filosófico formula problemas, pide razones y admite revisar posiciones.","e":"Ejemplo o secuencia: Pregunta → posición → razones → objeción → revisión","r":"Se relaciona con problema.","x":"Evita usar el concepto como una etiqueta sin explicar la relación."},{"a":2,"q":"problema","d":"Permite comprender ¿qué hace filosófico a un diálogo?","e":"No busca simplemente ganar.","r":"Conecta con diálogo y razones.","x":"Evita confundir una definición con un ejemplo aislado."},{"a":2,"q":"¿Qué hace filosófico a un diálogo?","d":"Un diálogo filosófico formula problemas, pide razones y admite revisar posiciones.","e":"Pregunta → posición → razones → objeción → revisión","r":"Pregunta de control: ¿Qué actitud distingue dialogar de imponer?","x":"Responde con una relación explicada, no solo con una palabra."},{"a":2,"q":"escucha activa","d":"Idea central: Comprender la posición ajena antes de evaluarla mejora la calidad del desacuerdo.","e":"Ejemplo o secuencia: Escuchar → reconstruir → confirmar → responder","r":"Se relaciona con paráfrasis.","x":"Evita usar el concepto como una etiqueta sin explicar la relación."},{"a":2,"q":"paráfrasis","d":"Permite comprender ¿qué aporta la escucha activa?","e":"Escuchar activamente implica reconstruir la idea del otro, preguntar si fue comprendida y recién entonces responder.","r":"Conecta con escucha activa y objeción.","x":"Evita confundir una definición con un ejemplo aislado."},{"a":2,"q":"¿Qué aporta la escucha activa?","d":"Comprender la posición ajena antes de evaluarla mejora la calidad del desacuerdo.","e":"Escuchar → reconstruir → confirmar → responder","r":"Pregunta de control: ¿Por qué parafrasear puede fortalecer una discusión?","x":"Responde con una relación explicada, no solo con una palabra."},{"a":2,"q":"desacuerdo","d":"Idea central: El desacuerdo muestra quién puede hablar y ser reconocido en el espacio común.","e":"Ejemplo o secuencia: Exclusión → aparición de una voz → disputa por lo común","r":"Se relaciona con igualdad.","x":"Evita usar el concepto como una etiqueta sin explicar la relación."},{"a":2,"q":"igualdad","d":"Permite comprender ¿qué revela el desacuerdo en rancière?","e":"A veces el conflicto no consiste solo en opiniones distintas, sino en que ciertas voces no cuentan como interlocutoras.","r":"Conecta con desacuerdo y voz excluida.","x":"Evita confundir una definición con un ejemplo aislado."},{"a":2,"q":"¿Qué revela el desacuerdo en Rancière?","d":"El desacuerdo muestra quién puede hablar y ser reconocido en el espacio común.","e":"Exclusión → aparición de una voz → disputa por lo común","r":"Pregunta de control: ¿Qué diferencia hay entre desacuerdo y simple confusión?","x":"Responde con una relación explicada, no solo con una palabra."},{"a":3,"q":"estereotipo","d":"Idea central: Una simplificación puede transformarse en juicio previo y luego en trato desigual.","e":"Ejemplo o secuencia: Estereotipo → prejuicio → trato desigual","r":"Se relaciona con prejuicio.","x":"Evita usar el concepto como una etiqueta sin explicar la relación."},{"a":3,"q":"prejuicio","d":"Permite comprender ¿cómo se relacionan estereotipo, prejuicio y discriminación?","e":"El estereotipo atribuye rasgos rígidos a un grupo; el prejuicio juzga antes de conocer; la discriminación materializa ese juicio en acciones o exclusiones.","r":"Conecta con estereotipo y discriminación.","x":"Evita confundir una definición con un ejemplo aislado."},{"a":3,"q":"¿Cómo se relacionan estereotipo, prejuicio y discriminación?","d":"Una simplificación puede transformarse en juicio previo y luego en trato desigual.","e":"Estereotipo → prejuicio → trato desigual","r":"Pregunta de control: ¿En qué momento una generalización produce una consecuencia práctica?","x":"Responde con una relación explicada, no solo con una palabra."},{"a":3,"q":"circunstancia","d":"Idea central: Toda perspectiva parte de una historia y un contexto, pero puede examinar sus límites.","e":"Ejemplo o secuencia: Contexto → perspectiva → examen crítico","r":"Se relaciona con perspectiva.","x":"Evita usar el concepto como una etiqueta sin explicar la relación."},{"a":3,"q":"perspectiva","d":"Permite comprender ¿qué significa pensar desde una circunstancia?","e":"La idea de circunstancia ayuda a reconocer que no observamos desde ningún lugar neutral.","r":"Conecta con circunstancia y responsabilidad.","x":"Evita confundir una definición con un ejemplo aislado."},{"a":3,"q":"¿Qué significa pensar desde una circunstancia?","d":"Toda perspectiva parte de una historia y un contexto, pero puede examinar sus límites.","e":"Contexto → perspectiva → examen crítico","r":"Pregunta de control: ¿Reconocer una perspectiva impide buscar mejores razones?","x":"Responde con una relación explicada, no solo con una palabra."},{"a":3,"q":"IA","d":"Idea central: La fluidez de una respuesta no reemplaza la verificación ni la responsabilidad.","e":"Ejemplo o secuencia: Respuesta automática → contraste → evaluación → uso responsable","r":"Se relaciona con verificación.","x":"Evita usar el concepto como una etiqueta sin explicar la relación."},{"a":3,"q":"verificación","d":"Permite comprender ¿cómo ejercer juicio crítico ante la inteligencia artificial?","e":"Una herramienta puede producir información falsa con apariencia segura.","r":"Conecta con IA y responsabilidad.","x":"Evita confundir una definición con un ejemplo aislado."},{"a":3,"q":"¿Cómo ejercer juicio crítico ante la inteligencia artificial?","d":"La fluidez de una respuesta no reemplaza la verificación ni la responsabilidad.","e":"Respuesta automática → contraste → evaluación → uso responsable","r":"Pregunta de control: ¿Qué debería verificarse antes de usar una respuesta automática?","x":"Responde con una relación explicada, no solo con una palabra."}],"cases":[["Blanco","Una publicación coincide con tus creencias, pero no cita fuentes. ¿Qué acción corresponde primero?",["Compartir después de leer comentarios","Verificar fuente, contexto y evidencia","Aceptar porque confirma experiencias propias","Rechazar solamente por causar emoción"]],["Blanco","Una afirmación presenta razones pertinentes para sostener una conclusión. ¿Qué construye?",["Un prejuicio socialmente compartido aquí","Una descripción completamente neutral aquí","Un argumento que puede evaluarse","Un estereotipo repetido por costumbre"]],["Blanco","Una generalización rígida atribuye el mismo rasgo a todo un grupo. ¿Qué es?",["Un estereotipo sobre identidad grupal aquí","Un desacuerdo sobre razones públicas aquí","Una inferencia desde evidencia suficiente aquí","Una circunstancia examinada de manera crítica"]],["Azul","En una asamblea hablan todos excepto quienes serán afectados. ¿Qué problema aparece?",["Faltan emociones para generar acuerdo aquí","Sobran argumentos para tomar decisiones aquí","Existe demasiada diversidad de perspectivas aquí","Hay voces excluidas del espacio común"]],["Azul","Una persona reconstruye la postura rival antes de responder. ¿Qué práctica realiza?",["Expone una conclusión sin premisas aquí","Impone su perspectiva mediante autoridad aquí","Practica escucha activa antes de objetar","Confirma automáticamente todas las opiniones aquí"]],["Azul","Una IA inventa una cita con apariencia académica. ¿Qué criterio debe aplicarse?",["Aceptar la fluidez como evidencia suficiente","Contrastar la fuente antes de usarla","Descartar toda herramienta por principio aquí","Repetirla si coincide con la mayoría"]],["Azul","Dos medios seleccionan aspectos distintos del mismo hecho. ¿Qué conviene analizar?",["Solamente cuál texto tiene más palabras","Únicamente cuál versión provoca menos emoción","Si ambas noticias poseen idéntico diseño","Marcos, fuentes, argumentos y omisiones respectivas"]],["Verde","Una norma afecta a un grupo sin escucharlo. ¿Qué respuesta mejora el diálogo?",["Incluir sus voces y examinar razones","Evitar preguntas para acelerar el acuerdo","Votar antes de conocer sus experiencias","Delegar la decisión solamente a expertos"]],["Verde","Un rumor produce rechazo hacia estudiantes nuevos. ¿Qué secuencia ayuda a explicarlo?",["Prejuicio, evidencia, diálogo y conclusión","Estereotipo, prejuicio, discriminación y exclusión","Argumento, verificación, desacuerdo y escucha","Circunstancia, fuente, consenso y tolerancia"]],["Verde","¿Qué evaluación distingue interpretación responsable de arbitrariedad?",["Toda perspectiva resulta igualmente verdadera aquí","Cada emoción reemplaza cualquier evidencia disponible","La mayoría decide definitivamente los hechos","Las razones deben contrastarse públicamente siempre"]],["Verde","¿Qué muestra mejor la relación saber-poder?",["Una institución legitima ciertas voces expertas","Una palabra posee varias sílabas iguales","Un estudiante recuerda una definición exacta","Un diálogo termina con acuerdo completo"]],["Verde","¿Qué uso escolar de IA resulta responsable?",["Entregar textos automáticos como producción propia","Aceptar referencias porque parecen muy precisas","Verificar información y declarar apoyos utilizados","Eliminar toda revisión realizada por personas"]]]},META={"abbr":"FIL","subject":"Filosofía","title":"Verdad, lenguaje, diálogo y ciudadanía","intro":"Explora cómo construimos y justificamos lo que consideramos verdadero, cómo influyen el lenguaje y el poder, y qué condiciones permiten un desacuerdo filosófico responsable."};const app=document.getElementById('app'),nav=document.getElementById('nav'),topProgress=document.getElementById('topProgress');const KEY='U4-SINTESIS-3M-'+META.abbr+'-v1';const tabs=[['home','Inicio'],['content','Ejes de contenido'],['flash','Flashcards'],['cases','Casos de aplicación'],['reads','Lecturas guiadas'],['maps','Mapas y relaciones'],['writes','Desafíos de escritura'],['progress','Progreso']];let S=load(),current='home',axisFilter='all';
function fresh(){return{last:'home',topics:{},cards:{},cases:{},reads:{},writes:{},maps:{}}}function load(){try{return Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return fresh()}}function save(){S.last=current;localStorage.setItem(KEY,JSON.stringify(S));updateProgress()}function e(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}function cat(){return '<svg class="cat" viewBox="0 0 64 48" aria-hidden="true"><path d="M12 21 8 5l15 10c6-2 12-2 18 0L56 5l-4 17c3 4 4 8 3 13-2 9-12 13-23 13S11 44 9 35c-1-5 0-10 3-14Zm12 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm16 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm-8 10c4 0 7-2 8-5H24c1 3 4 5 8 5Z"/></svg>'}
function go(id,ax){current=id;if(ax!==undefined)axisFilter=String(ax);render();scrollTo({top:0,behavior:'smooth'});save()}window.go=go;
function renderNav(){nav.innerHTML=tabs.map(t=>'<button '+(current===t[0]?'class="on"':'')+' data-go="'+t[0]+'">'+t[1]+'</button>').join('');nav.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go))}
function render(){renderNav();app.innerHTML='<section class="view on">'+({home:home(),content:content(),flash:flash(),cases:cases(),reads:reads(),maps:maps(),writes:writes(),progress:progress()}[current])+'</section>';bind();updateProgress()}
function home(){return '<div class="hero"><h2>Tu biblioteca de la Unidad 4</h2><p class="lead">'+META.intro+'</p><p>Puedes estudiar un eje completo o entrar directamente a flashcards, casos, lecturas, mapas y escritura. No existe un orden obligatorio.</p><div class="axisgrid">'+D.axes.map((a,i)=>'<article class="axis"><small>EJE '+(i+1)+' · PÁGINAS '+a.pages+'</small><h3>'+a.name+'</h3><p>'+a.goal+'</p><button data-go="content" data-axis="'+i+'">Explorar este eje</button></article>').join('')+'</div><div class="homeacts"><button class="primary" data-go="'+(S.last==='home'?'content':S.last)+'">Continuar desde el último punto</button><button class="secondary danger" id="reset">Reiniciar progreso</button></div></div>'}
function filter(){return '<div class="tools"><label>Mostrar eje: <select id="axisFilter"><option value="all">Todos los ejes</option>'+D.axes.map((a,i)=>'<option value="'+i+'" '+(axisFilter==i?'selected':'')+'>'+a.name+'</option>').join('')+'</select></label></div>'}
function content(){const axes=D.axes.map((a,ai)=>{if(axisFilter!=='all'&&axisFilter!=ai)return '';return '<section><div class="axisintro"><small>EJE '+(ai+1)+' · Libro: '+a.pages+'</small><h2>'+a.name+'</h2><p>'+a.goal+' Se conecta con los demás ejes porque permite pasar de conceptos y decisiones a sus efectos públicos.</p><b>Al finalizar, deberías poder explicar, relacionar y aplicar estos conceptos en un caso nuevo.</b></div><div class="topics">'+a.topics.map((t,ti)=>{const k=ai+'-'+ti;return '<article class="topic"><h3>'+t[0]+'</h3><div class="essential">'+cat()+'<span>'+t[1]+'</span></div><p>'+t[2]+'</p><div class="concepts">'+t[3].map(x=>'<span>'+x+'</span>').join('')+'</div><div class="relation"><b>Relación clave</b><br>'+t[4]+'</div><div class="check"><details><summary>Comprueba tu comprensión</summary><p>'+t[5]+'</p><p><b>Ruta:</b> responde con una idea del tema y explica una relación.</p></details></div><p class="book">Revisemos el libro en las páginas '+a.pages+' para profundizar este tema.</p><button class="secondary topicdone '+(S.topics[k]?'done':'')+'" data-k="'+k+'">'+(S.topics[k]?'Tema revisado ✓':'Marcar tema revisado')+'</button></article>'}).join('')+'</div></section>'}).join('');return '<h2>Ejes y temas de contenido</h2><p class="lead">Cada tema parte con una pregunta y concentra lo esencial junto al gato naranja.</p>'+filter()+axes}
function flash(){const list=D.cards.map((x,i)=>{if(axisFilter!=='all'&&axisFilter!=x.a)return '';const st=S.cards[i];return '<article class="flash '+(st&&st.flip?'flip':'')+'" data-card="'+i+'"><div class="front"><span class="tag">'+D.axes[x.a].name+'</span><h3>'+x.q+'</h3><p>Intenta recordarlo antes de girar la tarjeta.</p></div><div class="back"><h3>'+x.q+'</h3><p><b>Definición:</b> '+x.d+'</p><p><b>Ejemplo:</b> '+x.e+'</p><p><b>Relación:</b> '+x.r+'</p><p><b>Error frecuente:</b> '+x.x+'</p></div><footer><button class="secondary flip">Girar tarjeta</button><button class="mark" data-cardmark="'+i+'" data-v="ok">Lo comprendí</button><button class="review" data-cardmark="'+i+'" data-v="review">Necesito repasarlo</button></footer></article>'}).join('');return '<h2>Flashcards por eje</h2><p class="lead">36 tarjetas para recuperar conceptos, ejemplos y relaciones.</p>'+filter()+'<div class="flashgrid">'+list+'</div>'}
function cases(){return '<h2>Casos de aplicación</h2><p class="lead">Selecciona una alternativa y luego confirma. Los errores solo se registran al confirmar; la respuesta correcta permanece oculta hasta acertar.</p>'+D.cases.map((q,i)=>{const s=S.cases[i]||{};return '<article class="case" data-case="'+i+'"><div class="level '+q[0]+'">Nivel '+q[0]+'</div><h3>'+(i+1)+'. '+q[1]+'</h3><div class="options">'+q[2].map((o,j)=>'<button class="option '+(s.sel===j?'sel ':'')+(s.done&&q.a===j?'ok':'')+'" data-opt="'+j+'" '+(s.done||((s.tried||[]).includes(j))?'disabled':'')+'>'+String.fromCharCode(65+j)+'. '+o+'</button>').join('')+'</div><button class="confirm" '+(s.sel===undefined||s.done?'disabled':'')+'>Confirmar</button><div class="feedback '+(s.msg?'show ':'')+(s.done?'':'bad')+'">'+(s.msg||'')+'</div></article>'}).join('')}
function reads(){return '<h2>Lecturas guiadas</h2><p class="lead">Lee cada situación y responde desde tres niveles. Los apoyos orientan el proceso sin entregar la respuesta.</p>'+D.reads.map((r,i)=>'<article class="reading"><span class="tag">Lectura '+(i+1)+'</span><h3>'+r[0]+'</h3><p><b>Contexto:</b> '+r[2]+'</p><blockquote>'+r[1]+'</blockquote><div class="prompts"><div class="prompt"><b class="Blanco">Blanco · Identificar</b><br>¿Qué hecho o problema central presenta el texto?</div><div class="prompt"><b class="Azul">Azul · Relacionar</b><br>Relaciona el caso con dos conceptos de la unidad.<br><small>Apoyo: nombra cada concepto y explica el vínculo con una evidencia del texto.</small></div><div class="prompt"><b class="Verde">Verde · Interpretar</b><br>Formula una conclusión justificada o una decisión responsable.<br><small>Apoyo: postura → evidencia → concepto → consecuencia.</small></div></div><textarea data-read="'+i+'" placeholder="Escribe tus respuestas con tus propias palabras.">'+e(S.reads[i]&&S.reads[i].text||'')+'</textarea><p class="notice">Pegar está deshabilitado. Escribe la respuesta con tus propias palabras.</p><button class="secondary readDone" data-i="'+i+'">'+(S.reads[i]&&S.reads[i].done?'Lectura completada ✓':'Marcar lectura completada')+'</button></article>').join('')}
function maps(){return '<h2>Mapas y relaciones</h2><p class="lead">Revela cada proceso por etapas e intenta anticipar el paso siguiente.</p>'+D.maps.map((m,i)=>'<article class="mapbox"><span class="tag">Mapa '+(i+1)+'</span><h3>'+m[0]+'</h3><div class="steps">'+m[1].map((s,j)=>'<button class="step '+((S.maps[i]||0)>j?'revealed':'')+'" data-map="'+i+'" data-step="'+j+'">'+((S.maps[i]||0)>j?(j+1)+'. '+s:'Revelar paso '+(j+1))+'</button>').join('')+'</div></article>').join('')}
function writes(){return '<h2>Desafíos de escritura</h2><p class="lead">Escribe primero. El modelo de estructura se habilita después de producir un borrador suficiente.</p>'+D.writes.map((w,i)=>{const s=S.writes[i]||{};return '<article class="writebox"><span class="tag">Desafío '+(i+1)+'</span><h3>'+w[0]+'</h3><p><b>Extensión:</b> '+w[1]+'</p><div class="criteria"><b>Criterios:</b> '+w[2]+'<br><b>Conectores útiles:</b> porque · sin embargo · por ejemplo · por lo tanto.</div><textarea data-write="'+i+'" placeholder="Redacta aquí tu respuesta.">'+e(s.text||'')+'</textarea><p class="notice">Pegar está deshabilitado. Escribe la respuesta con tus propias palabras.</p><div class="homeacts"><button class="secondary compare" data-i="'+i+'" '+((s.text||'').trim().length<120?'disabled':'')+'>Comparar con una estructura modelo</button><button class="secondary writeDone" data-i="'+i+'">'+(s.done?'Desafío completado ✓':'Marcar como completado')+'</button></div><div class="model '+(s.model?'show':'')+'"><b>Estructura modelo, no respuesta:</b> inicia con una tesis directa; desarrolla una razón con un concepto; agrega evidencia o ejemplo; considera una objeción; cierra explicando una consecuencia.</div></article>'}).join('')}
function calc(){const vals=[Object.keys(S.topics).filter(k=>S.topics[k]).length/(D.axes.length*3),Object.keys(S.cards).filter(k=>S.cards[k].mark).length/D.cards.length,Object.keys(S.cases).filter(k=>S.cases[k].done).length/D.cases.length,Object.keys(S.reads).filter(k=>S.reads[k].done).length/D.reads.length,Object.keys(S.maps).filter(k=>(S.maps[k]||0)>=D.maps[k][1].length).length/D.maps.length,Object.keys(S.writes).filter(k=>S.writes[k].done).length/D.writes.length];return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*100)}
function progress(){const understood=Object.keys(S.cards).filter(k=>S.cards[k].mark==='ok').length,review=Object.keys(S.cards).filter(k=>S.cards[k].mark==='review').map(k=>D.cards[k].q);return '<h2>Mi progreso</h2><div class="stats"><div class="stat"><b>'+calc()+'%</b>avance global</div><div class="stat"><b>'+Object.keys(S.topics).filter(k=>S.topics[k]).length+'/12</b>temas revisados</div><div class="stat"><b>'+understood+'/36</b>flashcards comprendidas</div><div class="stat"><b>'+Object.keys(S.cases).filter(k=>S.cases[k].done).length+'/12</b>casos logrados</div></div><article class="panel" style="padding:26px;margin-top:18px"><h3>Conceptos que necesitan repaso</h3>'+(review.length?'<ul class="reviewlist">'+review.map(x=>'<li>'+x+'</li>').join('')+'</ul>':'<p>Aún no has marcado tarjetas para repasar.</p>')+'<p><small>Este registro es una ayuda local de estudio y no garantiza autoría ni reemplaza la retroalimentación docente.</small></p></article>'}
function bind(){document.querySelectorAll('#app [data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go,b.dataset.axis));const af=document.getElementById('axisFilter');if(af)af.onchange=()=>{axisFilter=af.value;render()};document.querySelectorAll('.topicdone').forEach(b=>b.onclick=()=>{S.topics[b.dataset.k]=!S.topics[b.dataset.k];save();render()});document.querySelectorAll('.flip').forEach(b=>b.onclick=()=>{const el=b.closest('.flash'),i=el.dataset.card;S.cards[i]=S.cards[i]||{};S.cards[i].flip=!S.cards[i].flip;save();el.classList.toggle('flip')});document.querySelectorAll('[data-cardmark]').forEach(b=>b.onclick=()=>{const i=b.dataset.cardmark;S.cards[i]=S.cards[i]||{};S.cards[i].mark=b.dataset.v;save();render()});document.querySelectorAll('.case').forEach(el=>{const i=+el.dataset.case,q=D.cases[i],s=S.cases[i]=S.cases[i]||{tried:[],attempts:0,errors:0};el.querySelectorAll('.option').forEach(o=>o.onclick=()=>{s.sel=+o.dataset.opt;save();render()});el.querySelector('.confirm').onclick=()=>{if(s.sel===undefined||s.done)return;s.attempts++;if(s.sel===q.a){s.done=true;s.msg='Correcto. La alternativa aplica el concepto central al caso y mantiene una relación coherente con la unidad.'}else{s.errors++;s.tried.push(s.sel);delete s.sel;s.msg='Revisa qué concepto explica mejor la relación del caso y vuelve a intentarlo. La respuesta correcta sigue oculta.'}save();render()}});document.querySelectorAll('textarea').forEach(t=>guard(t));document.querySelectorAll('[data-read]').forEach(t=>t.oninput=()=>{const i=t.dataset.read;S.reads[i]=S.reads[i]||{};S.reads[i].text=t.value;save()});document.querySelectorAll('.readDone').forEach(b=>b.onclick=()=>{const i=b.dataset.i,Sr=S.reads[i]=S.reads[i]||{};Sr.done=!!(Sr.text||'').trim();if(!Sr.done)alert('Escribe primero una respuesta propia.');save();render()});document.querySelectorAll('[data-write]').forEach(t=>t.oninput=()=>{const i=t.dataset.write;S.writes[i]=S.writes[i]||{};S.writes[i].text=t.value;save();const b=t.closest('.writebox').querySelector('.compare');b.disabled=t.value.trim().length<120});document.querySelectorAll('.compare').forEach(b=>b.onclick=()=>{S.writes[b.dataset.i]=S.writes[b.dataset.i]||{};S.writes[b.dataset.i].model=true;save();render()});document.querySelectorAll('.writeDone').forEach(b=>b.onclick=()=>{const i=b.dataset.i,s=S.writes[i]=S.writes[i]||{};s.done=(s.text||'').trim().length>=120;if(!s.done)alert('Desarrolla primero un borrador de al menos 120 caracteres.');save();render()});document.querySelectorAll('[data-map]').forEach(b=>b.onclick=()=>{const i=+b.dataset.map,j=+b.dataset.step,n=S.maps[i]||0;if(j===n)S.maps[i]=n+1;save();render()});const resetBtn=document.getElementById('reset');if(resetBtn)resetBtn.onclick=()=>{if(confirm('¿Reiniciar todo el progreso guardado en este navegador?')){localStorage.removeItem(KEY);S=fresh();current='home';render()}}}
function guard(t){const msg=t.parentElement.querySelector('.notice');const block=ev=>{ev.preventDefault();msg&&msg.classList.add('show');setTimeout(()=>msg&&msg.classList.remove('show'),2600)};t.addEventListener('paste',block);t.addEventListener('drop',block);t.addEventListener('beforeinput',ev=>{if(['insertFromPaste','insertFromPasteAsQuotation','insertFromDrop'].includes(ev.inputType))block(ev)});t.addEventListener('keydown',ev=>{if(((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='v')||(ev.shiftKey&&ev.key==='Insert'))block(ev)})}
function updateProgress(){topProgress.style.width=calc()+'%'}render();
</script></body></html>
