cia”. Ella escribe varias definiciones correctas, pero no señala un criterio, no compara y tampoco incluye una evidencia. Antes de entregar, decide revisar su trabajo usando la instrucción como lista de control.","white":[["¿Qué acción principal pide la consigna?",["Comparar dos perspectivas sobre libertad aquí","Definir todos los conceptos del curso","Resumir una lectura sin relacionarla aquí"],0],["¿Qué elemento falta en la respuesta?",["Una fecha exacta del problema","Un criterio común de comparación","Una portada con información personal"],1],["¿Qué decisión ayuda a mejorarla?",["Repetir todas las definiciones iniciales aquí también","Eliminar la postura para evitar errores aquí","Usar la consigna como lista de control"],2]],"blue":[["¿Por qué la respuesta inicial resulta insuficiente?",["Contiene definiciones, pero no cumple las acciones solicitadas","Presenta demasiadas evidencias relacionadas con su postura aquí","Utiliza un criterio común para comparar perspectivas aquí","Revisa claramente cada condición antes de entregar aquí"],0],["¿Qué orden de trabajo resulta más adecuado?",["Escribir, adivinar, copiar y entregar inmediatamente aquí","Leer, planificar, redactar y revisar la respuesta","Definir, repetir, extender y cambiar el tema","Opinar, resumir, borrar y evitar evidencia aquí"],1],["¿Qué revisión mejora la fundamentación?",["Comprobar que cada razón apoye la conclusión","Agregar palabras técnicas aunque no sean necesarias","Cambiar la postura después de cada oración","Eliminar ejemplos para reducir la extensión aquí"],0]],"order":["Leer toda la consigna","Destacar el verbo principal","Separar las condiciones","Planificar la respuesta","Redactar con conectores","Revisar antes de entregar"],"write":"Escribe cinco o seis oraciones explicando qué estrategia de aprendizaje te resultará más útil el próximo año. Incluye una razón, un ejemplo concreto y una acción que puedas aplicar."},"closeWhite":[["La acción principal de una consigna aparece en el","verbo"],["Explicar una idea con palabras propias es","parafrasear"],["La relación clara entre ideas se llama","coherencia"],["Una palabra que muestra relaciones es un","conector"],["Comprobar y mejorar antes de entregar es","revisar"]],"closeBlue":[["¿Qué apunte resulta más útil para estudiar?",["Una copia completa sin relaciones visibles aquí","Una lista extensa de frases desconectadas aquí","Una síntesis con conceptos, relaciones y ejemplos","Una página formada solamente por títulos aquí"],2],["¿Qué paso debe realizarse primero?",["Identificar qué solicita exactamente la consigna","Redactar una conclusión antes de leer","Buscar palabras difíciles para parecer experto","Copiar información sin seleccionar ideas aquí"],0],["¿Cuál revisión examina mejor una respuesta?",["Contar palabras y entregar sin releer aquí","Cambiar conectores aunque alteren el sentido aquí","Agregar definiciones aunque no sean pertinentes aquí","Comparar la respuesta con todos los requisitos"],3]]},STORE=D.code+'-v1';let idx=0,S=load();function load(){try{return Object.assign({items:{},order:[],writing:'',supports:[],current:'start'},JSON.parse(localStorage.getItem(STORE)||'{}'))}catch{return{items:{},order:[],writing:'',supports:[],current:'start'}}}function save(){localStorage.setItem(STORE,JSON.stringify(S))}function cat(){return '<svg class="cat"><use href="#cat"/></svg>'}function mark(p,mode,t){let s=p;if(mode==='ideas')s='<span class="p-'+(t===D.texts[t]?.main?'main':'second')+'">'+s+'</span>';return s}

function show(i){const sl=[...document.querySelectorAll('.slide')];idx=Math.max(0,Math.min(sl.length-1,i));sl.forEach((x,j)=>x.classList.toggle('on',j===idx));count.textContent=(idx+1)+' / '+sl.length;bar.style.width=((idx+1)/sl.length*100)+'%';prev.disabled=idx===0;next.disabled=idx===sl.length-1;scrollTo(0,0)}prev.onclick=()=>show(idx-1);next.onclick=()=>show(idx+1);addEventListener('keydown',e=>{if(modal.classList.contains('on')||/INPUT|TEXTAREA|SELECT|BUTTON/.test(e.target.tagName))return;if(e.key==='ArrowRight')show(idx+1);if(e.key==='ArrowLeft')show(idx-1)});function goClosure(){show([...document.querySelectorAll('.slide')].findIndex(x=>x.classList.contains('closure')))}
function pages(){pagesEl.innerHTML='<div class="page on" id="start"><h2>Antes de comenzar</h2><p>Lee el caso y avanza por la misma ruta común.</p><div class="actions"><button class="primary" onclick="page(&quot;white&quot;)">Comenzar</button></div></div><div class="page" id="white"><span class="tag white">Blanco · Identificar</span><h2>Lectura inicial</h2><div class="textcard"><p>'+D.activity.source+'</p></div><div id="whiteTasks"></div><button class="primary" id="whiteNext" onclick="page(&quot;blue&quot;)" disabled>Continuar</button></div><div class="page" id="blue"><span class="tag blue">Azul · Relacionar</span><h2>Relaciona ideas y evidencia</h2><div id="blueTasks"></div><button class="primary" id="blueNext" onclick="page(&quot;order&quot;)" disabled>Continuar</button></div><div class="page" id="order"><span class="tag blue">Organizar</span><h2>Construye una ruta de trabajo</h2><p>Selecciona el paso que corresponde en cada momento.</p><button class="secondary" onclick="orderHelp.classList.toggle(&quot;show&quot;)">Ver apoyo</button><div class="supports" id="orderHelp">Pregunta: ¿qué debe ocurrir antes de redactar? ¿Qué se revisa al final?</div><div class="order" id="orderList"></div><div class="fb" id="orderFb"></div><button class="primary" id="orderNext" onclick="page(&quot;green&quot;)" disabled>Continuar</button></div><div class="page" id="green"><span class="tag green">Verde · Explicar</span><h2>Escribe una respuesta propia</h2><p>'+D.activity.write+'</p><div class="actions"><button class="secondary" onclick="support1.classList.toggle(&quot;show&quot;);record(&quot;Preguntas de apoyo&quot;)">Apoyo 1</button><button class="secondary" onclick="support2.classList.toggle(&quot;show&quot;);record(&quot;Inicios de oración&quot;)">Apoyo 2</button><button class="secondary" onclick="support3.classList.toggle(&quot;show&quot;);record(&quot;Estructura guiada&quot;)">Apoyo 3</button></div><div class="supports" id="support1">¿Cuál es tu idea principal? ¿Qué razón la sostiene? ¿Qué ejemplo puedes usar? ¿Qué consecuencia se desprende?</div><div class="supports" id="support2">Considero que… · Una razón es… · Esto se observa en… · Como consecuencia… · En síntesis…</div><div class="supports" id="support3">1. Escribe tu postura. 2. Agrega “porque” y una razón. 3. Incluye un ejemplo. 4. Cierra con una consecuencia.</div><textarea id="writing" placeholder="Escribe aquí con tus propias palabras.">'+(S.writing||'')+'</textarea><p class="warning" id="warn">Pegar está deshabilitado. Escribe la respuesta con tus propias palabras.</p><div class="criteria"><span class="criterion" data-c="length">5 oraciones</span><span class="criterion" data-c="reason">razón</span><span class="criterion" data-c="example">ejemplo</span><span class="criterion" data-c="close">cierre</span></div><button class="primary" onclick="finishActivity()">Revisar y finalizar</button><div class="fb" id="greenFb"></div></div><div class="page" id="done"><h2>Actividad completada</h2><div class="card"><p><b>Apoyos utilizados:</b> <span id="used"></span></p><p><b>Respuesta:</b></p><p id="answer"></p></div><div class="actions"><button class="primary" onclick="closeActivity();goClosure()">Ir al cierre</button></div></div>'}
function taskData(type){return D.activity[type]}function state(k){return S.items[k]||(S.items[k]={sel:null,tries:[],done:false})}function renderTasks(type){const data=taskData(type),wrap=document.getElementById(type+'Tasks');wrap.innerHTML='';data.forEach((q,i)=>{const k=type+i,s=state(k),el=document.createElement('div');el.className='task';el.innerHTML='<h3>'+(i+1)+'. '+q[0]+'</h3><div class="opts">'+q[1].map((o,j)=>'<button data-j="'+j+'" '+(s.done?'disabled':'')+'>'+String.fromCharCode(65+j)+'. '+o+'</button>').join('')+'</div><button class="primary confirm" disabled>Confirmar</button><div class="fb"></div>';const opts=[...el.querySelectorAll('.opts button')],btn=el.querySelector('.confirm'),fb=el.querySelector('.fb');opts.forEach((o,j)=>{if(s.done&&j===q[2])o.classList.add('ok');o.onclick=()=>{s.sel=j;opts.forEach(x=>x.classList.remove('sel'));o.classList.add('sel');btn.disabled=false;save()}});btn.onclick=()=>{if(s.sel===q[2]){s.done=true;fb.className='fb show';fb.textContent='Correcto. La respuesta se sostiene en el texto.';opts.forEach((o,j)=>{o.disabled=true;if(j===q[2])o.classList.add('ok')});btn.disabled=true}else{s.tries.push(s.sel);fb.className='fb show bad';fb.textContent='Revisa el texto y vuelve a intentarlo. La respuesta correcta sigue oculta.';btn.disabled=true}s.sel=null;save();unlock(type)};if(s.done){fb.className='fb show';fb.textContent='Correcto. La respuesta se sostiene en el texto.'}wrap.appendChild(el)});unlock(type)}function unlock(type){document.getElementById(type+'Next').disabled=!taskData(type).every((q,i)=>state(type+i).done)}
function renderOrder(){orderList.innerHTML='';D.activity.order.forEach((x,i)=>{const b=document.createElement('button');b.textContent=(S.order.includes(i)?(S.order.indexOf(i)+1)+'. ':'')+x;b.className=S.order.includes(i)?'done':'';b.disabled=S.order.includes(i);b.onclick=()=>{if(i===S.order.length){S.order.push(i);renderOrder();if(S.order.length===D.activity.order.length){orderFb.className='fb show';orderFb.textContent='Orden completo.';orderNext.disabled=false}}else{orderFb.className='fb show bad';orderFb.textContent='Ese paso todavía no corresponde. Revisa qué debe ocurrir antes.'}save()};orderList.appendChild(b)});orderNext.disabled=S.order.length<D.activity.order.length}
function page(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');S.current=id;save();mstatus.textContent=id==='white'?'Blanco':id==='blue'?'Azul':id==='order'?'Organizar':id==='green'?'Verde':'Actividad';if(id==='white'||id==='blue')renderTasks(id);if(id==='order')renderOrder();if(id==='green')bindWriting();scrollTo(0,0)}
function bindWriting(){writing.value=S.writing||'';const block=e=>{e.preventDefault();warn.classList.add('show');setTimeout(()=>warn.classList.remove('show'),2500)};writing.onpaste=block;writing.ondrop=block;writing.onbeforeinput=e=>{if(['insertFromPaste','insertFromDrop'].includes(e.inputType))block(e)};writing.oninput=()=>{S.writing=writing.value;paintCriteria();save()};paintCriteria()}function checks(){const t=writing.value;return{length:t.split(/[.!?]+/).filter(x=>x.trim().length>10).length>=5,reason:/porque|razón|debido/i.test(t),example:/por ejemplo|evidencia|se observa/i.test(t),close:/en síntesis|en conclusión|por lo tanto|esto permite/i.test(t)}}function paintCriteria(){const c=checks();document.querySelectorAll('.criterion').forEach(x=>x.classList.toggle('ok',c[x.dataset.c]))}function finishActivity(){const c=checks(),miss=Object.values(c).filter(x=>!x).length;if(miss){greenFb.className='fb show bad';greenFb.textContent='Todavía faltan '+miss+' criterio(s). Revisa los indicadores.';return}S.writing=writing.value;save();used.textContent=S.supports.join(', ')||'Ninguno';answer.textContent=S.writing;page('done')}function record(x){if(!S.supports.includes(x))S.supports.push(x);save()}function openActivity(){modal.classList.add('on');document.body.style.overflow='hidden';page(S.current||'start')}function closeActivity(){modal.classList.remove('on');document.body.style.overflow=''}
function enhanceActivity(){S.mode=S.mode||'Individual';S.names=S.names||[];const start=document.getElementById('start'),actions=start.querySelector('.actions'),box=document.createElement('div');box.innerHTML='<div class="actions"><button class="secondary modepick" data-mode="Individual">Individual</button><button class="secondary modepick" data-mode="En pareja">En pareja</button></div><p><label>Estudiante 1 <input id="name1" style="width:100%;padding:10px;border:2px solid var(--line);border-radius:10px" value="'+(S.names[0]||'')+'"></label></p><p id="name2row" style="display:'+(S.mode==='En pareja'?'block':'none')+'"><label>Estudiante 2 <input id="name2" style="width:100%;padding:10px;border:2px solid var(--line);border-radius:10px" value="'+(S.names[1]||'')+'"></label></p>';start.insertBefore(box,actions);box.querySelectorAll('.modepick').forEach(b=>{b.classList.toggle('primary',b.dataset.mode===S.mode);b.onclick=()=>{S.mode=b.dataset.mode;document.getElementById('name2row').style.display=S.mode==='En pareja'?'block':'none';box.querySelectorAll('.modepick').forEach(x=>x.classList.toggle('primary',x===b));save()}});actions.querySelector('button').onclick=()=>{const a=name1.value.trim(),b=name2?.value.trim();if(!a||(S.mode==='En pareja'&&!b)){alert('Escribe el nombre de cada participante.');return}S.names=S.mode==='En pareja'?[a,b]:[a];save();page('white')};const evidence=document.createElement('div');evidence.className='page';evidence.id='evidence';evidence.innerHTML='<h2>Comprobante de aprendizaje</h2><div class="card"><p><b>Estudiante(s):</b> <span id="eNames"></span></p><p><b>Actividad:</b> '+D.code+'</p><p><b>Apoyos utilizados:</b> <span id="eSupports"></span></p><p><b>Respuesta final:</b></p><p id="eAnswer"></p><p><b>Código:</b> <span id="eCode"></span></p></div><div class="actions"><button class="primary" onclick="downloadEvidence()">Descargar evidencia PNG</button><a class="primary" id="formLink" target="_blank" rel="noopener" style="text-decoration:none">Abrir formulario prellenado</a><button class="secondary" onclick="closeActivity();goClosure()">Pasar al cierre</button></div>';pagesEl.appendChild(evidence)}
function finishActivity(){const c=checks(),miss=Object.values(c).filter(x=>!x).length;if(miss){greenFb.className='fb show bad';greenFb.textContent='Todavía faltan '+miss+' criterio(s). Revisa los indicadores.';return}S.writing=writing.value;S.finalCode=S.finalCode||'3M-'+Date.now().toString(36).slice(-6).toUpperCase();save();eNames.textContent=(S.names||[]).join(' y ');eSupports.textContent=S.supports.join(', ')||'Ninguno';eAnswer.textContent=S.writing;eCode.textContent=S.finalCode;const detail='Apoyos: '+(S.supports.join(', ')||'ninguno')+'. Orden: '+S.order.length+'/'+D.activity.order.length+'.';const p=new URLSearchParams({'usp':'pp_url','entry.1918313170':S.names?.[0]||'','entry.908926738':S.names?.[1]||'','entry.658722694':'3° Medio','entry.1593538729':'Filosofía + Educación Ciudadana','entry.362233009':D.code,'entry.1313710278':S.mode||'Individual','entry.1312041564':'Ruta común','entry.1095614607':detail,'entry.928022546':S.writing,'entry.299102895':S.finalCode});formLink.href='https://docs.google.com/forms/d/e/1FAIpQLSfrYGPyV9qZnORbwLMGn9Rp4pL14jJPQv9clVJzbTdjrr_OEQ/viewform?'+p;page('evidence')}
function downloadEvidence(){const c=document.createElement('canvas');c.width=1200;c.height=950;const x=c.getContext('2d');x.fillStyle='#f4f8fb';x.fillRect(0,0,1200,950);x.fillStyle='#092b63';x.fillRect(0,0,1200,150);x.fillStyle='white';x.font='bold 34px system-ui';x.fillText('COMPROBANTE DE APRENDIZAJE',55,62);x.font='bold 28px system-ui';x.fillText(D.title,55,110);x.fillStyle='#17324b';x.font='23px system-ui';let y=205;const lines=['Estudiante(s): '+(S.names||[]).join(' y '),'Curso: 3° Medio · Filosofía + Educación Ciudadana','Actividad: '+D.code,'Modalidad: '+(S.mode||'Individual'),'Apoyos: '+(S.supports.join(', ')||'ninguno'),'Respuesta final: '+S.writing,'Código: '+S.finalCode];for(const raw of lines){let line='';for(const w of raw.split(/s+/)){const test=line?line+' '+w:w;if(x.measureText(test).width>1080&&line){x.fillText(line,55,y);y+=34;line=w}else line=test}x.fillText(line,55,y);y+=48}const a=document.createElement('a');a.download=D.code+'_'+(S.names?.[0]||'estudiante').replace(/[^a-z0-9]+/gi,'-')+'.png';a.href=c.toDataURL('image/png');a.click()}
function bindClose(){document.querySelectorAll('.closeopts').forEach(box=>{const opts=[...box.querySelectorAll('button')],check=box.nextElementSibling,fb=check.nextElementSibling,a=+box.dataset.a;let sel=null;opts.forEach((o,j)=>o.onclick=()=>{sel=j;opts.forEach(x=>x.classList.remove('sel'));o.classList.add('sel')});check.onclick=()=>{if(sel===null)return;if(sel!==a){fb.className='fb show bad';fb.textContent='Revisa tu elección y vuelve a intentarlo.';return}opts.forEach((o,j)=>{o.disabled=true;if(j===a)o.classList.add('ok')});check.disabled=true;fb.className='fb show';fb.textContent='Correcto. Esta opción responde la pregunta y establece una relación clara.'}})}
const pagesEl=document.getElementById('pages');slides();pages();enhanceActivity();bindClose();show(0);
</script></body></html>
