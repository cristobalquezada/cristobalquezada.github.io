<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HIS-M21 · Mercado · Dos sesiones</title><style>*{box-sizing:border-box} :root{--purple:#643a91;--dark:#271c3b;--teal:#087f89;--line:#ddd7e7}body{margin:0;background:#f6f4f9;color:var(--dark);font-family:Inter,Arial,sans-serif}button,select,textarea{font:inherit}button,select,summary{cursor:pointer}button{border:1px solid var(--line);background:white;color:var(--dark);padding:12px 17px;border-radius:8px}button:hover,button[aria-current=true]{background:var(--purple);color:white}button:focus-visible,summary:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #11a9b5;outline-offset:3px}header{padding:15px 4vw;background:white;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px}header small{display:block;color:var(--teal);margin-top:4px}nav{display:flex;gap:8px;flex-wrap:wrap}.progress{height:4px;background:#e4dfee}.progress div{height:100%;background:linear-gradient(90deg,var(--purple),#13a9b3)}main{max-width:1240px;margin:auto;padding:40px 5vw 100px}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:13px;color:var(--teal);font-weight:bold}h1{font-size:clamp(32px,4vw,55px);line-height:1.1;letter-spacing:-.035em;margin:15px 0}h2{font-size:23px;color:var(--purple);font-weight:500;margin:0 0 30px}p,td,summary{font-size:clamp(18px,1.7vw,23px);line-height:1.55}.lead{font-size:clamp(24px,2.6vw,34px);line-height:1.4}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}article{background:white;padding:22px;border:1px solid var(--line);border-top:4px solid var(--teal);border-radius:12px}article h3{color:var(--purple);font-size:23px;margin:0}article p{margin-bottom:0}details{background:white;border:1px solid var(--line);border-radius:9px;margin:12px 0}summary{padding:17px 20px;color:var(--purple);font-weight:600}.answer{border-top:1px solid var(--line);padding:18px 22px;font-size:21px;line-height:1.55}table{width:100%;border-collapse:collapse;background:white}td,th{text-align:left;padding:15px;border-bottom:1px solid var(--line)}th{background:var(--purple);color:white;font-size:17px}td{font-size:20px}.scroll{overflow-x:auto}.note{font-size:16px;color:#625b6c;border-left:3px solid var(--teal);padding:10px 16px;background:#eeebf4}footer{position:fixed;bottom:0;width:100%;background:#ffffffee;border-top:1px solid var(--line);padding:10px 4vw;display:flex;justify-content:space-between;align-items:center;gap:12px;backdrop-filter:blur(8px)}#counter{font-size:14px}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center}select{padding:12px;border:1px solid var(--line);border-radius:8px}textarea{display:block;width:100%;min-height:110px;padding:14px;margin-top:10px;border:1px solid var(--line);border-radius:8px}label{display:block;margin-top:15px;color:var(--purple)}#chart{width:100%;max-height:370px;background:white;border-radius:10px;margin-top:14px}#result{min-height:60px;color:var(--teal)}dialog{border:1px solid var(--line);border-radius:14px;max-width:800px;width:90%;max-height:85vh}dialog::backdrop{background:#271c3b99}.indexlist{display:grid;gap:8px}.indexlist button{text-align:left}.ref{font-size:14px;color:#6e6477;margin-top:25px}@media(max-width:650px){header{align-items:flex-start;flex-direction:column}main{padding:25px 20px 110px}.grid{grid-template-columns:1fr}td{font-size:17px;padding:10px}footer button{padding:10px}footer #counter{max-width:100px}h2{font-size:20px}}@media print{header,footer,.progress{display:none}main{padding:0}details{break-inside:avoid} }.stack{display:grid;gap:12px;margin:22px 0}.block{background:#fff;border:1px solid #e1d9ec;border-left:5px solid #0c929b;border-radius:12px;padding:17px 22px}.block b{font-size:22px;color:#604086}.block p{margin:6px 0 0}.highlight{background:#eee8f6;border-left:5px solid #7546a0;border-radius:12px;padding:18px 22px;margin:22px 0}.highlight strong{color:#653a8c;text-transform:uppercase;font-size:14px;letter-spacing:.08em}.highlight p{margin:8px 0 0}.question{margin:25px 0;padding:18px 22px;border-radius:12px;background:#eaf7f6;border:1px solid #c5e9e7}.question>b{color:#087f89}.question>p{margin:7px 0}main{max-width:1250px}h1{max-width:1050px}main>p{max-width:1100px}</style><header><div><b>ECONOMÍA / HIS-M21</b><small>Institucionalidad democrática en Chile · Dos sesiones de 80 minutos</small></div><nav aria-label="Sesiones"><button data-session="1">Sesión 1</button><button data-session="2">Sesión 2</button><button id="index">Índice</button><button id="full" aria-label="Alternar pantalla completa">Pantalla completa</button></nav></header><div class="progress"><div id="bar"></div></div><main></main><footer><button id="prev">← Anterior</button><span id="counter" aria-live="polite"></span><button id="next">Siguiente →</button></footer><dialog aria-label="Índice de sesiones"><button id="close">Cerrar índice</button><h2>Elegir un tema</h2><div id="list" class="indexlist"></div></dialog><script>const slides=[{"session": 1, "title": "Clase 1 · Institucionalidad democrática en Chile", "sub": "Sesión 1 · Formación Ciudadana", "body": "<p class=\"lead\">En esta clase exploraremos una pregunta para entender mejor la vida en democracia.</p><div class=\"highlight\"><strong>Pregunta guía</strong><p>¿Cómo se organiza y controla el poder en Chile?</p></div>", "mins": 3, "ref": "pp. 3–12"}, {"session": 1, "title": "¿Qué aprenderemos hoy?", "sub": "Comprender, relacionar y aplicar", "body": "<p>Explicar los conceptos y situaciones de la guía, relacionándolos con ejemplos cercanos y preguntas de la PAES.</p><div class=\"highlight\"><strong>Pregunta guía</strong><p>¿Cómo se organiza y controla el poder en Chile?</p></div><p>Al finalizar, trabajaremos con los ejercicios de la guía y conversaremos sobre las alternativas.</p>", "mins": 3, "ref": "pp. 3–12"}, {"session": 1, "title": "Activemos ideas previas", "sub": "Pensemos en lo que ya sabemos", "body": "<div class=\"question\"><b>Para conversar</b><p>¿Qué entiendes por democracia y participación?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">La clase recupera distintas ideas y las relaciona con ejemplos y conceptos de la guía.</div></details></div><div class=\"question\"><b>Para conversar</b><p>¿Cómo podemos justificar una respuesta?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Identificando información relevante y explicando cómo se relaciona con el concepto.</div></details></div>", "mins": 4, "ref": ""}, {"session": 1, "title": "¿Qué son las instituciones democráticas?", "sub": "Reglas y organismos que organizan la vida pública", "body": "<p>Las instituciones democráticas establecen reglas y distribuyen funciones para que el poder no quede concentrado.</p><p>Incluyen organismos del Estado y también espacios de representación y organización social.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>El Congreso debate leyes y fiscaliza; otras instituciones cumplen tareas distintas.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Por qué distribuir funciones?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Para establecer controles y evitar que una sola autoridad concentre todo el poder.</div></details></div>", "mins": 5, "ref": "p. 3"}, {"session": 1, "title": "¿Qué son los pesos y contrapesos?", "sub": "Los órganos se controlan entre sí", "body": "<p>La separación de funciones busca que distintos órganos participen y se fiscalicen.</p><p>Ningún control es idéntico a otro: hay controles políticos, judiciales y de legalidad.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>La Cámara fiscaliza actos del Gobierno.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Control significa que todos hacen la misma tarea?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Cada órgano tiene atribuciones propias.</div></details></div>", "mins": 5, "ref": "pp. 3–5"}, {"session": 1, "title": "¿Qué hace el Poder Ejecutivo?", "sub": "Gobierna y administra el Estado", "body": "<p>El Presidente dirige el gobierno y la administración con la colaboración de ministros y otros órganos.</p><p>Sus decisiones deben respetar la Constitución y las leyes, y están sujetas a mecanismos de control.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Un ministerio implementa un programa público.</p></div><div class=\"question\"><b>Para conversar</b><p>¿El Ejecutivo puede actuar sin límites legales?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Debe actuar dentro de sus atribuciones y respetar las normas.</div></details></div>", "mins": 5, "ref": "pp. 5–6"}, {"session": 1, "title": "¿Qué hace el Congreso?", "sub": "Participa en las leyes y el control político", "body": "<p>El Congreso Nacional está integrado por la Cámara de Diputadas y Diputados y el Senado.</p><p>Interviene en la formación de leyes; además, la Cámara tiene atribuciones específicas para fiscalizar actos del Gobierno.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Se debate un proyecto de ley en las cámaras.</p></div><div class=\"question\"><b>Para conversar</b><p>¿El Congreso ejecuta por sí solo todas las políticas públicas?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Participa en las leyes y controles; la administración tiene otras funciones.</div></details></div>", "mins": 5, "ref": "pp. 6–7"}, {"session": 1, "title": "¿Qué hacen los tribunales?", "sub": "Resuelven conflictos aplicando el derecho", "body": "<p>Los tribunales conocen causas y resuelven conflictos mediante procedimientos establecidos.</p><p>La independencia judicial busca que sus decisiones no dependan de presiones indebidas de otros poderes.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Dos personas llevan un conflicto civil ante un tribunal.</p></div><div class=\"question\"><b>Para conversar</b><p>¿El Gobierno debe decidir cómo falla el juez?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. El juez debe resolver conforme al derecho y sin presiones indebidas.</div></details></div>", "mins": 5, "ref": "pp. 7–8"}, {"session": 1, "title": "¿Quién controla la legalidad?", "sub": "La Contraloría revisa actos de la administración", "body": "<p>La Contraloría General de la República es un órgano autónomo que cumple funciones de control de legalidad y fiscalización.</p><p>En determinadas actuaciones revisa decretos y puede representar su ilegalidad, según las reglas aplicables.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Un decreto se somete al control de legalidad que corresponda.</p></div><div class=\"question\"><b>Para conversar</b><p>¿La Contraloría es una cámara del Congreso?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Es un organismo autónomo con funciones propias.</div></details></div>", "mins": 5, "ref": "pp. 9–10"}, {"session": 1, "title": "¿Quién organiza elecciones?", "sub": "El Servel cumple funciones electorales", "body": "<p>El Servicio Electoral administra y fiscaliza procesos electorales y otras materias establecidas por la ley.</p><p>Las elecciones requieren reglas, registros, candidaturas y mecanismos que permitan confiar en el proceso.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>El Servel coordina tareas vinculadas con una elección.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Es lo mismo organizar una elección que ser candidato?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Una institución administra el proceso; las candidaturas compiten en él.</div></details></div>", "mins": 5, "ref": "pp. 10 y 20"}, {"session": 1, "title": "¿Cómo se forma una ley?", "sub": "Una propuesta pasa por distintas etapas", "body": "<p>Un proyecto puede ingresar por mensaje presidencial o por moción parlamentaria, según las reglas y materias aplicables.</p><p>El Congreso debate el texto; el procedimiento también incluye la participación del Ejecutivo y etapas posteriores para su entrada en vigor.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una propuesta se discute en las cámaras.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Toda propuesta se convierte automáticamente en ley?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Debe completar el procedimiento correspondiente.</div></details></div>", "mins": 5, "ref": "pp. 11–12"}, {"session": 1, "title": "¿Qué organizaciones representan a las personas?", "sub": "Sociedad civil y sindicatos", "body": "<p>Las personas también participan en organizaciones de la sociedad civil, como juntas de vecinos y sindicatos.</p><p>La afiliación sindical es voluntaria y no depende de una autorización previa del empleador.</p><div class=\"question\"><b>Para conversar</b><p>¿Una persona debe militar en un partido para participar?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Puede integrarse a distintas organizaciones sociales.</div></details></div>", "mins": 4, "ref": "pp. 12 y 20–22"}, {"session": 1, "title": "¿Qué es la probidad pública?", "sub": "El interés general debe orientar las decisiones", "body": "<p>La probidad exige una actuación honesta y el predominio del interés general en la función pública.</p><div class=\"question\"><b>Para conversar</b><p>¿Por qué ayuda a la democracia?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Porque establece un estándar exigible a quienes ejercen funciones públicas.</div></details></div>", "mins": 4, "ref": "pp. 23–24"}, {"session": 1, "title": "Practiquemos con la guía", "sub": "Preguntas 1, 2, 3, 8, 9", "body": "<p>Resuelve primero en la guía. Luego explica tu alternativa y compara con la revisión.</p><details><summary>Pregunta 1 · Organizaciones sociales</summary><div class=\"answer\"><b>Respuesta: D.</b> Participar en organizaciones de la sociedad civil es una vía de intervención pública.<p><b>Para descartar:</b> No exige militar en un partido ni obtener un cargo.</p></div></details><details><summary>Pregunta 2 · Sindicatos</summary><div class=\"answer\"><b>Respuesta: A.</b> La afiliación es voluntaria.<p><b>Para descartar:</b> La organización no requiere autorización previa del empleador.</p></div></details><details><summary>Pregunta 3 · Dos cámaras y control</summary><div class=\"answer\"><b>Respuesta: A.</b> Distribuir etapas entre ambas cámaras evita concentrar la decisión en una sola mayoría.<p><b>Para descartar:</b> La descripción no entrega la decisión a tribunales.</p></div></details><details><summary>Pregunta 8 · Probidad</summary><div class=\"answer\"><b>Respuesta: D.</b> La norma fija un estándar exigible para quienes ejercen funciones públicas.<p><b>Para descartar:</b> El fragmento no define una evaluación técnica de políticas.</p></div></details><details><summary>Pregunta 9 · Contraloría y Cámara</summary><div class=\"answer\"><b>Respuesta: B.</b> Enviar copia permite que la Cámara ejerza el control político que corresponda.<p><b>Para descartar:</b> La copia no suspende automáticamente el decreto.</p></div></details><label>Mis apuntes<textarea data-note=\"s1\" placeholder=\"¿Qué entendí? ¿Qué necesito repasar?\"></textarea></label>", "mins": 17, "ref": "pp. 28–31"}, {"session": 1, "title": "Cerremos la clase", "sub": "Volvamos a la pregunta guía", "body": "<div class=\"question\"><b>Para conversar</b><p>¿Cómo se organiza y controla el poder en Chile?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">El poder se distribuye entre órganos con funciones y controles diferentes, sujetos a la Constitución y la ley.</div></details></div><div class=\"question\"><b>Para conversar</b><p>¿Cómo abordar una pregunta PAES?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Identifico qué se pregunta, busco el dato clave y comparo las alternativas antes de decidir.</div></details></div>", "mins": 5, "ref": ""}, {"session": 2, "title": "Clase 2 · Institucionalidad democrática en Chile", "sub": "Sesión 2 · Formación Ciudadana", "body": "<p class=\"lead\">En esta clase exploraremos una pregunta para entender mejor la vida en democracia.</p><div class=\"highlight\"><strong>Pregunta guía</strong><p>¿Cómo se representa y participa la ciudadanía?</p></div>", "mins": 3, "ref": "pp. 12–24"}, {"session": 2, "title": "¿Qué aprenderemos hoy?", "sub": "Comprender, relacionar y aplicar", "body": "<p>Explicar los conceptos y situaciones de la guía, relacionándolos con ejemplos cercanos y preguntas de la PAES.</p><div class=\"highlight\"><strong>Pregunta guía</strong><p>¿Cómo se representa y participa la ciudadanía?</p></div><p>Al finalizar, trabajaremos con los ejercicios de la guía y conversaremos sobre las alternativas.</p>", "mins": 3, "ref": "pp. 12–24"}, {"session": 2, "title": "Activemos ideas previas", "sub": "Pensemos en lo que ya sabemos", "body": "<div class=\"question\"><b>Para conversar</b><p>¿Qué idea de la clase anterior recuerdas?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">La clase recupera distintas ideas y las relaciona con ejemplos y conceptos de la guía.</div></details></div><div class=\"question\"><b>Para conversar</b><p>¿Cómo podemos justificar una respuesta?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Identificando información relevante y explicando cómo se relaciona con el concepto.</div></details></div>", "mins": 4, "ref": ""}, {"session": 2, "title": "¿Qué es la sociedad civil?", "sub": "Personas que se organizan para actuar", "body": "<p>La sociedad civil reúne organizaciones y asociaciones donde las personas se coordinan en torno a intereses o causas.</p><p>No se reduce a partidos políticos ni a instituciones del gobierno. Sus organizaciones pueden dialogar con el Estado y también criticarlo.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una agrupación barrial propone mejoras en una plaza.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Una junta de vecinos es un ministerio?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Es una organización de la sociedad civil.</div></details></div>", "mins": 5, "ref": "pp. 12–13"}, {"session": 2, "title": "¿Para qué sirven los partidos?", "sub": "Conectan ideas, propuestas y representación", "body": "<p>Los partidos políticos agrupan personas en torno a ideas y propuestas y participan en la formación de la voluntad popular.</p><p>Pueden presentar candidaturas conforme a la ley, pero no sustituyen todas las formas de participación social.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una organización política presenta un programa y candidaturas.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Ser militante garantiza un cargo público?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Los cargos se ocupan según los procedimientos que correspondan.</div></details></div>", "mins": 5, "ref": "pp. 13–14"}, {"session": 2, "title": "¿Qué distingue al sufragio?", "sub": "Una forma regulada de participación", "body": "<p>El sufragio permite expresar una preferencia electoral mediante reglas establecidas para cada proceso.</p><p>No es la única forma de participación: una movilización o una asamblea siguen lógicas diferentes.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una elección tiene fechas y procedimientos previstos por la legislación.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Qué la distingue de una convocatoria espontánea?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Su organización y regulación mediante normas electorales.</div></details></div>", "mins": 5, "ref": "pp. 14–18"}, {"session": 2, "title": "¿Cómo cambian las reglas del voto?", "sub": "Identificar cambios y continuidades", "body": "<p>Para analizar una línea de tiempo electoral conviene distinguir qué cambió y qué se mantuvo.</p><p>Una reforma puede modificar la inscripción o la obligatoriedad sin cambiar todas las características del voto.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>La guía compara reglas de 1980, 2012, 2023 y 2025.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Cambiar de voto voluntario a obligatorio elimina el carácter secreto?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Son características distintas; la guía identifica la continuidad del secreto.</div></details></div>", "mins": 5, "ref": "pp. 14–17 y 29"}, {"session": 2, "title": "¿Qué es la mayoría relativa?", "sub": "Gana quien obtiene más votos que las demás candidaturas", "body": "<p>En una elección por mayoría relativa, resulta electa la candidatura que obtiene más votos que cada competidora.</p><p>Eso no exige necesariamente superar la mitad de todos los votos válidamente emitidos.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una candidatura obtiene 40 %, otra 35 % y otra 25 %.</p></div><div class=\"question\"><b>Para conversar</b><p>¿La primera obtuvo mayoría absoluta?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Obtuvo la primera mayoría, pero no más de 50 %.</div></details></div>", "mins": 5, "ref": "pp. 18–19"}, {"session": 2, "title": "¿Cómo se reparten escaños?", "sub": "El método D’Hondt compara cocientes", "body": "<p>El sistema proporcional de la guía usa cocientes obtenidos al dividir los votos de cada lista por 1, 2, 3 y sucesivos números.</p><p>Se asignan los escaños a los cocientes más altos hasta completar los cargos en disputa.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Con cuatro escaños, los mayores cocientes del ejemplo son 41.000, 29.000, 20.500 y 20.000.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Cuántos escaños obtiene la primera lista?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Dos: sus cocientes 41.000 y 20.500 están entre los cuatro mayores.</div></details></div>", "mins": 5, "ref": "pp. 19–20 y 31"}, {"session": 2, "title": "¿Qué hacen sindicatos y juntas de vecinos?", "sub": "Representan intereses colectivos", "body": "<p>Los sindicatos se organizan en el ámbito laboral; las juntas de vecinos representan intereses de sus comunidades territoriales.</p><p>La afiliación sindical es voluntaria y su constitución no requiere autorización previa del empleador.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Trabajadores se organizan para plantear condiciones laborales comunes.</p></div><div class=\"question\"><b>Para conversar</b><p>¿El empleador elige si pueden formar sindicato?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. La libertad sindical protege su organización dentro de la ley.</div></details></div>", "mins": 5, "ref": "pp. 20–22"}, {"session": 2, "title": "¿Qué es la probidad?", "sub": "La función pública debe priorizar el interés general", "body": "<p>La probidad exige un desempeño honesto y el predominio del interés general sobre intereses particulares.</p><p>La transparencia, la fiscalización y la prevención de conflictos de intereses contribuyen a controlar el ejercicio del poder.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una autoridad declara un interés personal que podría afectar una decisión.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Por qué importa identificar conflictos de intereses?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Porque ayuda a prevenir decisiones públicas influenciadas indebidamente.</div></details></div>", "mins": 5, "ref": "pp. 23–24"}, {"session": 2, "title": "Practiquemos con la guía", "sub": "Preguntas 4, 5, 6, 7, 10", "body": "<p>Resuelve primero en la guía. Luego explica tu alternativa y compara con la revisión.</p><details><summary>Pregunta 4 · Sufragio</summary><div class=\"answer\"><b>Respuesta: C.</b> El sufragio se organiza mediante normas electorales.<p><b>Para descartar:</b> No se define como una movilización espontánea.</p></div></details><details><summary>Pregunta 5 · Continuidad del voto</summary><div class=\"answer\"><b>Respuesta: A.</b> La tabla mantiene el carácter secreto del sufragio.<p><b>Para descartar:</b> La obligatoriedad y la inscripción cambiaron.</p></div></details><details><summary>Pregunta 6 · Partidos políticos</summary><div class=\"answer\"><b>Respuesta: B.</b> Los partidos contribuyen a formar la voluntad popular.<p><b>Para descartar:</b> No garantizan empleo público a sus militantes.</p></div></details><details><summary>Pregunta 7 · Mayoría relativa</summary><div class=\"answer\"><b>Respuesta: C.</b> La ciudadanía elige directamente a la autoridad comunal.<p><b>Para descartar:</b> Obtener más votos que los demás no exige mayoría absoluta.</p></div></details><details><summary>Pregunta 10 · Método D’Hondt</summary><div class=\"answer\"><b>Respuesta: C.</b> La lista 1 obtiene dos escaños: 41.000 y 20.500 están entre los cuatro cocientes mayores.<p><b>Para descartar:</b> La lista 3 obtiene un escaño con 20.000; la lista 4 queda fuera.</p></div></details><label>Mis apuntes<textarea data-note=\"s2\" placeholder=\"¿Qué entendí? ¿Qué necesito repasar?\"></textarea></label>", "mins": 25, "ref": "pp. 28–31"}, {"session": 2, "title": "Cerremos la clase", "sub": "Volvamos a la pregunta guía", "body": "<div class=\"question\"><b>Para conversar</b><p>¿Cómo se representa y participa la ciudadanía?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">La ciudadanía puede votar, organizarse y participar mediante partidos, sindicatos, juntas de vecinos y otras asociaciones.</div></details></div><div class=\"question\"><b>Para conversar</b><p>¿Cómo abordar una pregunta PAES?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Identifico qué se pregunta, busco el dato clave y comparo las alternativas antes de decidir.</div></details></div>", "mins": 5, "ref": ""}];let pos=0;const main=document.querySelector('main');function show(i){pos=Math.max(0,Math.min(slides.length-1,i));const s=slides[pos];main.innerHTML=`<div class="eyebrow">HIS-M21 / Sesión ${s.session} / ${s.mins} min orientativos</div><h1>${s.title}</h1><h2>${s.sub}</h2>${s.body}<p class="ref">Base: guía HIS-M21, Institucionalidad democrática en Chile. ${s.ref}</p>`;document.querySelector('#counter').textContent=`${pos+1} / ${slides.length} · Sesión ${s.session}`;document.querySelector('#bar').style.width=((pos+1)/slides.length*100)+'%';document.querySelector('#prev').disabled=pos===0;document.querySelector('#next').disabled=pos===slides.length-1;document.querySelectorAll('[data-session]').forEach(b=>b.setAttribute('aria-current',Number(b.dataset.session)===s.session));document.querySelectorAll('textarea').forEach(t=>{try{t.value=localStorage.getItem('m21-'+t.dataset.note)||''}catch{}t.oninput=()=>{try{localStorage.setItem('m21-'+t.dataset.note,t.value)}catch{}}});if(document.querySelector('#chart')){draw(false);document.querySelector('#scenario').onchange=()=>draw(false);document.querySelector('#predict').onclick=()=>draw(true)}window.scrollTo(0,0)}function draw(reveal){const v=document.querySelector('#scenario').value;let d=100,o=20;if(v==='dplus')d=124;if(v==='dminus')d=76;if(v==='splus')o=-4;if(v==='sminus')o=44;const p=(d+o)/2,q=(d-o)/2;let x=q=>70+q*4.4,y=p=>315-p*2.1;const line=(q1,p1,q2,p2,color,dash='')=>`<line x1="${x(q1)}" y1="${y(p1)}" x2="${x(q2)}" y2="${y(p2)}" stroke="${color}" stroke-width="3" stroke-dasharray="${dash}"/>`;let out=`<path d="M70 20V315H640" stroke="#675c75" fill="none"/><text x="22" y="24">P</text><text x="640" y="342">Q</text>`;out+=line(0,100,95,5,'#c9bbd8','6 5')+line(0,20,95,115,'#a9d7d9','6 5');out+=line(Math.max(0,d-135),Math.min(d,135),Math.min(d,100),Math.max(0,d-100),'#643a91')+line(Math.max(0,-o),Math.max(0,o),Math.min(100,135-o),Math.min(135,o+100),'#087f89');out+='<text x="525" y="295" fill="#643a91">D</text><text x="505" y="35" fill="#087f89">O</text>';if(reveal){out+=`<circle cx="${x(q)}" cy="${y(p)}" r="7" fill="#271c3b"/><path d="M70 ${y(p)}H${x(q)}V315" stroke="#665878" stroke-dasharray="4 4" fill="none"/><text x="10" y="${y(p)+6}">${p}</text><text x="${x(q)-8}" y="342">${q}</text>`}document.querySelector('#chart').innerHTML=out;document.querySelector('#result').textContent=reveal?`Equilibrio: P = ${p}; Q = ${q}. ${({base:'Inicial: P = 60; Q = 40.',dplus:'Mayor demanda: suben precio y cantidad.',dminus:'Menor demanda: bajan precio y cantidad.',splus:'Mayor oferta: baja precio y sube cantidad.',sminus:'Menor oferta: sube precio y baja cantidad.'})[v]} Líneas discontinuas: curvas iniciales.`:'Antes de mostrar el resultado, piensa qué pasa con el precio y la cantidad. Las líneas punteadas muestran la situación inicial.'}document.querySelector('#prev').onclick=()=>show(pos-1);document.querySelector('#next').onclick=()=>show(pos+1);document.querySelectorAll('[data-session]').forEach(b=>b.onclick=()=>show(slides.findIndex(s=>s.session==b.dataset.session)));const dlg=document.querySelector('dialog');document.querySelector('#index').onclick=()=>dlg.showModal();document.querySelector('#close').onclick=()=>dlg.close();document.querySelector('#list').innerHTML=slides.map((s,i)=>`<button data-i="${i}">S${s.session} · ${s.title} <small>(${s.mins} min)</small></button>`).join('');document.querySelector('#list').onclick=e=>{const b=e.target.closest('[data-i]');if(b){show(+b.dataset.i);dlg.close()}};document.querySelector('#full').onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>{})}else document.exitFullscreen?.()};document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT','SUMMARY','BUTTON'].includes(e.target.tagName)||dlg.open)return;if(e.key==='ArrowRight'){e.preventDefault();show(pos+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(pos-1)}});show(0);</script></html>
