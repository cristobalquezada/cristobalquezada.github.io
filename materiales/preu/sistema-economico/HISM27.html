<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HIS-M27 · Mercado · Dos sesiones</title><style>*{box-sizing:border-box} :root{--purple:#643a91;--dark:#271c3b;--teal:#087f89;--line:#ddd7e7}body{margin:0;background:#f6f4f9;color:var(--dark);font-family:Inter,Arial,sans-serif}button,select,textarea{font:inherit}button,select,summary{cursor:pointer}button{border:1px solid var(--line);background:white;color:var(--dark);padding:12px 17px;border-radius:8px}button:hover,button[aria-current=true]{background:var(--purple);color:white}button:focus-visible,summary:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #11a9b5;outline-offset:3px}header{padding:15px 4vw;background:white;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px}header small{display:block;color:var(--teal);margin-top:4px}nav{display:flex;gap:8px;flex-wrap:wrap}.progress{height:4px;background:#e4dfee}.progress div{height:100%;background:linear-gradient(90deg,var(--purple),#13a9b3)}main{max-width:1240px;margin:auto;padding:40px 5vw 100px}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:13px;color:var(--teal);font-weight:bold}h1{font-size:clamp(32px,4vw,55px);line-height:1.1;letter-spacing:-.035em;margin:15px 0}h2{font-size:23px;color:var(--purple);font-weight:500;margin:0 0 30px}p,td,summary{font-size:clamp(18px,1.7vw,23px);line-height:1.55}.lead{font-size:clamp(24px,2.6vw,34px);line-height:1.4}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}article{background:white;padding:22px;border:1px solid var(--line);border-top:4px solid var(--teal);border-radius:12px}article h3{color:var(--purple);font-size:23px;margin:0}article p{margin-bottom:0}details{background:white;border:1px solid var(--line);border-radius:9px;margin:12px 0}summary{padding:17px 20px;color:var(--purple);font-weight:600}.answer{border-top:1px solid var(--line);padding:18px 22px;font-size:21px;line-height:1.55}table{width:100%;border-collapse:collapse;background:white}td,th{text-align:left;padding:15px;border-bottom:1px solid var(--line)}th{background:var(--purple);color:white;font-size:17px}td{font-size:20px}.scroll{overflow-x:auto}.note{font-size:16px;color:#625b6c;border-left:3px solid var(--teal);padding:10px 16px;background:#eeebf4}footer{position:fixed;bottom:0;width:100%;background:#ffffffee;border-top:1px solid var(--line);padding:10px 4vw;display:flex;justify-content:space-between;align-items:center;gap:12px;backdrop-filter:blur(8px)}#counter{font-size:14px}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center}select{padding:12px;border:1px solid var(--line);border-radius:8px}textarea{display:block;width:100%;min-height:110px;padding:14px;margin-top:10px;border:1px solid var(--line);border-radius:8px}label{display:block;margin-top:15px;color:var(--purple)}#chart{width:100%;max-height:370px;background:white;border-radius:10px;margin-top:14px}#result{min-height:60px;color:var(--teal)}dialog{border:1px solid var(--line);border-radius:14px;max-width:800px;width:90%;max-height:85vh}dialog::backdrop{background:#271c3b99}.indexlist{display:grid;gap:8px}.indexlist button{text-align:left}.ref{font-size:14px;color:#6e6477;margin-top:25px}@media(max-width:650px){header{align-items:flex-start;flex-direction:column}main{padding:25px 20px 110px}.grid{grid-template-columns:1fr}td{font-size:17px;padding:10px}footer button{padding:10px}footer #counter{max-width:100px}h2{font-size:20px}}@media print{header,footer,.progress{display:none}main{padding:0}details{break-inside:avoid} }.stack{display:grid;gap:12px;margin:22px 0}.block{background:#fff;border:1px solid #e1d9ec;border-left:5px solid #0c929b;border-radius:12px;padding:17px 22px}.block b{font-size:22px;color:#604086}.block p{margin:6px 0 0}.highlight{background:#eee8f6;border-left:5px solid #7546a0;border-radius:12px;padding:18px 22px;margin:22px 0}.highlight strong{color:#653a8c;text-transform:uppercase;font-size:14px;letter-spacing:.08em}.highlight p{margin:8px 0 0}.question{margin:25px 0;padding:18px 22px;border-radius:12px;background:#eaf7f6;border:1px solid #c5e9e7}.question>b{color:#087f89}.question>p{margin:7px 0}main{max-width:1250px}h1{max-width:1050px}main>p{max-width:1100px}</style><header><div><b>ECONOMÍA / HIS-M27</b><small>Derechos laborales · Dos sesiones de 80 minutos</small></div><nav aria-label="Sesiones"><button data-session="1">Sesión 1</button><button data-session="2">Sesión 2</button><button id="index">Índice</button><button id="full" aria-label="Alternar pantalla completa">Pantalla completa</button></nav></header><div class="progress"><div id="bar"></div></div><main></main><footer><button id="prev">← Anterior</button><span id="counter" aria-live="polite"></span><button id="next">Siguiente →</button></footer><dialog aria-label="Índice de sesiones"><button id="close">Cerrar índice</button><h2>Elegir un tema</h2><div id="list" class="indexlist"></div></dialog><script>const slides=[{"session": 1, "title": "Clase 1 · Derechos laborales", "sub": "¿Por qué existen derechos para quienes trabajan?", "body": "<p class=\"lead\">Cuando una persona trabaja, tiene derechos y responsabilidades. Conocerlos ayuda a reconocer situaciones de abuso y a proteger la dignidad.</p><div class=\"highlight\"><strong>Pregunta guía</strong><p>¿Por qué existen derechos para quienes trabajan?</p></div>", "mins": 3, "ref": "pp. 3–10"}, {"session": 1, "title": "¿Qué aprenderemos hoy?", "sub": "Nuestro propósito", "body": "<div class=\"stack\"><div class=\"block\"><b>Objetivo</b><p>Explicar derechos laborales a partir de situaciones cercanas y preguntas de la guía.</p></div><div class=\"block\"><b>Pregunta guía</b><p>¿Por qué existen derechos para quienes trabajan?</p></div><div class=\"block\"><b>Al finalizar</b><p>Resolveremos preguntas de la guía y revisaremos cómo elegir y justificar una respuesta.</p></div></div>", "mins": 3, "ref": "pp. 3–10"}, {"session": 1, "title": "Activemos ideas previas", "sub": "Pensemos en situaciones laborales", "body": "<div class=\"question\"><b>Para conversar</b><p>¿Por qué un contrato de trabajo necesita reglas?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Para dar claridad sobre las obligaciones de ambas partes y establecer condiciones de protección.</div></details></div><div class=\"question\"><b>Para conversar</b><p>¿Una persona pierde sus derechos fundamentales al entrar a trabajar?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Sigue siendo titular de derechos como la dignidad y la no discriminación.</div></details></div>", "mins": 4, "ref": ""}, {"session": 1, "title": "¿Qué son los derechos laborales?", "sub": "Protegen la dignidad en el trabajo", "body": "<p>Son normas y principios que regulan la relación entre trabajadores y empleadores.</p><p>Buscan condiciones justas y seguras, límites a los abusos y protección de los derechos fundamentales.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una persona tiene derecho al descanso y a que se respeten las condiciones que establece la ley.</p></div><div class=\"question\"><b>Para conversar</b><p>¿La facultad del empleador para organizar el trabajo es ilimitada?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Debe respetar la ley y los derechos fundamentales de quienes trabajan.</div></details></div>", "mins": 5, "ref": "p. 3"}, {"session": 1, "title": "¿Cómo surgieron estos derechos?", "sub": "Son resultado de procesos históricos", "body": "<p>Durante la industrialización, muchas personas enfrentaron jornadas extensas y condiciones peligrosas.</p><p>Las organizaciones de trabajadores reclamaron mejoras. Con el tiempo surgieron leyes e instituciones de protección laboral.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>La demanda por reducir la jornada buscaba proteger el tiempo y la salud de trabajadores y familias.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Los derechos laborales surgieron de un solo acontecimiento?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Se fueron construyendo mediante conflictos, organización, acuerdos y cambios legales.</div></details></div>", "mins": 5, "ref": "pp. 4–5"}, {"session": 1, "title": "¿Qué es la OIT?", "sub": "Relaciona trabajo digno y justicia social", "body": "<p>La Organización Internacional del Trabajo (OIT) reúne a representantes de gobiernos, empleadores y trabajadores.</p><p>La fuente de la guía vincula condiciones laborales humanas y justicia social con la paz.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Si un país mantiene condiciones de trabajo muy precarias, puede afectar los esfuerzos de otros por mejorarlas.</p></div><div class=\"question\"><b>Para conversar</b><p>¿La fuente dice que primero debe existir paz y solo después mejorar el trabajo?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Plantea que la paz duradera se basa en la justicia social y en mejores condiciones de trabajo.</div></details></div>", "mins": 5, "ref": "pp. 4–5 y 21"}, {"session": 1, "title": "¿Qué caracteriza una relación laboral?", "sub": "Trabajo, remuneración y subordinación", "body": "<p>En una relación laboral, una persona presta servicios personales a otra y recibe una remuneración.</p><p>Un elemento central es la <b>subordinación y dependencia</b>: el empleador puede dirigir y supervisar el trabajo dentro de los límites legales.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una trabajadora cumple turnos, recibe instrucciones y obtiene un sueldo.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Un contrato es solo el papel firmado?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">La relación efectiva importa: el contrato de trabajo existe cuando se cumplen sus elementos, aunque su escrituración sea una obligación.</div></details></div>", "mins": 5, "ref": "pp. 6–7"}, {"session": 1, "title": "¿Se puede renunciar a cualquier derecho?", "sub": "Algunos derechos no pueden dejarse de lado", "body": "<p>La <b>irrenunciabilidad</b> significa que, mientras está vigente la relación laboral, el trabajador no puede renunciar a derechos que la ley protege.</p><p>Por eso, una cláusula no basta para eliminar un derecho legal, aunque haya sido firmada.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Un contrato propone cambiar el feriado anual por un bono durante la relación laboral.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Basta con la firma para que esa cláusula sea válida?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. El ejercicio plantea que es ineficaz por la irrenunciabilidad de los derechos laborales.</div></details></div>", "mins": 5, "ref": "pp. 3 y 21"}, {"session": 1, "title": "¿Qué protege la Ley Karin?", "sub": "Prevenir e investigar el acoso y la violencia", "body": "<p>La Ley Karin aborda la prevención, investigación y sanción del acoso laboral, el acoso sexual y la violencia en el trabajo.</p><p>La violencia puede provenir de personas externas a la relación laboral, como clientes o usuarios.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una cajera recibe amenazas e insultos de un cliente mientras atiende.</p></div><div class=\"question\"><b>Para conversar</b><p>¿La situación es ajena al mundo laboral por venir de un cliente?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. El ejercicio la presenta como violencia en el trabajo ejercida por un tercero.</div></details></div>", "mins": 5, "ref": "pp. 3 y 20"}, {"session": 1, "title": "¿Qué es la tutela laboral?", "sub": "Un mecanismo de protección ante vulneraciones", "body": "<p>La tutela laboral es un procedimiento judicial para proteger derechos fundamentales que pueden verse afectados en la relación laboral.</p><p>Su aplicación requiere examinar los hechos concretos y la situación de la persona.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una trabajadora es despedida poco después de declarar como testigo en una causa contra su empleador.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Qué mecanismo menciona la guía para reclamar?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">El procedimiento de tutela laboral ante un juzgado del trabajo.</div></details></div>", "mins": 5, "ref": "pp. 3 y 20"}, {"session": 1, "title": "¿Por qué son derechos humanos?", "sub": "La persona conserva su dignidad en el trabajo", "body": "<p>Los derechos humanos reconocen la dignidad de todas las personas. Los derechos laborales contribuyen a protegerla en el trabajo.</p><p>Incluyen principios como la igualdad de trato y la protección frente a discriminación.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una norma busca mejorar las oportunidades de empleo para personas con discapacidad.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Qué principio resguarda esa medida?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">La igualdad de oportunidades en el empleo.</div></details></div>", "mins": 5, "ref": "pp. 10–11"}, {"session": 1, "title": "Practiquemos con la guía", "sub": "Preguntas 1, 2, 3, 4, 6", "body": "<p>Resuelve las preguntas en tu guía. Luego explica tu elección y revisa las respuestas cuando corresponda.</p><details><summary>Pregunta 1 · Reducción de la jornada</summary><div class=\"answer\"><b>Respuesta: A.</b> El texto señala que la reducción no puede significar una baja de remuneraciones para los beneficiados.<p><b>Para descartar:</b> El fragmento indica aplicación gradual, no una reducción inmediata para todos.</p></div></details><details><summary>Pregunta 2 · Despido tras declarar</summary><div class=\"answer\"><b>Respuesta: C.</b> El caso apunta a la tutela laboral ante un juzgado del trabajo.<p><b>Para descartar:</b> El Consejo Superior Laboral no sustituye al tribunal en este procedimiento.</p></div></details><details><summary>Pregunta 3 · Amenazas de un cliente</summary><div class=\"answer\"><b>Respuesta: B.</b> La guía lo clasifica como violencia en el trabajo ejercida por un tercero.<p><b>Para descartar:</b> No queda fuera de la protección solo porque el agresor sea cliente.</p></div></details><details><summary>Pregunta 4 · Feriado a cambio de bono</summary><div class=\"answer\"><b>Respuesta: D.</b> Durante la relación laboral no se puede renunciar a ese derecho por una cláusula contractual.<p><b>Para descartar:</b> La firma o un bono no vuelven eficaz la renuncia descrita.</p></div></details><details><summary>Pregunta 6 · OIT y paz</summary><div class=\"answer\"><b>Respuesta: A.</b> La fuente relaciona paz duradera con justicia social y condiciones de trabajo humanas en distintos países.<p><b>Para descartar:</b> El texto no exige salarios idénticos en todos los países.</p></div></details><label>Mis apuntes<textarea data-note=\"s1\" placeholder=\"¿Qué entendí? ¿Qué necesito repasar?\"></textarea></label>", "mins": 25, "ref": "pp. 20–21"}, {"session": 1, "title": "Cerremos la clase", "sub": "Volvamos a la pregunta guía", "body": "<div class=\"question\"><b>Para conversar</b><p>¿Por qué existen derechos para quienes trabajan?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Para proteger la dignidad, establecer condiciones justas y equilibrar una relación en que el empleador tiene facultades de dirección.</div></details></div><div class=\"question\"><b>Para conversar</b><p>¿Cómo enfrento una pregunta PAES?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Identifico qué pregunta la consigna, busco los datos clave y comparo las alternativas con la información disponible.</div></details></div>", "mins": 5, "ref": ""}, {"session": 2, "title": "Clase 2 · Organización y trabajo actual", "sub": "¿Cómo se defienden los derechos en un mundo laboral que cambia?", "body": "<p class=\"lead\">Las personas pueden organizarse, negociar y acudir a instituciones. Al mismo tiempo, el teletrabajo y las plataformas plantean nuevos desafíos.</p><div class=\"highlight\"><strong>Pregunta guía</strong><p>¿Cómo se defienden los derechos en un mundo laboral que cambia?</p></div>", "mins": 3, "ref": "pp. 7–14"}, {"session": 2, "title": "¿Qué aprenderemos hoy?", "sub": "Nuestro propósito", "body": "<div class=\"stack\"><div class=\"block\"><b>Objetivo</b><p>Explicar organización y trabajo actual a partir de situaciones cercanas y preguntas de la guía.</p></div><div class=\"block\"><b>Pregunta guía</b><p>¿Cómo se defienden los derechos en un mundo laboral que cambia?</p></div><div class=\"block\"><b>Al finalizar</b><p>Resolveremos preguntas de la guía y revisaremos cómo elegir y justificar una respuesta.</p></div></div>", "mins": 3, "ref": "pp. 7–14"}, {"session": 2, "title": "Recordemos lo anterior", "sub": "Los derechos también se ejercen en el trabajo", "body": "<div class=\"question\"><b>Para conversar</b><p>¿Qué significa que un derecho sea irrenunciable durante el contrato?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Que el trabajador no puede dejarlo sin efecto por una renuncia o cláusula contraria a la ley.</div></details></div><div class=\"question\"><b>Para conversar</b><p>¿Qué protege la tutela laboral?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Derechos fundamentales que pueden verse afectados en la relación laboral.</div></details></div>", "mins": 4, "ref": ""}, {"session": 2, "title": "¿Para qué sirve un sindicato?", "sub": "Trabajadores que se organizan", "body": "<p>Un sindicato reúne a trabajadores para representar intereses comunes y promover sus derechos.</p><p>La libertad sindical incluye la posibilidad de formar organizaciones, afiliarse o no, y participar sin interferencias indebidas.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Un grupo se organiza para plantear inquietudes sobre horarios y seguridad.</p></div><div class=\"question\"><b>Para conversar</b><p>¿La organización sindical elimina los derechos individuales?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Los trabajadores mantienen sus derechos y pueden defender intereses de manera colectiva.</div></details></div>", "mins": 5, "ref": "pp. 7–8"}, {"session": 2, "title": "¿Qué es negociar colectivamente?", "sub": "Trabajadores y empleador dialogan sobre condiciones comunes", "body": "<p>La negociación colectiva es un procedimiento mediante el cual trabajadores organizados y empleador discuten condiciones de trabajo.</p><p>Puede dar lugar a un instrumento colectivo, que establece acuerdos aplicables a quienes corresponda.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Un sindicato negocia condiciones de remuneración y beneficios para un grupo de trabajadores.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Es igual a una conversación individual entre una persona y su jefe?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Aquí se negocian condiciones comunes mediante un procedimiento colectivo.</div></details></div>", "mins": 5, "ref": "pp. 8–9"}, {"session": 2, "title": "¿Qué es una huelga?", "sub": "Una acción colectiva regulada", "body": "<p>La huelga es una paralización colectiva que puede ejercerse dentro de la negociación colectiva, de acuerdo con las reglas legales.</p><p>La ley contempla límites en ciertas actividades y situaciones; no significa que toda empresa privada tenga prohibido recurrir a la huelga.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>La guía pregunta por una empresa sanitaria que presta un servicio de utilidad pública.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Toda empresa privada está impedida de tener una huelga?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. El ejercicio se refiere a un límite que puede afectar a empresas determinadas por la ley, no a todas las privadas.</div></details></div>", "mins": 5, "ref": "p. 9 y 23"}, {"session": 2, "title": "¿Quién fiscaliza el cumplimiento?", "sub": "La Dirección del Trabajo tiene funciones específicas", "body": "<p>La <b>Dirección del Trabajo</b> fiscaliza el cumplimiento de normas laborales e interpreta la legislación dentro de sus atribuciones.</p><p>Los tribunales laborales conocen y resuelven conflictos que se someten a la justicia.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una persona reclama por el incumplimiento de normas de seguridad en su lugar de trabajo.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Fiscalizar es lo mismo que dictar una sentencia judicial?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Una institución puede fiscalizar; los tribunales resuelven los casos judiciales que les corresponden.</div></details></div>", "mins": 5, "ref": "pp. 11–12"}, {"session": 2, "title": "¿Qué pasa en la subcontratación?", "sub": "Participan una empresa principal y una contratista", "body": "<p>Una empresa contratista emplea a trabajadores que prestan servicios para otra empresa, llamada principal.</p><p>La ley establece responsabilidades para proteger a los trabajadores, que dependen de las condiciones específicas del caso.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una empresa de aseo contratista trabaja en una minera y deja cotizaciones impagas.</p></div><div class=\"question\"><b>Para conversar</b><p>¿La empresa principal puede tener responsabilidad por esas deudas?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Sí. En el caso de la guía, los trabajadores pueden exigir que la empresa principal responda según las reglas aplicables.</div></details></div>", "mins": 5, "ref": "pp. 13–14 y 21"}, {"session": 2, "title": "¿Qué es el trabajo informal?", "sub": "Puede dejar a las personas sin protección suficiente", "body": "<p>La informalidad laboral incluye situaciones en que una persona trabaja sin acceso a la protección o seguridad social que corresponde.</p><p>Las formas de informalidad varían entre trabajadores dependientes e independientes; no toda actividad informal tiene la misma situación.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una persona dependiente trabaja sin que se paguen sus cotizaciones previsionales.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Tener un ingreso garantiza contar con protección social?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Hay que revisar las condiciones de trabajo y el acceso efectivo a seguridad social.</div></details></div>", "mins": 5, "ref": "pp. 13–14"}, {"session": 2, "title": "¿Qué desafíos trae el teletrabajo?", "sub": "Trabajar a distancia también requiere límites", "body": "<p>El teletrabajo utiliza medios tecnológicos para realizar labores a distancia.</p><p>En las situaciones descritas por la norma de la guía, debe respetarse el derecho a desconexión y los días de descanso.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una jefatura asigna tareas durante las vacaciones de una trabajadora incluida en el supuesto de la norma citada.</p></div><div class=\"question\"><b>Para conversar</b><p>¿La flexibilidad permite exigir respuestas durante sus vacaciones?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. El fragmento prohíbe establecer requerimientos en días de descanso, permisos o feriado.</div></details></div>", "mins": 5, "ref": "pp. 13–14 y 22"}, {"session": 2, "title": "¿Qué cambia con las plataformas?", "sub": "La tecnología crea oportunidades y desafíos", "body": "<p>Las plataformas digitales conectan a trabajadores, clientes y empresas mediante aplicaciones.</p><p>Su expansión plantea preguntas sobre ingresos, horarios, protección social y las reglas aplicables a cada relación.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una aplicación asigna pedidos y comunica condiciones a quien realiza entregas.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Por qué es necesario revisar cómo funciona cada relación?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Porque las condiciones concretas ayudan a determinar qué normas y protecciones corresponden.</div></details></div>", "mins": 5, "ref": "pp. 13–14"}, {"session": 2, "title": "¿Cómo dialogan los distintos sectores?", "sub": "Trabajadores, empleadores y Estado", "body": "<p>El diálogo social reúne a representantes de trabajadores, empleadores y autoridades para discutir asuntos laborales.</p><p>La guía presenta un consejo con participación de los tres sectores.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>En el texto del ejercicio hay tres representantes vinculados al Gobierno, tres a empleadores y tres a centrales sindicales.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Qué conclusión permite el texto?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">La misma cantidad de representantes para cada uno de los tres sectores.</div></details></div>", "mins": 5, "ref": "pp. 11–12 y 23"}, {"session": 2, "title": "Practiquemos con la guía", "sub": "Preguntas 5, 7, 8, 9, 10", "body": "<p>Resuelve las preguntas en tu guía. Luego explica tu elección y revisa las respuestas cuando corresponda.</p><details><summary>Pregunta 5 · Cotizaciones y subcontratación</summary><div class=\"answer\"><b>Respuesta: C.</b> En el caso, se puede exigir que la empresa principal responda por las deudas según el régimen aplicable.<p><b>Para descartar:</b> La situación no implica contratación inmediata por la minera ni pago automático por el Estado.</p></div></details><details><summary>Pregunta 7 · Inclusión laboral</summary><div class=\"answer\"><b>Respuesta: B.</b> La norma busca favorecer la igualdad de oportunidades en el empleo.<p><b>Para descartar:</b> No se refiere a libertad sindical ni a limitar la jornada.</p></div></details><details><summary>Pregunta 8 · Desconexión y vacaciones</summary><div class=\"answer\"><b>Respuesta: D.</b> El fragmento prohíbe que el empleador asigne requerimientos durante el feriado de trabajadores comprendidos en la norma.<p><b>Para descartar:</b> Catorce horas de desconexión supera el mínimo de doce mencionado en el texto.</p></div></details><details><summary>Pregunta 9 · Composición del Consejo</summary><div class=\"answer\"><b>Respuesta: C.</b> El texto presenta tres integrantes por cada sector: Gobierno, empleadores y sindicatos.<p><b>Para descartar:</b> No muestra predominio de uno de ellos ni elección por voto de todos los trabajadores.</p></div></details><details><summary>Pregunta 10 · Huelga y utilidad pública</summary><div class=\"answer\"><b>Respuesta: A.</b> La guía menciona un límite que podría afectar a empresas determinadas por su carácter de utilidad pública.<p><b>Para descartar:</b> La ley no prohíbe la huelga en todas las empresas privadas.</p></div></details><label>Mis apuntes<textarea data-note=\"s2\" placeholder=\"¿Qué entendí? ¿Qué necesito repasar?\"></textarea></label>", "mins": 20, "ref": "pp. 21–23"}, {"session": 2, "title": "Cerremos la clase", "sub": "Volvamos a la pregunta guía", "body": "<div class=\"question\"><b>Para conversar</b><p>¿Cómo se defienden los derechos en un mundo laboral que cambia?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Mediante la organización, la negociación, la fiscalización y el acceso a la justicia, adaptando la protección a nuevas formas de trabajo.</div></details></div><div class=\"question\"><b>Para conversar</b><p>¿Cómo enfrento una pregunta PAES?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Identifico qué pregunta la consigna, busco los datos clave y comparo las alternativas con la información disponible.</div></details></div>", "mins": 5, "ref": ""}];let pos=0;const main=document.querySelector('main');function show(i){pos=Math.max(0,Math.min(slides.length-1,i));const s=slides[pos];main.innerHTML=`<div class="eyebrow">HIS-M27 / Sesión ${s.session} / ${s.mins} min orientativos</div><h1>${s.title}</h1><h2>${s.sub}</h2>${s.body}<p class="ref">Base: guía HIS-M27, Importancia de los derechos laborales en Chile. ${s.ref}</p>`;document.querySelector('#counter').textContent=`${pos+1} / ${slides.length} · Sesión ${s.session}`;document.querySelector('#bar').style.width=((pos+1)/slides.length*100)+'%';document.querySelector('#prev').disabled=pos===0;document.querySelector('#next').disabled=pos===slides.length-1;document.querySelectorAll('[data-session]').forEach(b=>b.setAttribute('aria-current',Number(b.dataset.session)===s.session));document.querySelectorAll('textarea').forEach(t=>{try{t.value=localStorage.getItem('m27-'+t.dataset.note)||''}catch{}t.oninput=()=>{try{localStorage.setItem('m27-'+t.dataset.note,t.value)}catch{}}});if(document.querySelector('#chart')){draw(false);document.querySelector('#scenario').onchange=()=>draw(false);document.querySelector('#predict').onclick=()=>draw(true)}window.scrollTo(0,0)}function draw(reveal){const v=document.querySelector('#scenario').value;let d=100,o=20;if(v==='dplus')d=124;if(v==='dminus')d=76;if(v==='splus')o=-4;if(v==='sminus')o=44;const p=(d+o)/2,q=(d-o)/2;let x=q=>70+q*4.4,y=p=>315-p*2.1;const line=(q1,p1,q2,p2,color,dash='')=>`<line x1="${x(q1)}" y1="${y(p1)}" x2="${x(q2)}" y2="${y(p2)}" stroke="${color}" stroke-width="3" stroke-dasharray="${dash}"/>`;let out=`<path d="M70 20V315H640" stroke="#675c75" fill="none"/><text x="22" y="24">P</text><text x="640" y="342">Q</text>`;out+=line(0,100,95,5,'#c9bbd8','6 5')+line(0,20,95,115,'#a9d7d9','6 5');out+=line(Math.max(0,d-135),Math.min(d,135),Math.min(d,100),Math.max(0,d-100),'#643a91')+line(Math.max(0,-o),Math.max(0,o),Math.min(100,135-o),Math.min(135,o+100),'#087f89');out+='<text x="525" y="295" fill="#643a91">D</text><text x="505" y="35" fill="#087f89">O</text>';if(reveal){out+=`<circle cx="${x(q)}" cy="${y(p)}" r="7" fill="#271c3b"/><path d="M70 ${y(p)}H${x(q)}V315" stroke="#665878" stroke-dasharray="4 4" fill="none"/><text x="10" y="${y(p)+6}">${p}</text><text x="${x(q)-8}" y="342">${q}</text>`}document.querySelector('#chart').innerHTML=out;document.querySelector('#result').textContent=reveal?`Equilibrio: P = ${p}; Q = ${q}. ${({base:'Inicial: P = 60; Q = 40.',dplus:'Mayor demanda: suben precio y cantidad.',dminus:'Menor demanda: bajan precio y cantidad.',splus:'Mayor oferta: baja precio y sube cantidad.',sminus:'Menor oferta: sube precio y baja cantidad.'})[v]} Líneas discontinuas: curvas iniciales.`:'Antes de mostrar el resultado, piensa qué pasa con el precio y la cantidad. Las líneas punteadas muestran la situación inicial.'}document.querySelector('#prev').onclick=()=>show(pos-1);document.querySelector('#next').onclick=()=>show(pos+1);document.querySelectorAll('[data-session]').forEach(b=>b.onclick=()=>show(slides.findIndex(s=>s.session==b.dataset.session)));const dlg=document.querySelector('dialog');document.querySelector('#index').onclick=()=>dlg.showModal();document.querySelector('#close').onclick=()=>dlg.close();document.querySelector('#list').innerHTML=slides.map((s,i)=>`<button data-i="${i}">S${s.session} · ${s.title} <small>(${s.mins} min)</small></button>`).join('');document.querySelector('#list').onclick=e=>{const b=e.target.closest('[data-i]');if(b){show(+b.dataset.i);dlg.close()}};document.querySelector('#full').onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>{})}else document.exitFullscreen?.()};document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT','SUMMARY','BUTTON'].includes(e.target.tagName)||dlg.open)return;if(e.key==='ArrowRight'){e.preventDefault();show(pos+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(pos-1)}});show(0);</script></html>
