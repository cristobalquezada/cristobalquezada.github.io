<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HIS-M20 · Mercado · Dos sesiones</title><style>*{box-sizing:border-box} :root{--purple:#643a91;--dark:#271c3b;--teal:#087f89;--line:#ddd7e7}body{margin:0;background:#f6f4f9;color:var(--dark);font-family:Inter,Arial,sans-serif}button,select,textarea{font:inherit}button,select,summary{cursor:pointer}button{border:1px solid var(--line);background:white;color:var(--dark);padding:12px 17px;border-radius:8px}button:hover,button[aria-current=true]{background:var(--purple);color:white}button:focus-visible,summary:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #11a9b5;outline-offset:3px}header{padding:15px 4vw;background:white;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px}header small{display:block;color:var(--teal);margin-top:4px}nav{display:flex;gap:8px;flex-wrap:wrap}.progress{height:4px;background:#e4dfee}.progress div{height:100%;background:linear-gradient(90deg,var(--purple),#13a9b3)}main{max-width:1240px;margin:auto;padding:40px 5vw 100px}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:13px;color:var(--teal);font-weight:bold}h1{font-size:clamp(32px,4vw,55px);line-height:1.1;letter-spacing:-.035em;margin:15px 0}h2{font-size:23px;color:var(--purple);font-weight:500;margin:0 0 30px}p,td,summary{font-size:clamp(18px,1.7vw,23px);line-height:1.55}.lead{font-size:clamp(24px,2.6vw,34px);line-height:1.4}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}article{background:white;padding:22px;border:1px solid var(--line);border-top:4px solid var(--teal);border-radius:12px}article h3{color:var(--purple);font-size:23px;margin:0}article p{margin-bottom:0}details{background:white;border:1px solid var(--line);border-radius:9px;margin:12px 0}summary{padding:17px 20px;color:var(--purple);font-weight:600}.answer{border-top:1px solid var(--line);padding:18px 22px;font-size:21px;line-height:1.55}table{width:100%;border-collapse:collapse;background:white}td,th{text-align:left;padding:15px;border-bottom:1px solid var(--line)}th{background:var(--purple);color:white;font-size:17px}td{font-size:20px}.scroll{overflow-x:auto}.note{font-size:16px;color:#625b6c;border-left:3px solid var(--teal);padding:10px 16px;background:#eeebf4}footer{position:fixed;bottom:0;width:100%;background:#ffffffee;border-top:1px solid var(--line);padding:10px 4vw;display:flex;justify-content:space-between;align-items:center;gap:12px;backdrop-filter:blur(8px)}#counter{font-size:14px}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center}select{padding:12px;border:1px solid var(--line);border-radius:8px}textarea{display:block;width:100%;min-height:110px;padding:14px;margin-top:10px;border:1px solid var(--line);border-radius:8px}label{display:block;margin-top:15px;color:var(--purple)}#chart{width:100%;max-height:370px;background:white;border-radius:10px;margin-top:14px}#result{min-height:60px;color:var(--teal)}dialog{border:1px solid var(--line);border-radius:14px;max-width:800px;width:90%;max-height:85vh}dialog::backdrop{background:#271c3b99}.indexlist{display:grid;gap:8px}.indexlist button{text-align:left}.ref{font-size:14px;color:#6e6477;margin-top:25px}@media(max-width:650px){header{align-items:flex-start;flex-direction:column}main{padding:25px 20px 110px}.grid{grid-template-columns:1fr}td{font-size:17px;padding:10px}footer button{padding:10px}footer #counter{max-width:100px}h2{font-size:20px}}@media print{header,footer,.progress{display:none}main{padding:0}details{break-inside:avoid} }.stack{display:grid;gap:12px;margin:22px 0}.block{background:#fff;border:1px solid #e1d9ec;border-left:5px solid #0c929b;border-radius:12px;padding:17px 22px}.block b{font-size:22px;color:#604086}.block p{margin:6px 0 0}.highlight{background:#eee8f6;border-left:5px solid #7546a0;border-radius:12px;padding:18px 22px;margin:22px 0}.highlight strong{color:#653a8c;text-transform:uppercase;font-size:14px;letter-spacing:.08em}.highlight p{margin:8px 0 0}.question{margin:25px 0;padding:18px 22px;border-radius:12px;background:#eaf7f6;border:1px solid #c5e9e7}.question>b{color:#087f89}.question>p{margin:7px 0}main{max-width:1250px}h1{max-width:1050px}main>p{max-width:1100px}</style><header><div><b>ECONOMÍA / HIS-M20</b><small>Estado, democracia y ciudadanía · Dos sesiones de 80 minutos</small></div><nav aria-label="Sesiones"><button data-session="1">Sesión 1</button><button data-session="2">Sesión 2</button><button id="index">Índice</button><button id="full" aria-label="Alternar pantalla completa">Pantalla completa</button></nav></header><div class="progress"><div id="bar"></div></div><main></main><footer><button id="prev">← Anterior</button><span id="counter" aria-live="polite"></span><button id="next">Siguiente →</button></footer><dialog aria-label="Índice de sesiones"><button id="close">Cerrar índice</button><h2>Elegir un tema</h2><div id="list" class="indexlist"></div></dialog><script>const slides=[{"session": 1, "title": "Clase 1 · Estado, democracia y ciudadanía", "sub": "Sesión 1 · Formación Ciudadana", "body": "<p class=\"lead\">En esta clase exploraremos una pregunta para entender mejor la vida en democracia.</p><div class=\"highlight\"><strong>Pregunta guía</strong><p>¿Qué necesita una democracia para funcionar?</p></div>", "mins": 3, "ref": "pp. 3–12"}, {"session": 1, "title": "¿Qué aprenderemos hoy?", "sub": "Comprender, relacionar y aplicar", "body": "<p>Explicar los conceptos y situaciones de la guía, relacionándolos con ejemplos cercanos y preguntas de la PAES.</p><div class=\"highlight\"><strong>Pregunta guía</strong><p>¿Qué necesita una democracia para funcionar?</p></div><p>Al finalizar, trabajaremos con los ejercicios de la guía y conversaremos sobre las alternativas.</p>", "mins": 3, "ref": "pp. 3–12"}, {"session": 1, "title": "Activemos ideas previas", "sub": "Pensemos en lo que ya sabemos", "body": "<div class=\"question\"><b>Para conversar</b><p>¿Qué entiendes por democracia y participación?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">La clase recupera distintas ideas y las relaciona con ejemplos y conceptos de la guía.</div></details></div><div class=\"question\"><b>Para conversar</b><p>¿Cómo podemos justificar una respuesta?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Identificando información relevante y explicando cómo se relaciona con el concepto.</div></details></div>", "mins": 4, "ref": ""}, {"session": 1, "title": "¿Qué es el Estado?", "sub": "Una comunidad organizada políticamente", "body": "<p>El Estado es una organización política que ejerce poder sobre una población en un territorio. En Chile, su finalidad es promover el bien común.</p><p>Gobierno y Estado no son lo mismo: los gobiernos cambian; las instituciones estatales permanecen, aunque también pueden reformarse.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Cuando cambia el presidente, los tribunales y los servicios públicos siguen existiendo.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Un cambio de gobierno significa que aparece un Estado nuevo?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Cambian autoridades y orientaciones, pero el Estado continúa.</div></details></div>", "mins": 5, "ref": "p. 3"}, {"session": 1, "title": "¿Qué elementos tiene el Estado?", "sub": "Población, territorio y poder", "body": "<p>El Estado comprende un grupo humano, un territorio y un poder político capaz de establecer y hacer cumplir normas.</p><p>La soberanía alude a la autoridad política suprema; su ejercicio está sujeto a la Constitución y a los derechos que ella reconoce.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una ley obliga a quienes se encuentran dentro de su ámbito de aplicación.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Qué elemento se expresa al dictar una ley obligatoria?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">El ejercicio del poder político.</div></details></div>", "mins": 5, "ref": "p. 3"}, {"session": 1, "title": "¿Estado, nación y gobierno son iguales?", "sub": "Son conceptos relacionados, pero distintos", "body": "<p>El gobierno dirige el Estado por un período. La nación alude a una comunidad de identidad, con vínculos históricos o culturales compartidos.</p><p>Las fronteras de una nación y las de un Estado no tienen que coincidir exactamente; tampoco todas las personas de un Estado comparten una sola identidad.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>El pueblo mapuche tiene comunidades en territorios de Chile y Argentina.</p></div><div class=\"question\"><b>Para conversar</b><p>¿La nación es un ministerio o un tribunal?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Es una comunidad de identidad, no una institución del Estado.</div></details></div>", "mins": 5, "ref": "p. 3"}, {"session": 1, "title": "¿Qué significa ciudadanía?", "sub": "Derechos y participación en la vida pública", "body": "<p>La ciudadanía puede entenderse como un estatus jurídico que reconoce derechos políticos y también como una práctica de participación en la comunidad.</p><p>No todas las formas de participación dependen de votar: organizarse en un centro de estudiantes o en una junta vecinal también puede contribuir a la vida pública.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Un grupo de vecinos se reúne para proponer mejoras en su barrio.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Esa acción es una elección?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Es una forma de participación ciudadana no electoral.</div></details></div>", "mins": 5, "ref": "pp. 4–6"}, {"session": 1, "title": "¿Qué es la democracia?", "sub": "Un modo de organizar el poder", "body": "<p>En una democracia, la ciudadanía participa en la elección y el control de sus autoridades. El poder debe ejercerse dentro de reglas y respetando derechos.</p><p>La democracia contemporánea integra representación, participación, libertades y límites al poder. Una elección, por sí sola, no garantiza todas esas condiciones.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Un país realiza elecciones, pero solo permite competir al partido gobernante.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Basta con que se vote para concluir que hay competencia democrática?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. También importa que existan alternativas reales y condiciones justas de competencia.</div></details></div>", "mins": 5, "ref": "pp. 6–8"}, {"session": 1, "title": "¿Qué valores sostienen la democracia?", "sub": "Dignidad, libertad, igualdad y pluralismo", "body": "<p>La dignidad reconoce el valor de todas las personas. La igualdad exige considerar sus derechos sin discriminación arbitraria.</p><p>El pluralismo acepta la existencia de ideas distintas; la libertad permite expresar opiniones y participar dentro de un marco de derechos.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Dos organizaciones presentan propuestas diferentes para una misma comuna.</p></div><div class=\"question\"><b>Para conversar</b><p>¿La existencia de desacuerdo destruye la democracia?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. El pluralismo permite expresar y debatir diferencias respetando derechos.</div></details></div>", "mins": 5, "ref": "pp. 8–9"}, {"session": 1, "title": "¿Qué es el Estado de derecho?", "sub": "Las autoridades también deben respetar la ley", "body": "<p>En el Estado de derecho, el poder se ejerce conforme a normas y las autoridades están sujetas a ellas.</p><p>Las instituciones de control y los tribunales ayudan a evitar que las decisiones dependan solo de la voluntad de una persona.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una autoridad debe cumplir las reglas que regulan una compra pública.</p></div><div class=\"question\"><b>Para conversar</b><p>¿El Estado de derecho solo obliga a la ciudadanía?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. También limita y obliga a quienes gobiernan.</div></details></div>", "mins": 5, "ref": "pp. 9–10"}, {"session": 1, "title": "¿Qué condiciones permiten elegir?", "sub": "Competencia, libertades y control", "body": "<p>Las elecciones democráticas requieren alternativas políticas, información, reglas y posibilidades reales de competir.</p><p>La libertad de expresión y la existencia de instituciones independientes ayudan a controlar a las autoridades y sostener la democracia.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>En una elección participan candidaturas de distintas organizaciones.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Quién fiscaliza también importa?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Sí. El control institucional ayuda a exigir responsabilidades.</div></details></div>", "mins": 5, "ref": "pp. 9–12"}, {"session": 1, "title": "Practiquemos con la guía", "sub": "Preguntas 1, 4, 5, 7, 10", "body": "<p>Resuelve primero en la guía. Luego explica tu alternativa y compara con la revisión.</p><details><summary>Pregunta 1 · Estado de derecho</summary><div class=\"answer\"><b>Respuesta: B.</b> Gobernantes y gobernados están sujetos a la ley.<p><b>Para descartar:</b> Las elecciones y partidos importan, pero no son el atributo preguntado.</p></div></details><details><summary>Pregunta 4 · Control de autoridades</summary><div class=\"answer\"><b>Respuesta: B.</b> La fiscalización institucional limita el poder y exige responsabilidades.<p><b>Para descartar:</b> La popularidad de una autoridad no reemplaza el control.</p></div></details><details><summary>Pregunta 5 · Libertad de información</summary><div class=\"answer\"><b>Respuesta: C.</b> La ausencia de censura previa favorece que circulen versiones distintas.<p><b>Para descartar:</b> La libertad no elimina la responsabilidad por abusos establecidos por ley.</p></div></details><details><summary>Pregunta 7 · Poder soberano</summary><div class=\"answer\"><b>Respuesta: A.</b> La promulgación de normas obligatorias expresa el poder político.<p><b>Para descartar:</b> Territorio y población son elementos distintos.</p></div></details><details><summary>Pregunta 10 · Régimen ficticio</summary><div class=\"answer\"><b>Respuesta: A.</b> Si solo compite el partido gobernante, falta competencia entre alternativas.<p><b>Para descartar:</b> La tabla sí señala prensa libre y tribunales independientes.</p></div></details><label>Mis apuntes<textarea data-note=\"s1\" placeholder=\"¿Qué entendí? ¿Qué necesito repasar?\"></textarea></label>", "mins": 25, "ref": "pp. 26–30"}, {"session": 1, "title": "Cerremos la clase", "sub": "Volvamos a la pregunta guía", "body": "<div class=\"question\"><b>Para conversar</b><p>¿Qué necesita una democracia para funcionar?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Una democracia requiere participación, derechos, pluralismo e instituciones que limiten y controlen el poder.</div></details></div><div class=\"question\"><b>Para conversar</b><p>¿Cómo abordar una pregunta PAES?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Identifico qué se pregunta, busco el dato clave y comparo las alternativas antes de decidir.</div></details></div>", "mins": 5, "ref": ""}, {"session": 2, "title": "Clase 2 · Estado, democracia y ciudadanía", "sub": "Sesión 2 · Formación Ciudadana", "body": "<p class=\"lead\">En esta clase exploraremos una pregunta para entender mejor la vida en democracia.</p><div class=\"highlight\"><strong>Pregunta guía</strong><p>¿Cómo ejercemos y protegemos la democracia?</p></div>", "mins": 3, "ref": "pp. 13–22"}, {"session": 2, "title": "¿Qué aprenderemos hoy?", "sub": "Comprender, relacionar y aplicar", "body": "<p>Explicar los conceptos y situaciones de la guía, relacionándolos con ejemplos cercanos y preguntas de la PAES.</p><div class=\"highlight\"><strong>Pregunta guía</strong><p>¿Cómo ejercemos y protegemos la democracia?</p></div><p>Al finalizar, trabajaremos con los ejercicios de la guía y conversaremos sobre las alternativas.</p>", "mins": 3, "ref": "pp. 13–22"}, {"session": 2, "title": "Activemos ideas previas", "sub": "Pensemos en lo que ya sabemos", "body": "<div class=\"question\"><b>Para conversar</b><p>¿Qué idea de la clase anterior recuerdas?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">La clase recupera distintas ideas y las relaciona con ejemplos y conceptos de la guía.</div></details></div><div class=\"question\"><b>Para conversar</b><p>¿Cómo podemos justificar una respuesta?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Identificando información relevante y explicando cómo se relaciona con el concepto.</div></details></div>", "mins": 4, "ref": ""}, {"session": 2, "title": "¿Qué es igualdad ante la ley?", "sub": "Los derechos deben protegerse sin discriminación arbitraria", "body": "<p>La igualdad ante la ley exige que las normas y autoridades respeten la dignidad y los derechos de todas las personas.</p><p>No toda diferencia de trato es arbitraria: hay que examinar si tiene una justificación razonable y cómo afecta los derechos.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Un establecimiento rechaza a una persona solo por su nacionalidad.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Qué problema podría presentar esta situación?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Podría constituir discriminación arbitraria si carece de justificación razonable y afecta derechos.</div></details></div>", "mins": 5, "ref": "pp. 13–15"}, {"session": 2, "title": "¿Qué libertades necesitamos?", "sub": "Expresión, reunión y asociación", "body": "<p>Las libertades permiten expresar ideas, informarse, reunirse y organizarse. Favorecen el debate y el control ciudadano.</p><p>El ejercicio de derechos debe considerar los derechos de otras personas y los límites establecidos por la ley.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una comunidad se organiza para expresar una opinión sobre un proyecto.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Pueden existir opiniones distintas en una democracia?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Sí. El pluralismo y la libertad de expresión permiten debatirlas.</div></details></div>", "mins": 5, "ref": "pp. 15–16"}, {"session": 2, "title": "¿Qué significa bien común?", "sub": "Crear condiciones para la vida de todas las personas", "body": "<p>La Constitución plantea que el Estado está al servicio de la persona y debe promover el bien común.</p><p>Las políticas públicas pueden buscar que las personas participen con mayores oportunidades, por ejemplo reduciendo barreras de acceso.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una beca apoya los estudios de personas con menores ingresos.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Por qué puede relacionarse con igualdad de oportunidades?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Porque ayuda a enfrentar una barrera económica para estudiar.</div></details></div>", "mins": 5, "ref": "p. 16"}, {"session": 2, "title": "¿Quién toma las decisiones?", "sub": "Democracia directa y representativa", "body": "<p>En la democracia representativa, la ciudadanía elige autoridades que toman decisiones por un período.</p><p>En mecanismos directos, la ciudadanía participa votando una decisión determinada, como ocurre en ciertos plebiscitos. Las reglas dependen del mecanismo.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Elegir parlamentarios y votar una propuesta en un plebiscito son acciones distintas.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Cuál de estas elige representantes?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">La elección parlamentaria.</div></details></div>", "mins": 5, "ref": "pp. 17–18"}, {"session": 2, "title": "¿Cómo podemos participar?", "sub": "La participación es más amplia que votar", "body": "<p>Votar y participar en partidos son formas reguladas de participación política. También existen asociaciones, campañas, movimientos y deliberación pública.</p><p>Las distintas formas pueden complementarse. Su efectividad depende de la organización, el acceso a información y las oportunidades de incidencia.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Vecinos se organizan para presentar propuestas sobre el transporte local.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Se necesita militar en un partido para hacerlo?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Hay distintas formas de organización y participación.</div></details></div>", "mins": 5, "ref": "pp. 19–20"}, {"session": 2, "title": "¿Por qué cambia el derecho a voto?", "sub": "La ciudadanía se amplía y también cambian las reglas", "body": "<p>La historia del sufragio muestra ampliaciones graduales, como la incorporación de mujeres y personas que no sabían leer y escribir.</p><p>Otras reformas modifican cómo se ejerce un derecho ya reconocido, por ejemplo la inscripción o la obligatoriedad.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>La guía compara 1934 y 1949 con cambios de 2012 y 2023.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Todos esos cambios hicieron exactamente lo mismo?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Algunos incorporaron grupos antes excluidos; otros cambiaron la forma de ejercer el voto.</div></details></div>", "mins": 5, "ref": "pp. 5–6 y 27"}, {"session": 2, "title": "¿Qué amenaza a la democracia?", "sub": "Desconfianza, corrupción y exclusión", "body": "<p>La corrupción usa el poder público para favorecer intereses indebidos. Puede debilitar la confianza y desviar decisiones del interés general.</p><p>La desigualdad, la violencia y la desafección política también plantean desafíos; sus causas y efectos deben analizarse en cada contexto.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una autoridad favorece a un familiar en una contratación pública.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Por qué es un problema democrático?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Porque una decisión pública se subordina a un interés particular.</div></details></div>", "mins": 5, "ref": "pp. 21–22"}, {"session": 2, "title": "¿Cómo proteger la democracia?", "sub": "Derechos, información y control ciudadano", "body": "<p>Una democracia necesita instituciones que rindan cuentas y personas que puedan informarse y participar.</p><p>La protección de derechos y la fiscalización son complementarias: las autoridades elegidas no quedan por encima de las normas.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Un organismo de control publica un informe sobre el gasto público.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Cómo puede ayudar a la ciudadanía?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Permite conocer y examinar el uso de los recursos públicos.</div></details></div>", "mins": 5, "ref": "pp. 20–22"}, {"session": 2, "title": "Practiquemos con la guía", "sub": "Preguntas 2, 3, 6, 8, 9", "body": "<p>Resuelve primero en la guía. Luego explica tu alternativa y compara con la revisión.</p><details><summary>Pregunta 2 · Corrupción</summary><div class=\"answer\"><b>Respuesta: D.</b> Las decisiones públicas pueden quedar subordinadas a intereses particulares.<p><b>Para descartar:</b> Otros efectos pueden ocurrir, pero esa opción explica directamente el riesgo democrático.</p></div></details><details><summary>Pregunta 3 · Cambios en el sufragio</summary><div class=\"answer\"><b>Respuesta: C.</b> En 2012 y 2023 cambió la forma de ejercer el voto ya reconocido.<p><b>Para descartar:</b> Los hitos anteriores incorporaron grupos antes excluidos.</p></div></details><details><summary>Pregunta 6 · Discriminación</summary><div class=\"answer\"><b>Respuesta: C.</b> Rechazar a alguien solo por su nacionalidad podría afectar derechos sin justificación razonable.<p><b>Para descartar:</b> Un requisito debe examinarse según su finalidad y razonabilidad.</p></div></details><details><summary>Pregunta 8 · Igualdad de oportunidades</summary><div class=\"answer\"><b>Respuesta: D.</b> Una beca puede reducir barreras económicas para estudiar.<p><b>Para descartar:</b> Las demás medidas atienden otros fines públicos.</p></div></details><details><summary>Pregunta 9 · Límites a los derechos</summary><div class=\"answer\"><b>Respuesta: B.</b> El fragmento exige una limitación establecida por ley y orientada, entre otros fines, a proteger derechos de otras personas.<p><b>Para descartar:</b> La sola voluntad de una autoridad no reemplaza esa condición.</p></div></details><label>Mis apuntes<textarea data-note=\"s2\" placeholder=\"¿Qué entendí? ¿Qué necesito repasar?\"></textarea></label>", "mins": 25, "ref": "pp. 26–30"}, {"session": 2, "title": "Cerremos la clase", "sub": "Volvamos a la pregunta guía", "body": "<div class=\"question\"><b>Para conversar</b><p>¿Cómo ejercemos y protegemos la democracia?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Participamos de distintas formas; para proteger la democracia importan los derechos, la información y los controles.</div></details></div><div class=\"question\"><b>Para conversar</b><p>¿Cómo abordar una pregunta PAES?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Identifico qué se pregunta, busco el dato clave y comparo las alternativas antes de decidir.</div></details></div>", "mins": 5, "ref": ""}];let pos=0;const main=document.querySelector('main');function show(i){pos=Math.max(0,Math.min(slides.length-1,i));const s=slides[pos];main.innerHTML=`<div class="eyebrow">HIS-M20 / Sesión ${s.session} / ${s.mins} min orientativos</div><h1>${s.title}</h1><h2>${s.sub}</h2>${s.body}<p class="ref">Base: guía HIS-M20, Estado, democracia y ciudadanía. ${s.ref}</p>`;document.querySelector('#counter').textContent=`${pos+1} / ${slides.length} · Sesión ${s.session}`;document.querySelector('#bar').style.width=((pos+1)/slides.length*100)+'%';document.querySelector('#prev').disabled=pos===0;document.querySelector('#next').disabled=pos===slides.length-1;document.querySelectorAll('[data-session]').forEach(b=>b.setAttribute('aria-current',Number(b.dataset.session)===s.session));document.querySelectorAll('textarea').forEach(t=>{try{t.value=localStorage.getItem('m20-'+t.dataset.note)||''}catch{}t.oninput=()=>{try{localStorage.setItem('m20-'+t.dataset.note,t.value)}catch{}}});if(document.querySelector('#chart')){draw(false);document.querySelector('#scenario').onchange=()=>draw(false);document.querySelector('#predict').onclick=()=>draw(true)}window.scrollTo(0,0)}function draw(reveal){const v=document.querySelector('#scenario').value;let d=100,o=20;if(v==='dplus')d=124;if(v==='dminus')d=76;if(v==='splus')o=-4;if(v==='sminus')o=44;const p=(d+o)/2,q=(d-o)/2;let x=q=>70+q*4.4,y=p=>315-p*2.1;const line=(q1,p1,q2,p2,color,dash='')=>`<line x1="${x(q1)}" y1="${y(p1)}" x2="${x(q2)}" y2="${y(p2)}" stroke="${color}" stroke-width="3" stroke-dasharray="${dash}"/>`;let out=`<path d="M70 20V315H640" stroke="#675c75" fill="none"/><text x="22" y="24">P</text><text x="640" y="342">Q</text>`;out+=line(0,100,95,5,'#c9bbd8','6 5')+line(0,20,95,115,'#a9d7d9','6 5');out+=line(Math.max(0,d-135),Math.min(d,135),Math.min(d,100),Math.max(0,d-100),'#643a91')+line(Math.max(0,-o),Math.max(0,o),Math.min(100,135-o),Math.min(135,o+100),'#087f89');out+='<text x="525" y="295" fill="#643a91">D</text><text x="505" y="35" fill="#087f89">O</text>';if(reveal){out+=`<circle cx="${x(q)}" cy="${y(p)}" r="7" fill="#271c3b"/><path d="M70 ${y(p)}H${x(q)}V315" stroke="#665878" stroke-dasharray="4 4" fill="none"/><text x="10" y="${y(p)+6}">${p}</text><text x="${x(q)-8}" y="342">${q}</text>`}document.querySelector('#chart').innerHTML=out;document.querySelector('#result').textContent=reveal?`Equilibrio: P = ${p}; Q = ${q}. ${({base:'Inicial: P = 60; Q = 40.',dplus:'Mayor demanda: suben precio y cantidad.',dminus:'Menor demanda: bajan precio y cantidad.',splus:'Mayor oferta: baja precio y sube cantidad.',sminus:'Menor oferta: sube precio y baja cantidad.'})[v]} Líneas discontinuas: curvas iniciales.`:'Antes de mostrar el resultado, piensa qué pasa con el precio y la cantidad. Las líneas punteadas muestran la situación inicial.'}document.querySelector('#prev').onclick=()=>show(pos-1);document.querySelector('#next').onclick=()=>show(pos+1);document.querySelectorAll('[data-session]').forEach(b=>b.onclick=()=>show(slides.findIndex(s=>s.session==b.dataset.session)));const dlg=document.querySelector('dialog');document.querySelector('#index').onclick=()=>dlg.showModal();document.querySelector('#close').onclick=()=>dlg.close();document.querySelector('#list').innerHTML=slides.map((s,i)=>`<button data-i="${i}">S${s.session} · ${s.title} <small>(${s.mins} min)</small></button>`).join('');document.querySelector('#list').onclick=e=>{const b=e.target.closest('[data-i]');if(b){show(+b.dataset.i);dlg.close()}};document.querySelector('#full').onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>{})}else document.exitFullscreen?.()};document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT','SUMMARY','BUTTON'].includes(e.target.tagName)||dlg.open)return;if(e.key==='ArrowRight'){e.preventDefault();show(pos+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(pos-1)}});show(0);</script></html>
