<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HIS-M25 · Mercado · Dos sesiones</title><style>*{box-sizing:border-box} :root{--purple:#643a91;--dark:#271c3b;--teal:#087f89;--line:#ddd7e7}body{margin:0;background:#f6f4f9;color:var(--dark);font-family:Inter,Arial,sans-serif}button,select,textarea{font:inherit}button,select,summary{cursor:pointer}button{border:1px solid var(--line);background:white;color:var(--dark);padding:12px 17px;border-radius:8px}button:hover,button[aria-current=true]{background:var(--purple);color:white}button:focus-visible,summary:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #11a9b5;outline-offset:3px}header{padding:15px 4vw;background:white;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px}header small{display:block;color:var(--teal);margin-top:4px}nav{display:flex;gap:8px;flex-wrap:wrap}.progress{height:4px;background:#e4dfee}.progress div{height:100%;background:linear-gradient(90deg,var(--purple),#13a9b3)}main{max-width:1240px;margin:auto;padding:40px 5vw 100px}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:13px;color:var(--teal);font-weight:bold}h1{font-size:clamp(32px,4vw,55px);line-height:1.1;letter-spacing:-.035em;margin:15px 0}h2{font-size:23px;color:var(--purple);font-weight:500;margin:0 0 30px}p,td,summary{font-size:clamp(18px,1.7vw,23px);line-height:1.55}.lead{font-size:clamp(24px,2.6vw,34px);line-height:1.4}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}article{background:white;padding:22px;border:1px solid var(--line);border-top:4px solid var(--teal);border-radius:12px}article h3{color:var(--purple);font-size:23px;margin:0}article p{margin-bottom:0}details{background:white;border:1px solid var(--line);border-radius:9px;margin:12px 0}summary{padding:17px 20px;color:var(--purple);font-weight:600}.answer{border-top:1px solid var(--line);padding:18px 22px;font-size:21px;line-height:1.55}table{width:100%;border-collapse:collapse;background:white}td,th{text-align:left;padding:15px;border-bottom:1px solid var(--line)}th{background:var(--purple);color:white;font-size:17px}td{font-size:20px}.scroll{overflow-x:auto}.note{font-size:16px;color:#625b6c;border-left:3px solid var(--teal);padding:10px 16px;background:#eeebf4}footer{position:fixed;bottom:0;width:100%;background:#ffffffee;border-top:1px solid var(--line);padding:10px 4vw;display:flex;justify-content:space-between;align-items:center;gap:12px;backdrop-filter:blur(8px)}#counter{font-size:14px}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center}select{padding:12px;border:1px solid var(--line);border-radius:8px}textarea{display:block;width:100%;min-height:110px;padding:14px;margin-top:10px;border:1px solid var(--line);border-radius:8px}label{display:block;margin-top:15px;color:var(--purple)}#chart{width:100%;max-height:370px;background:white;border-radius:10px;margin-top:14px}#result{min-height:60px;color:var(--teal)}dialog{border:1px solid var(--line);border-radius:14px;max-width:800px;width:90%;max-height:85vh}dialog::backdrop{background:#271c3b99}.indexlist{display:grid;gap:8px}.indexlist button{text-align:left}.ref{font-size:14px;color:#6e6477;margin-top:25px}@media(max-width:650px){header{align-items:flex-start;flex-direction:column}main{padding:25px 20px 110px}.grid{grid-template-columns:1fr}td{font-size:17px;padding:10px}footer button{padding:10px}footer #counter{max-width:100px}h2{font-size:20px}}@media print{header,footer,.progress{display:none}main{padding:0}details{break-inside:avoid} }.stack{display:grid;gap:12px;margin:22px 0}.block{background:#fff;border:1px solid #e1d9ec;border-left:5px solid #0c929b;border-radius:12px;padding:17px 22px}.block b{font-size:22px;color:#604086}.block p{margin:6px 0 0}.highlight{background:#eee8f6;border-left:5px solid #7546a0;border-radius:12px;padding:18px 22px;margin:22px 0}.highlight strong{color:#653a8c;text-transform:uppercase;font-size:14px;letter-spacing:.08em}.highlight p{margin:8px 0 0}.question{margin:25px 0;padding:18px 22px;border-radius:12px;background:#eaf7f6;border:1px solid #c5e9e7}.question>b{color:#087f89}.question>p{margin:7px 0}main{max-width:1250px}h1{max-width:1050px}main>p{max-width:1100px}</style><header><div><b>ECONOMÍA / HIS-M25</b><small>Estado y mercado · Dos sesiones de 80 minutos</small></div><nav aria-label="Sesiones"><button data-session="1">Sesión 1</button><button data-session="2">Sesión 2</button><button id="index">Índice</button><button id="full" aria-label="Alternar pantalla completa">Pantalla completa</button></nav></header><div class="progress"><div id="bar"></div></div><main></main><footer><button id="prev">← Anterior</button><span id="counter" aria-live="polite"></span><button id="next">Siguiente →</button></footer><dialog aria-label="Índice de sesiones"><button id="close">Cerrar índice</button><h2>Elegir un tema</h2><div id="list" class="indexlist"></div></dialog><script>const slides=[{"session": 1, "title": "Clase 1 · Estado y mercado", "sub": "¿Por qué participa el Estado en la economía?", "body": "<p class=\"lead\">Al pagar una cuenta de agua o comprar un cuaderno, nuestras decisiones se relacionan con reglas e instituciones públicas.</p><div class=\"highlight\"><strong>Pregunta guía</strong><p>¿Por qué participa el Estado en la economía?</p></div>", "mins": 3, "ref": "pp. 3–12"}, {"session": 1, "title": "¿Qué aprenderemos hoy?", "sub": "Nuestro propósito", "body": "<div class=\"stack\"><div class=\"block\"><b>Objetivo</b><p>Explicar estado y mercado a partir de situaciones cercanas y preguntas de la guía.</p></div><div class=\"block\"><b>Pregunta guía</b><p>¿Por qué participa el Estado en la economía?</p></div><div class=\"block\"><b>Al finalizar</b><p>Resolveremos preguntas de la guía y revisaremos cómo elegir y justificar una respuesta.</p></div></div>", "mins": 3, "ref": "pp. 3–12"}, {"session": 1, "title": "Activemos ideas previas", "sub": "Pensemos en nuestra vida cotidiana", "body": "<div class=\"question\"><b>Para conversar</b><p>¿Qué servicios o actividades necesitan reglas para funcionar?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Por ejemplo, el transporte, las compras y la distribución de agua tienen reglas que afectan a empresas y personas.</div></details></div><div class=\"question\"><b>Para conversar</b><p>¿Qué podría ocurrir si una empresa es la única que presta un servicio en una zona?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Tendría menos competencia, por lo que una regulación podría proteger a quienes necesitan el servicio.</div></details></div>", "mins": 4, "ref": ""}, {"session": 1, "title": "¿Quién decide qué se produce?", "sub": "Las sociedades organizan su economía", "body": "<p>Todas las economías enfrentan tres preguntas: <b>qué producir, cómo producir y para quién producir</b>.</p><p>Las respuestas cambian según cuánto deciden las personas, las empresas y el Estado.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>En una economía de mercado, las decisiones de consumidores y productores tienen un papel importante.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Qué significa decidir para quién se produce?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Considerar quiénes podrán acceder a los bienes y servicios, por ejemplo según sus ingresos y los apoyos que reciban.</div></details></div>", "mins": 5, "ref": "pp. 4–5"}, {"session": 1, "title": "¿Qué es una economía mixta?", "sub": "Conviven decisiones públicas y privadas", "body": "<p>En una economía mixta, las empresas y personas participan en el mercado, mientras el Estado regula, entrega servicios y realiza otras actividades.</p><p>Las economías mixtas pueden ser distintas: no existe una sola forma de combinar Estado y mercado.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Un almacén privado vende alimentos y el Estado financia un consultorio público.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Una economía mixta significa que todo pertenece al Estado?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Combina distintas formas de participación pública y privada.</div></details></div>", "mins": 5, "ref": "pp. 4–6"}, {"session": 1, "title": "¿Por qué puede intervenir el Estado?", "sub": "Algunos problemas no se resuelven bien por sí solos", "body": "<p>Una <b>falla de mercado</b> ocurre cuando el funcionamiento del mercado no logra por sí solo un resultado eficiente para la sociedad.</p><p>Puede ocurrir por falta de competencia, contaminación, dificultades de información o problemas para financiar ciertos bienes públicos.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una fábrica contamina un río y no paga todo el daño que reciben sus vecinos.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Por qué la contaminación es una falla de mercado?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Porque quienes la sufren soportan un costo que no se refleja completamente en el precio del producto.</div></details></div>", "mins": 5, "ref": "pp. 6–7"}, {"session": 1, "title": "¿Todas las intervenciones son iguales?", "sub": "Existen distintos puntos de vista", "body": "<p>Algunas personas creen que el Estado debe intervenir principalmente cuando los privados no pueden resolver bien un problema. Otras proponen una presencia pública más amplia.</p><p>Ambas posiciones pueden buscar bienestar, pero difieren en qué tareas debe asumir el Estado.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una propuesta plantea cobrar a una fábrica por la contaminación que genera.</p></div><div class=\"question\"><b>Para conversar</b><p>¿La postura subsidiaria significa que el Estado nunca interviene?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Puede justificar intervenciones para enfrentar problemas como la contaminación o el poder monopólico.</div></details></div>", "mins": 5, "ref": "p. 7"}, {"session": 1, "title": "¿Quién protege la competencia?", "sub": "Investigar y juzgar son tareas distintas", "body": "<p>La <b>Fiscalía Nacional Económica (FNE)</b> investiga conductas que podrían afectar la competencia y puede presentar una acusación.</p><p>El <b>Tribunal de Defensa de la Libre Competencia (TDLC)</b> resuelve los casos y puede establecer medidas o sanciones.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Varias empresas habrían acordado repartirse clientes.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Quién decide si las empresas infringieron la ley?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">El TDLC resuelve el caso; la FNE puede investigarlo y acusar.</div></details></div>", "mins": 5, "ref": "pp. 8–9"}, {"session": 1, "title": "¿Quién protege a los consumidores?", "sub": "El SERNAC informa y fiscaliza", "body": "<p>El Servicio Nacional del Consumidor ayuda a proteger los derechos de quienes compran bienes y servicios.</p><p>Puede informar, recibir reclamos y fiscalizar. Según la guía, los tribunales resuelven las sanciones, no el SERNAC.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una tienda informa un precio y después cobra otro sin explicar el cambio.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Una denuncia y una sanción son la misma cosa?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Denunciar comunica el problema; sancionar requiere la decisión del organismo competente.</div></details></div>", "mins": 5, "ref": "p. 9"}, {"session": 1, "title": "¿Por qué se regula el agua potable?", "sub": "Algunas redes tienen altos costos de instalación", "body": "<p>Un <b>monopolio natural</b> puede surgir cuando instalar la red cuesta tanto que abastecer una zona con una empresa resulta menos costoso que duplicarla.</p><p>Como esa empresa tiene pocos competidores en la zona, el Estado regula las tarifas y fiscaliza el servicio.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una red de cañerías debe llegar a todos los hogares de un barrio.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Por qué repartir los costos entre más usuarios ayuda?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Porque el costo fijo de la red se distribuye entre más unidades o personas atendidas.</div></details></div>", "mins": 5, "ref": "pp. 7 y 10"}, {"session": 1, "title": "¿Qué hace el Banco Central?", "sub": "Busca mantener la estabilidad de los precios", "body": "<p>El Banco Central es un organismo autónomo que, entre otras funciones, busca la estabilidad de la moneda y el normal funcionamiento de los pagos.</p><p>La tasa de política monetaria influye en el costo del crédito y puede ayudar a moderar la inflación, con efectos que toman tiempo.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Si el crédito se encarece, algunas familias y empresas podrían reducir o postergar gastos.</p></div><div class=\"question\"><b>Para conversar</b><p>¿El Banco Central y el Gobierno son lo mismo?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. El Banco Central tiene autonomía; el Gobierno dirige la política general durante un período.</div></details></div>", "mins": 5, "ref": "p. 11"}, {"session": 1, "title": "Practiquemos con la guía", "sub": "Preguntas 1, 2, 3, 4, 5", "body": "<p>Resuelve las preguntas en tu guía. Luego explica tu elección y revisa las respuestas cuando corresponda.</p><details><summary>Pregunta 1 · Transferencias del Estado</summary><div class=\"answer\"><b>Respuesta: C.</b> Las pensiones y subsidios modifican los ingresos y, con ello, quiénes pueden acceder a bienes y servicios.<p><b>Para descartar:</b> El caso no dice que el Estado fije toda la producción ni reparta los bienes privados.</p></div></details><details><summary>Pregunta 2 · Rol subsidiario</summary><div class=\"answer\"><b>Respuesta: D.</b> Cobrar por contaminación busca corregir un costo que afecta a otras personas.<p><b>Para descartar:</b> Las otras opciones no se desprenden de la definición de la postura presentada.</p></div></details><details><summary>Pregunta 3 · Investigación y tribunal</summary><div class=\"answer\"><b>Respuesta: B.</b> El TDLC resuelve si las empresas infringieron las reglas de competencia.<p><b>Para descartar:</b> Investigar y acusar son funciones de la FNE; no corresponde confundirlas con juzgar.</p></div></details><details><summary>Pregunta 4 · Red de agua potable</summary><div class=\"answer\"><b>Respuesta: A.</b> La red tiene costos fijos altos que se distribuyen entre más unidades de agua.<p><b>Para descartar:</b> El costo fijo total no tiene que bajar para que disminuya el costo por unidad.</p></div></details><details><summary>Pregunta 5 · Banco Central y gasto público</summary><div class=\"answer\"><b>Respuesta: D.</b> La regla busca evitar, entre otros riesgos, que financiar gasto mediante creación de dinero genere presión inflacionaria.<p><b>Para descartar:</b> La pregunta no trata del nombramiento de consejeros ni de préstamos a bancos.</p></div></details><label>Mis apuntes<textarea data-note=\"s1\" placeholder=\"¿Qué entendí? ¿Qué necesito repasar?\"></textarea></label>", "mins": 25, "ref": "pp. 29–30"}, {"session": 1, "title": "Cerremos la clase", "sub": "Volvamos a la pregunta guía", "body": "<div class=\"question\"><b>Para conversar</b><p>¿Por qué participa el Estado en la economía?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Puede establecer reglas, proteger a las personas y enfrentar problemas como la contaminación o la falta de competencia. El alcance de esa participación es objeto de debate.</div></details></div><div class=\"question\"><b>Para conversar</b><p>¿Cómo enfrento una pregunta PAES?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Identifico qué pregunta la consigna, busco los datos clave y comparo las alternativas con la información disponible.</div></details></div>", "mins": 5, "ref": ""}, {"session": 2, "title": "Clase 2 · Recursos y decisiones del Estado", "sub": "¿Cómo obtiene y utiliza sus recursos el Estado?", "body": "<p class=\"lead\">El Estado recauda dinero, financia servicios y también participa en proyectos junto a personas y empresas.</p><div class=\"highlight\"><strong>Pregunta guía</strong><p>¿Cómo obtiene y utiliza sus recursos el Estado?</p></div>", "mins": 3, "ref": "pp. 12–20"}, {"session": 2, "title": "¿Qué aprenderemos hoy?", "sub": "Nuestro propósito", "body": "<div class=\"stack\"><div class=\"block\"><b>Objetivo</b><p>Explicar recursos y decisiones del estado a partir de situaciones cercanas y preguntas de la guía.</p></div><div class=\"block\"><b>Pregunta guía</b><p>¿Cómo obtiene y utiliza sus recursos el Estado?</p></div><div class=\"block\"><b>Al finalizar</b><p>Resolveremos preguntas de la guía y revisaremos cómo elegir y justificar una respuesta.</p></div></div>", "mins": 3, "ref": "pp. 12–20"}, {"session": 2, "title": "Recordemos lo anterior", "sub": "Relacionemos Estado y mercado", "body": "<div class=\"question\"><b>Para conversar</b><p>¿Qué función cumple la FNE?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Investiga conductas que pueden afectar la libre competencia y puede acusar ante el tribunal.</div></details></div><div class=\"question\"><b>Para conversar</b><p>¿Por qué se pueden regular los servicios de agua?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Porque la red puede funcionar como monopolio natural y necesita reglas que protejan a los usuarios.</div></details></div>", "mins": 4, "ref": ""}, {"session": 2, "title": "¿Qué es el presupuesto público?", "sub": "Organiza ingresos y gastos", "body": "<p>El presupuesto es un plan anual que estima los ingresos del Estado y autoriza gastos para distintos fines.</p><p>En Chile, el Ejecutivo presenta el proyecto y el Congreso lo revisa dentro de las facultades que establece la Constitución.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>El presupuesto contempla recursos para hospitales, escuelas y obras públicas.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Presupuestar significa que las necesidades desaparecen?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Como los recursos son limitados, se deben tomar decisiones y establecer prioridades.</div></details></div>", "mins": 5, "ref": "pp. 13–14"}, {"session": 2, "title": "¿Qué son los impuestos?", "sub": "Aportan recursos para financiar gastos públicos", "body": "<p>Los impuestos son pagos obligatorios establecidos por ley. Permiten financiar servicios, infraestructura y otras actividades públicas.</p><p>Pueden cobrarse de distintas formas. El <b>IVA</b> se aplica al consumo, mientras otros impuestos gravan ingresos.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Al comprar un cuaderno, el precio incluye IVA.</p></div><div class=\"question\"><b>Para conversar</b><p>¿El impuesto a la renta y el IVA se cobran exactamente de la misma manera?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Uno se relaciona con ingresos; el otro se aplica a operaciones de consumo gravadas.</div></details></div>", "mins": 5, "ref": "pp. 14–16"}, {"session": 2, "title": "¿Por qué importa pagar impuestos?", "sub": "La recaudación y la competencia están relacionadas", "body": "<p>Cuando una persona o empresa incumple obligaciones tributarias, el Estado deja de recibir recursos que corresponden.</p><p>Además, un negocio que no cumple podría tener una ventaja frente a otro que sí cumple.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Dos personas venden el mismo producto; una no emite boleta ni paga lo que corresponde.</p></div><div class=\"question\"><b>Para conversar</b><p>¿El negocio informal recibe necesariamente un beneficio legal?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. El caso plantea que evita obligaciones, lo que es distinto de acceder a un beneficio tributario legal.</div></details></div>", "mins": 5, "ref": "pp. 14–16"}, {"session": 2, "title": "¿En qué se gastan los recursos?", "sub": "Servicios, inversión y apoyo a las familias", "body": "<p>El gasto público puede financiar servicios como salud y educación, infraestructura y transferencias monetarias.</p><p>Una transferencia entrega recursos a personas u hogares, por ejemplo mediante subsidios.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una familia recibe un subsidio que aumenta el dinero disponible para cubrir sus gastos.</p></div><div class=\"question\"><b>Para conversar</b><p>¿En qué se diferencia una transferencia de una carretera?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">La transferencia entrega recursos a un destinatario; la carretera es una obra o infraestructura pública.</div></details></div>", "mins": 5, "ref": "pp. 16–17"}, {"session": 2, "title": "¿Cómo se observa la desigualdad?", "sub": "Hay que comparar lo que muestran los datos", "body": "<p>El coeficiente de Gini es una medida de desigualdad: en general, un valor menor indica una distribución más igualitaria.</p><p>Para interpretar una tabla, debemos fijarnos en qué ingresos se comparan y qué incluye cada uno.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>En la guía, el Gini del ingreso autónomo es 0,488 y el del ingreso monetario, que suma subsidios, es 0,464.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Qué se puede inferir de esa comparación?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">En esos datos, al considerar los subsidios monetarios, el indicador de desigualdad baja. La encuesta también tiene limitaciones.</div></details></div>", "mins": 5, "ref": "p. 32"}, {"session": 2, "title": "¿El Estado puede tener empresas?", "sub": "También participa como productor y comprador", "body": "<p>El Estado puede ser dueño de empresas que producen bienes o servicios y también compra a proveedores para cumplir sus funciones.</p><p>Las leyes establecen los requisitos para desarrollar actividades empresariales y las reglas de compra.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Codelco es una empresa estatal que produce cobre.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Regular una empresa y ser dueño de una empresa es lo mismo?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">No. Regular significa establecer y fiscalizar reglas; ser dueño implica participar en la propiedad y gestión.</div></details></div>", "mins": 5, "ref": "pp. 17–18"}, {"session": 2, "title": "¿Qué es una concesión?", "sub": "Estado y privados pueden colaborar", "body": "<p>En una concesión, el Estado acuerda con un privado el desarrollo u operación de una obra o servicio bajo ciertas condiciones.</p><p>La colaboración puede facilitar inversión, pero también generar compromisos de pago y riesgos que deben evaluarse.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una empresa financia y construye infraestructura hospitalaria; el Estado mantiene la responsabilidad clínica según el caso de la guía.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Qué riesgo debe considerar el Estado?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Que los pagos y compromisos del contrato pueden extenderse durante muchos años.</div></details></div>", "mins": 5, "ref": "pp. 18–19"}, {"session": 2, "title": "¿Qué es el lobby?", "sub": "Representar intereses ante autoridades", "body": "<p>Una empresa, una organización o una persona puede reunirse con autoridades para expresar sus intereses respecto de una decisión pública.</p><p>La guía distingue el lobby remunerado de otras gestiones de interés particular. La regulación busca hacer transparentes ciertas reuniones y gestiones.</p><div class=\"highlight\"><strong>Ejemplo</strong><p>Una consultora recibe dinero de una empresa para reunirse con una autoridad sobre una norma.</p></div><div class=\"question\"><b>Para conversar</b><p>¿Qué rasgo distingue este caso como lobby en el ejercicio?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Que la consultora recibe un pago por realizar la gestión.</div></details></div>", "mins": 5, "ref": "pp. 20–21"}, {"session": 2, "title": "Practiquemos con la guía", "sub": "Preguntas 6, 7, 8, 9, 10", "body": "<p>Resuelve las preguntas en tu guía. Luego explica tu elección y revisa las respuestas cuando corresponda.</p><details><summary>Pregunta 6 · Ley de Presupuestos</summary><div class=\"answer\"><b>Respuesta: A.</b> En el caso descrito, el Congreso puede rebajar el gasto propuesto para el programa.<p><b>Para descartar:</b> La pregunta no autoriza al Congreso a presentar otro presupuesto o aumentar libremente la estimación de ingresos.</p></div></details><details><summary>Pregunta 7 · Negocio sin boletas</summary><div class=\"answer\"><b>Respuesta: B.</b> El caso plantea que no se cumple con cobrar y declarar el IVA que corresponde.<p><b>Para descartar:</b> No existe información que pruebe contrabando o un beneficio fiscal.</p></div></details><details><summary>Pregunta 8 · Ingresos y Gini</summary><div class=\"answer\"><b>Respuesta: C.</b> El ingreso monetario incluye subsidios y presenta un Gini menor que el ingreso autónomo.<p><b>Para descartar:</b> La comparación no muestra directamente el efecto de los impuestos.</p></div></details><details><summary>Pregunta 9 · Hospital concesionado</summary><div class=\"answer\"><b>Respuesta: A.</b> Una concesión puede comprometer pagos públicos durante muchos años.<p><b>Para descartar:</b> El texto no afirma que el Estado pierda la propiedad del hospital.</p></div></details><details><summary>Pregunta 10 · Gestión ante una autoridad</summary><div class=\"answer\"><b>Respuesta: B.</b> La consultora recibe un pago por realizar la gestión.<p><b>Para descartar:</b> Representar el interés de una empresa o buscar cambios también puede ocurrir sin pago.</p></div></details><label>Mis apuntes<textarea data-note=\"s2\" placeholder=\"¿Qué entendí? ¿Qué necesito repasar?\"></textarea></label>", "mins": 25, "ref": "pp. 30–33"}, {"session": 2, "title": "Cerremos la clase", "sub": "Volvamos a la pregunta guía", "body": "<div class=\"question\"><b>Para conversar</b><p>¿Cómo obtiene y utiliza sus recursos el Estado?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Obtiene recursos, entre otros medios, mediante impuestos; los organiza en un presupuesto y los usa en servicios, inversiones y transferencias.</div></details></div><div class=\"question\"><b>Para conversar</b><p>¿Cómo enfrento una pregunta PAES?</p><details><summary>Revisar una respuesta</summary><div class=\"answer\">Identifico qué pregunta la consigna, busco los datos clave y comparo las alternativas con la información disponible.</div></details></div>", "mins": 5, "ref": ""}];let pos=0;const main=document.querySelector('main');function show(i){pos=Math.max(0,Math.min(slides.length-1,i));const s=slides[pos];main.innerHTML=`<div class="eyebrow">HIS-M25 / Sesión ${s.session} / ${s.mins} min orientativos</div><h1>${s.title}</h1><h2>${s.sub}</h2>${s.body}<p class="ref">Base: guía HIS-M25, Relaciones entre el Estado y el mercado. ${s.ref}</p>`;document.querySelector('#counter').textContent=`${pos+1} / ${slides.length} · Sesión ${s.session}`;document.querySelector('#bar').style.width=((pos+1)/slides.length*100)+'%';document.querySelector('#prev').disabled=pos===0;document.querySelector('#next').disabled=pos===slides.length-1;document.querySelectorAll('[data-session]').forEach(b=>b.setAttribute('aria-current',Number(b.dataset.session)===s.session));document.querySelectorAll('textarea').forEach(t=>{try{t.value=localStorage.getItem('m25-'+t.dataset.note)||''}catch{}t.oninput=()=>{try{localStorage.setItem('m25-'+t.dataset.note,t.value)}catch{}}});if(document.querySelector('#chart')){draw(false);document.querySelector('#scenario').onchange=()=>draw(false);document.querySelector('#predict').onclick=()=>draw(true)}window.scrollTo(0,0)}function draw(reveal){const v=document.querySelector('#scenario').value;let d=100,o=20;if(v==='dplus')d=124;if(v==='dminus')d=76;if(v==='splus')o=-4;if(v==='sminus')o=44;const p=(d+o)/2,q=(d-o)/2;let x=q=>70+q*4.4,y=p=>315-p*2.1;const line=(q1,p1,q2,p2,color,dash='')=>`<line x1="${x(q1)}" y1="${y(p1)}" x2="${x(q2)}" y2="${y(p2)}" stroke="${color}" stroke-width="3" stroke-dasharray="${dash}"/>`;let out=`<path d="M70 20V315H640" stroke="#675c75" fill="none"/><text x="22" y="24">P</text><text x="640" y="342">Q</text>`;out+=line(0,100,95,5,'#c9bbd8','6 5')+line(0,20,95,115,'#a9d7d9','6 5');out+=line(Math.max(0,d-135),Math.min(d,135),Math.min(d,100),Math.max(0,d-100),'#643a91')+line(Math.max(0,-o),Math.max(0,o),Math.min(100,135-o),Math.min(135,o+100),'#087f89');out+='<text x="525" y="295" fill="#643a91">D</text><text x="505" y="35" fill="#087f89">O</text>';if(reveal){out+=`<circle cx="${x(q)}" cy="${y(p)}" r="7" fill="#271c3b"/><path d="M70 ${y(p)}H${x(q)}V315" stroke="#665878" stroke-dasharray="4 4" fill="none"/><text x="10" y="${y(p)+6}">${p}</text><text x="${x(q)-8}" y="342">${q}</text>`}document.querySelector('#chart').innerHTML=out;document.querySelector('#result').textContent=reveal?`Equilibrio: P = ${p}; Q = ${q}. ${({base:'Inicial: P = 60; Q = 40.',dplus:'Mayor demanda: suben precio y cantidad.',dminus:'Menor demanda: bajan precio y cantidad.',splus:'Mayor oferta: baja precio y sube cantidad.',sminus:'Menor oferta: sube precio y baja cantidad.'})[v]} Líneas discontinuas: curvas iniciales.`:'Antes de mostrar el resultado, piensa qué pasa con el precio y la cantidad. Las líneas punteadas muestran la situación inicial.'}document.querySelector('#prev').onclick=()=>show(pos-1);document.querySelector('#next').onclick=()=>show(pos+1);document.querySelectorAll('[data-session]').forEach(b=>b.onclick=()=>show(slides.findIndex(s=>s.session==b.dataset.session)));const dlg=document.querySelector('dialog');document.querySelector('#index').onclick=()=>dlg.showModal();document.querySelector('#close').onclick=()=>dlg.close();document.querySelector('#list').innerHTML=slides.map((s,i)=>`<button data-i="${i}">S${s.session} · ${s.title} <small>(${s.mins} min)</small></button>`).join('');document.querySelector('#list').onclick=e=>{const b=e.target.closest('[data-i]');if(b){show(+b.dataset.i);dlg.close()}};document.querySelector('#full').onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>{})}else document.exitFullscreen?.()};document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT','SUMMARY','BUTTON'].includes(e.target.tagName)||dlg.open)return;if(e.key==='ArrowRight'){e.preventDefault();show(pos+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(pos-1)}});show(0);</script></html>
